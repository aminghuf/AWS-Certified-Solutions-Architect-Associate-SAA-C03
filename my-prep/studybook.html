umber of IAM groups a user can belong to?","options":{"A":"5","B":"10","C":"20","D":"Unlimited"},"answer":["B"],"explanation":"• An IAM user can be a member of up to 10 groups\n• This is an AWS service limit/quota\n• Groups simplify permission management\n• If more complex permissions needed, use multiple policies or roles\nIAM Limits (Key ones for exam):\n• Users per account: 5,000 (default)\n• Groups per account: 300\n• Groups per user: 10\n• Managed policies per user/group/role: 10\n• Inline policy size: 2,048 characters for users, 10,240 for roles","module":"IAM","multi":false,"src":"repo"},{"id":"02-14","q":"A developer accidentally committed AWS access keys to a public GitHub repository. What should be done IMMEDIATELY?","options":{"A":"Change the password of the IAM user","B":"Delete the GitHub repository","C":"Deactivate and delete the exposed access keys","D":"Enable MFA on the account"},"answer":["C"],"explanation":"• Exposed credentials must be deactivated/deleted immediately\n• Prevents unauthorized access using compromised keys\n• Steps: Deactivate keys → Create new keys → Delete old keys → Review CloudTrail\n• Option A: Passwords are separate from access keys\n• Option B: Deleting repo doesn't help if already cloned/indexed\n• Option D: MFA doesn't protect already-exposed keys\nIncident Response Steps:\n1. Deactivate compromised keys immediately\n2. Review CloudTrail for unauthorized activity\n3. Create new access keys\n4. Delete compromised keys\n5. Scan code repositories\n6. Implement secrets management (AWS Secrets Manager, Parameter Store)","module":"IAM","multi":false,"src":"repo"},{"id":"02-15","q":"Which IAM entity can have both trust policy and permissions policy?","options":{"A":"IAM User","B":"IAM Group","C":"IAM Role","D":"IAM Policy"},"answer":["C"],"explanation":"• IAM Roles have two types of policies:\n• Trust Policy: Defines who can assume the role (principal)\n• Permissions Policy: Defines what the role can do (actions)\n• Users and Groups don't have trust policies\n• Policies are documents, not entities with other policies\nTrust Policy Example:\nPermissions Policy Example:","module":"IAM","multi":false,"src":"repo"},{"id":"02-16","q":"A company needs to provide third-party vendors access to specific S3 buckets without creating IAM users. What is the BEST approach?","options":{"A":"Share root account credentials","B":"Create cross-account IAM roles with external ID","C":"Make S3 buckets public","D":"Use S3 pre-signed URLs"},"answer":["B"],"explanation":"• Cross-account roles allow external accounts to access resources\n• External ID adds security layer preventing confused deputy problem\n• Vendor assumes role from their AWS account\n• No need to manage IAM users\nSetup:\n1. Create IAM role in your account\n2. Trust policy allows vendor's AWS account\n3. Include External ID for security\n4. Vendor assumes role using STS AssumeRole\nTrust Policy with External ID:","module":"IAM","multi":false,"src":"repo"},{"id":"02-17","q":"What is the default effect when no IAM policy explicitly allows or denies an action?","options":{"A":"Allow","B":"Deny","C":"Prompt for approval","D":"Log the action"},"answer":["B"],"explanation":"• IAM uses implicit deny by default\n• All actions denied unless explicitly allowed\n• Evaluation Logic: Explicit Deny → Allow → Implicit Deny\n• Cannot override explicit Deny with Allow\n• Must have explicit Allow to perform action\nPolicy Evaluation Flow:\n1. Deny evaluation: If any policy has explicit Deny → DENY\n2. Organizations SCPs: Applied as permission boundary\n3. Resource-based policies: Evaluated\n4. Identity-based policies: If any has Allow → ALLOW\n5. IAM permissions boundaries: Applied as filter\n6. Session policies: Applied for assumed roles\n7. Default: DENY (if no explicit Allow)","module":"IAM","multi":false,"src":"repo"},{"id":"02-18","q":"A company wants to grant temporary access to S3 objects for unauthenticated users for 1 hour. What should be used?","options":{"A":"IAM user credentials","B":"S3 pre-signed URLs","C":"S3 bucket policy","D":"IAM role"},"answer":["B"],"explanation":"• Pre-signed URLs grant time-limited access to S3 objects\n• No AWS credentials needed by end user\n• URL contains authentication information\n• Expires after specified duration\nGenerate Pre-signed URL (AWS CLI):\nUse Cases:\n• Temporary download links\n• Upload forms for unauthenticated users\n• Sharing private content without making public\n• Time-limited access to resources\n• Option A: Requires creating users, not for temporary/anonymous\n• Option C: Bucket policies are not time-limited\n• Option D: Roles require authentication","module":"IAM","multi":false,"src":"repo"},{"id":"02-19","q":"What is the purpose of IAM permissions boundaries?","options":{"A":"To set maximum permissions an IAM entity can have","B":"To grant additional permissions beyond policies","C":"To replace IAM policies","D":"To encrypt IAM credentials"},"answer":["A"],"explanation":"• Permissions boundaries set maximum permissions limit\n• Cannot grant more permissions than boundary allows\n• Even if identity policy allows, boundary can restrict\n• Use Case: Delegate permission management safely","module":"IAM","multi":false,"src":"repo"},{"id":"02-20","q":"Which of the following actions require MFA for the root account according to AWS best practices? (Choose TWO)","options":{"A":"Logging into AWS Console","B":"Changing account settings","C":"Launching EC2 instances","D":"Deleting S3 buckets","E":"Viewing billing information"},"answer":["A","B"],"explanation":"• AWS best practices: Enable MFA on root account immediately\n• Root account should be protected with MFA\n• MFA required for sensitive operations\n• Some actions like changing account settings require root + MFA\nRoot Account Best Practices:\n1. ✅ Enable MFA on root account\n2. ✅ Don't use root for everyday tasks\n3. ✅ Delete root access keys (use IAM users instead)\n4. ✅ Create IAM users for administrative tasks\n5. ✅ Use root only for tasks requiring root\n6. ✅ Secure root credentials (password manager)\nTasks Requiring Root Account:\n• Change account settings\n• Close AWS account\n• Change AWS Support plan\n• Restore IAM user permissions\n• Register as seller in Reserved Instance Marketplace\n• Configure S3 bucket for MFA Delete\n• Sign up for GovCloud","module":"IAM","multi":true,"src":"repo"},{"id":"03-1","q":"A company needs to run a batch processing job that can tolerate interruptions and must minimize costs. Which EC2 pricing model should be used?","options":{"A":"On-Demand Instances","B":"Reserved Instances","C":"Spot Instances","D":"Dedicated Hosts"},"answer":["C"],"explanation":"• Spot Instances offer up to 90% discount compared to On-Demand\n• Can be interrupted with 2-minute warning when AWS needs capacity\n• Perfect for fault-tolerant, flexible workloads\n• Ideal Use Cases: Batch jobs, data analysis, image processing, CI/CD\n• Option A: On-Demand is most expensive\n• Option B: Reserved requires 1-3 year commitment\n• Option D: Dedicated Hosts are most expensive, for compliance","module":"Compute","multi":false,"src":"repo"},{"id":"03-2","q":"An application experiences predictable traffic spikes every Monday at 9 AM. What is the MOST cost-effective Auto Scaling approach?","options":{"A":"Target Tracking Scaling","B":"Simple Scaling","C":"Step Scaling","D":"Scheduled Scaling"},"answer":["D"],"explanation":"• Scheduled Scaling scales based on predefined schedule\n• Perfect for predictable traffic patterns\n• Scales before traffic spike occurs (proactive)\n• Most cost-effective for known patterns\nSchedule Example:\n• Option A: Target Tracking is reactive, scales after metric changes\n• Option B/C: Step/Simple scaling are reactive\n• Scheduled = Proactive, Target/Step/Simple = Reactive","module":"Compute","multi":false,"src":"repo"},{"id":"03-3","q":"A web application requires high availability across multiple Availability Zones with automatic distribution of traffic. Which load balancer should be used for HTTP/HTTPS traffic with advanced routing?","options":{"A":"Classic Load Balancer","B":"Application Load Balancer","C":"Network Load Balancer","D":"Gateway Load Balancer"},"answer":["B"],"explanation":"• Application Load Balancer (ALB) operates at Layer 7 (HTTP/HTTPS)\n• Advanced routing: path-based, host-based, header-based\n• WebSocket and HTTP/2 support\n• Perfect for modern web applications\nALB Features:\n• Path-based routing: `/api/*` → API servers, `/images/*` → image servers\n• Host-based routing: `api.example.com` vs `www.example.com`\n• Query string/header routing\n• Fixed response, redirects\n• AWS WAF integration\n• Authentication (OIDC, Cognito)\nLoad Balancer Comparison:\n• CLB: Legacy, Layer 4/7, basic\n• ALB: Layer 7, HTTP/HTTPS, advanced routing\n• NLB: Layer 4, TCP/UDP, ultra-high performance, static IP\n• GLB: Layer 3, third-party virtual appliances","module":"Compute","multi":false,"src":"repo"},{"id":"03-4","q":"A microservices application needs a load balancer that can handle millions of requests per second with ultra-low latency and static IP addresses. Which load balancer should be used?","options":{"A":"Application Load Balancer","B":"Network Load Balancer","C":"Classic Load Balancer","D":"CloudFront"},"answer":["B"],"explanation":"• Network Load Balancer (NLB) operates at Layer 4 (TCP/UDP/TLS)\n• Handles millions of requests per second\n• Ultra-low latency (microseconds)\n• Static IP addresses (one per AZ)\n• Preserves source IP address\nNLB Use Cases:\n• Extreme performance requirements\n• Static/Elastic IP needed (whitelist in firewalls)\n• TCP/UDP traffic\n• PrivateLink endpoints\n• Game servers, IoT, real-time applications\nNLB vs ALB:\n• NLB: Layer 4, faster, static IP, TCP/UDP\n• ALB: Layer 7, advanced routing, HTTP/HTTPS","module":"Compute","multi":false,"src":"repo"},{"id":"03-5","q":"A company wants to run code in response to events without managing servers. The code should execute only when triggered and scale automatically. Which service should be used?","options":{"A":"Amazon EC2 with Auto Scaling","B":"AWS Lambda","C":"Amazon ECS","D":"AWS Elastic Beanstalk"},"answer":["B"],"explanation":"• AWS Lambda is serverless compute service\n• Event-driven execution\n• Automatic scaling (1 to 1000s of concurrent executions)\n• Pay only for compute time (per millisecond)\n• No server management\nLambda Characteristics:\n• Max execution time: 15 minutes\n• Memory: 128 MB to 10,240 MB\n• Deployment package: 50 MB (zipped), 250 MB (unzipped)\n• Concurrent executions: 1000 (default, can increase)\n• Billing: Per request + compute time (GB-seconds)\nLambda Triggers:\n• API Gateway (REST APIs)\n• S3 events\n• DynamoDB Streams\n• EventBridge (scheduled/event-based)\n• SNS, SQS\n• Kinesis","module":"Compute","multi":false,"src":"repo"},{"id":"03-6","q":"An application running on EC2 instances experiences variable traffic and needs to maintain 50% average CPU utilization. What Auto Scaling policy should be configured?","options":{"A":"Simple Scaling","B":"Step Scaling","C":"Target Tracking Scaling","D":"Predictive Scaling"},"answer":["C"],"explanation":"• Target Tracking Scaling automatically adjusts capacity to maintain target metric\n• Specify target value (e.g., 50% CPU), Auto Scaling does the rest\n• Easiest to configure and manage\n• Creates and manages CloudWatch alarms automatically\nConfiguration Example:\nPredefined Metrics:\n• `ASGAverageCPUUtilization`\n• `ASGAverageNetworkIn`\n• `ASGAverageNetworkOut`\n• `ALBRequestCountPerTarget`\nScaling Policy Types:\n• Target Tracking: Maintain specific metric value (EASIEST)\n• Step: Add/remove capacity based on CloudWatch alarm thresholds\n• Simple: Single scaling adjustment (legacy)\n• Predictive: ML-based forecasting","module":"Compute","multi":false,"src":"repo"},{"id":"03-7","q":"A company needs to run Docker containers without managing EC2 instances. Which service should be used?","options":{"A":"Amazon ECS with EC2 launch type","B":"Amazon ECS with Fargate launch type","C":"Amazon EKS","D":"AWS Elastic Beanstalk"},"answer":["B"],"explanation":"• AWS Fargate is serverless container platform\n• No EC2 instance management required\n• Pay for vCPU and memory resources used\n• Works with both ECS and EKS\nContainer Service Options:\n| Service | Description | Management |\n|---------|-------------|------------|\n| ECS + EC2 | Container orchestration on EC2 | Manage instances |\n| ECS + Fargate | Serverless containers | No instance management |\n| EKS + EC2 | Kubernetes on EC2 | Manage instances + K8s |\n| EKS + Fargate | Serverless Kubernetes | No instance management |\nFargate Benefits:\n• No instance provisioning/scaling\n• No patching/securing instances\n• Pay per task\n• Simpler operations\nWhen to use Fargate vs EC2:\n• Fargate: Simplicity, less operational overhead\n• EC2: Need specific instance types, GPU, cost optimization for sustained workloads","module":"Compute","multi":false,"src":"repo"},{"id":"03-8","q":"An EC2 instance needs low-latency, high-throughput connectivity to other instances in the same cluster. Which placement group should be used?","options":{"A":"Cluster Placement Group","B":"Spread Placement Group","C":"Partition Placement Group","D":"No placement group needed"},"answer":["A"],"explanation":"• Cluster Placement Group places instances close together in single AZ\n• Low-latency network (10 Gbps between instances)\n• High throughput, enhanced networking\n• All instances in same rack/physical proximity\nPlacement Group Types:\n| Type | Purpose | AZ | Max Instances |\n|------|---------|----|----|\n| Cluster | Low latency, high throughput | Single AZ | Limited by instance type |\n| Spread | Reduce correlated failures | Multi-AZ | 7 per AZ |\n| Partition | Large distributed workloads | Multi-AZ | 7 partitions per AZ |\nUse Cases:\n• Cluster: HPC, big data, low-latency apps\n• Spread: Critical applications (each instance separate rack)\n• Partition: Hadoop, Cassandra, Kafka (partition = rack)\nLimitations:\n• Cluster: Single AZ only\n• Spread: Max 7 instances per AZ\n• Not all instance types supported","module":"Compute","multi":false,"src":"repo"},{"id":"03-9","q":"A company wants to deploy a web application with automatic scaling, load balancing, and health monitoring without managing infrastructure. Which service should be used?","options":{"A":"AWS Lambda","B":"Amazon EC2 with Auto Scaling","C":"AWS Elastic Beanstalk","D":"Amazon Lightsail"},"answer":["C"],"explanation":"• AWS Elastic Beanstalk is PaaS (Platform as a Service)\n• Upload code, Beanstalk handles deployment\n• Automatic provisioning: EC2, ALB, Auto Scaling, RDS, monitoring\n• Multiple platforms: Java, .NET, PHP, Node.js, Python, Ruby, Go, Docker\nElastic Beanstalk Features:\n• Automatic capacity provisioning\n• Load balancing\n• Auto Scaling\n• Health monitoring\n• Platform updates\n• Still have full control over resources (not completely abstracted)\nDeployment Options:\n• All at once: Fastest, downtime\n• Rolling: Partial batches, reduced capacity\n• Rolling with additional batch: Maintains full capacity\n• Immutable: New instances, safest\n• Blue/Green: Manual via swap URLs\nBeanstalk vs Others:\n• Lambda: Functions, not full applications\n• EC2 + Auto Scaling: More manual configuration\n• Lightsail: Simpler, less scalable","module":"Compute","multi":false,"src":"repo"},{"id":"03-10","q":"An application requires guaranteed capacity reservation for EC2 instances in a specific Availability Zone without long-term commitment. Which option should be used?","options":{"A":"Reserved Instances","B":"Savings Plans","C":"On-Demand Capacity Reservations","D":"Spot Instances"},"answer":["C"],"explanation":"• On-Demand Capacity Reservations reserve capacity in specific AZ\n• No long-term commitment (can cancel anytime)\n• Charged at On-Demand rates whether used or not\n• Ensures capacity availability when needed\nCapacity Options Comparison:\n| Option | Commitment | Discount | Capacity Guarantee |\n|--------|------------|----------|-------------------|\n| On-Demand | None | None | No guarantee |\n| Reserved | 1-3 years | Up to 72% | Yes (regional or zonal) |\n| Savings Plans | 1-3 years | Up to 66% | No |\n| Capacity Reservations | None | None | Yes (zonal) |\n| Spot | None | Up to 90% | No (can be interrupted) |\nUse Case:\n• Disaster recovery (reserve capacity but don't always run)\n• Business-critical events (Black Friday)\n• Regulatory/compliance requirements\nCost Optimization: Combine Capacity Reservation with Savings Plan","module":"Compute","multi":false,"src":"repo"},{"id":"03-11","q":"A Lambda function is timing out after 3 seconds when processing large files. What should be changed?","options":{"A":"Increase Lambda memory allocation","B":"Increase Lambda timeout setting","C":"Use Lambda layers","D":"Switch to EC2"},"answer":["B"],"explanation":"• Lambda default timeout is 3 seconds\n• Can be increased up to 15 minutes (900 seconds)\n• Timeout configuration is separate from memory\nLambda Configuration:\n• Memory: 128 MB to 10,240 MB (10 GB)\n• Timeout: 1 second to 900 seconds (15 minutes)\n• CPU scales with memory (1,792 MB = 1 vCPU)\n• Ephemeral storage (/tmp): 512 MB to 10,240 MB\nPerformance Tuning:\n1. Increase timeout for long-running tasks\n2. Increase memory if CPU-bound (CPU scales with memory)\n3. Optimize code\n4. Use async patterns for very long tasks\nWhen Lambda is NOT suitable:\n• Tasks > 15 minutes\n• Need GPU\n• Stateful applications\n• Real-time latency requirements (cold starts)","module":"Compute","multi":false,"src":"repo"},{"id":"03-12","q":"A company wants to run EC2 instances with dedicated physical servers for compliance requirements. Which option should be used?","options":{"A":"Dedicated Instances","B":"Dedicated Hosts","C":"Reserved Instances","D":"Spot Instances"},"answer":["B"],"explanation":"• Dedicated Hosts: Physical server dedicated to your use\n• Visibility into sockets, cores, host ID\n• Support for BYOL (Bring Your Own License) - Windows Server, SQL Server\n• Meet compliance requirements\n• Most expensive option\nDedicated Instances vs Dedicated Hosts:\n| Feature | Dedicated Instances | Dedicated Hosts |\n|---------|-------------------|----------------|\n| Isolation | Instance-level | Physical server |\n| Visibility | No hardware visibility | Socket/core visibility |\n| BYOL | Not supported | Supported |\n| Placement | Automatic | Control placement |\n| Billing | Per instance | Per host |\n| Use Case | Compliance (soft requirement) | BYOL, compliance (strict) |\nUse Cases for Dedicated Hosts:\n• Server-bound software licenses\n• Regulatory compliance\n• Track physical host usage","module":"Compute","multi":false,"src":"repo"},{"id":"03-13","q":"An Auto Scaling group has 10 instances. An administrator manually terminates 3 instances. What happens next?","options":{"A":"Auto Scaling terminates 3 more instances","B":"Auto Scaling launches 3 new instances","C":"Auto Scaling does nothing","D":"Auto Scaling sends an alert"},"answer":["B"],"explanation":"• Auto Scaling maintains desired capacity\n• If instances are terminated (manually or automatically), ASG replaces them\n• Ensures desired count is maintained\nAuto Scaling Group Configuration:\n• Minimum: Minimum number of instances\n• Desired: Target number of instances\n• Maximum: Maximum number of instances\nScaling Activities:\n• Scale out: Launch instances (desired < current)\n• Scale in: Terminate instances (desired > current)\n• Replace unhealthy: Terminate and replace\n• Rebalance across AZs\nInstance Protection:\n• Can enable scale-in protection on specific instances\n• Prevents Auto Scaling from terminating protected instances\n• Manual termination still works","module":"Compute","multi":false,"src":"repo"},{"id":"03-14","q":"A batch processing application uses Lambda functions but needs to coordinate multiple steps with error handling and retries. Which service should be used?","options":{"A":"Amazon SQS","B":"Amazon SNS","C":"AWS Step Functions","D":"Amazon EventBridge"},"answer":["C"],"explanation":"• AWS Step Functions orchestrates serverless workflows\n• Coordinate multiple Lambda functions\n• Built-in error handling, retries, parallel execution\n• Visual workflow designer\nStep Functions Features:\n• State machine: Define workflow as states\n• Error handling: Catch errors, retry logic\n• Parallel execution: Run steps concurrently\n• Wait states: Delays between steps\n• Choice states: Conditional logic\n• Map states: Iterate over arrays\nWorkflow Types:\n• Standard: Long-running (up to 1 year), exactly-once execution\n• Express: Short-lived (5 min), at-least-once, high-rate\nUse Cases:\n• ETL pipelines\n• Order processing\n• Video processing\n• Machine learning workflows\nStep Functions vs Alternatives:\n• SQS: Message queue, no orchestration\n• SNS: Pub/sub messaging, no orchestration\n• EventBridge: Event routing, simpler workflows","module":"Compute","multi":false,"src":"repo"},{"id":"03-15","q":"An application needs consistent performance with baseline CPU and ability to burst above baseline when needed. Which EC2 instance type should be used?","options":{"A":"M5 (General Purpose)","B":"C5 (Compute Optimized)","C":"T3 (Burstable Performance)","D":"R5 (Memory Optimized)"},"answer":["C"],"explanation":"• T3/T4g instances are burstable performance instances\n• Baseline CPU performance with credit system\n• Accumulate CPU credits when below baseline\n• Burst above baseline using credits\n• Cost-effective for variable workloads\nT3 CPU Credits:\n• Baseline performance depends on instance size\n• Earn credits when CPU < baseline\n• Spend credits when CPU > baseline\n• Unlimited mode: Can burst beyond credits (additional charges)\nT3 Instance Types:\n• t3.nano: 5% baseline\n• t3.micro: 10% baseline\n• t3.small: 20% baseline\n• t3.medium: 20% baseline\n• t3.large: 30% baseline\nUse Cases:\n• Web servers, dev/test\n• Small databases\n• Code repositories\n• Microservices\nWhen NOT to use T3:\n• Sustained high CPU usage\n• Predictable high performance needs\n• Use C5/M5 for sustained performance","module":"Compute","multi":false,"src":"repo"},{"id":"03-16","q":"A company wants to deploy containerized applications using Kubernetes without managing the control plane. Which service should be used?","options":{"A":"Amazon ECS","B":"Amazon EKS","C":"AWS Fargate","D":"AWS Elastic Beanstalk"},"answer":["B"],"explanation":"• Amazon EKS (Elastic Kubernetes Service) is managed Kubernetes\n• AWS manages Kubernetes control plane\n• Compatible with standard Kubernetes tools (kubectl, Helm)\n• Multi-AZ control plane for high availability\nEKS Features:\n• Managed K8s control plane (etcd, API server)\n• Automatic upgrades and patches\n• Integrate with AWS services (IAM, VPC, ALB, CloudWatch)\n• CNCF certified (standard Kubernetes)\nEKS Worker Nodes Options:\n• Self-managed nodes: You manage EC2 instances\n• Managed node groups: AWS manages EC2 lifecycle\n• Fargate: Serverless, no node management\nECS vs EKS:\n• ECS: AWS-proprietary, simpler, tight AWS integration\n• EKS: Standard Kubernetes, portable, more complex, existing K8s expertise\nWhen to use EKS:\n• Existing Kubernetes workloads\n• Kubernetes expertise in team\n• Multi-cloud/hybrid requirements\n• Standard Kubernetes tools needed","module":"Compute","multi":false,"src":"repo"},{"id":"03-17","q":"An Auto Scaling group needs to ensure that newly launched instances are ready to serve traffic before receiving requests. What should be configured?","options":{"A":"EC2 Status Checks","B":"ELB Health Checks","C":"Auto Scaling Health Check Grace Period","D":"CloudWatch Alarms"},"answer":["C"],"explanation":"• Health Check Grace Period gives instances time to boot and pass checks\n• Prevents premature termination during initialization\n• Default: 300 seconds (5 minutes)\n• Should be longer than application startup time\nAuto Scaling Health Checks:\n• EC2 health check: Instance running (default)\n• ELB health check: Instance passes load balancer health checks\n• Grace period applies to both types\nRecommended Configuration:\n1. Set grace period > application startup time\n2. Enable ELB health checks\n3. Configure ELB health check with appropriate interval/threshold","module":"Compute","multi":false,"src":"repo"},{"id":"03-18","q":"A company wants to migrate lift-and-shift Windows applications to AWS without refactoring. Which compute option is MOST appropriate?","options":{"A":"AWS Lambda","B":"Amazon ECS","C":"Amazon EC2","D":"AWS Fargate"},"answer":["C"],"explanation":"• Amazon EC2 for lift-and-shift migrations\n• Run Windows Server, install applications as-is\n• Minimal refactoring required\n• Full control over OS and configuration\nMigration Strategies (6 R's):\n1. Rehost (Lift-and-Shift): Move as-is to EC2\n2. Replatform (Lift-Tinker-Shift): Minor optimizations\n3. Repurchase: Move to SaaS\n4. Refactor/Re-architect: Redesign for cloud-native\n5. Retire: Decommission\n6. Retain: Keep on-premises\nLift-and-Shift Approach:\n• Quick migration\n• Minimal risk\n• Can optimize later\n• Use AWS Application Migration Service (MGN)\nOther Options Not Suitable:\n• Lambda: Requires code changes, event-driven\n• ECS/Fargate: Requires containerization\n• EC2 is best for \"as-is\" Windows applications","module":"Compute","multi":false,"src":"repo"},{"id":"03-19","q":"An application running on Lambda is invoked by S3 events. During peak times, thousands of files are uploaded simultaneously. How should Lambda handle this?","options":{"A":"Increase Lambda memory","B":"Enable Lambda reserved concurrency","C":"Lambda automatically scales concurrently","D":"Use Step Functions"},"answer":["C"],"explanation":"• Lambda automatically scales to handle concurrent invocations\n• Each S3 event triggers separate Lambda invocation\n• Default account concurrency: 1000 (can request increase)\n• No configuration needed for basic scaling\nLambda Concurrency Types:\n• Account concurrency: Total concurrent executions across all functions (1000 default)\n• Reserved concurrency: Dedicated concurrency for specific function\n• Provisioned concurrency: Pre-initialized instances (reduce cold starts)\nWhen to use Reserved Concurrency:\n• Limit function concurrency (prevent overwhelming downstream)\n• Guarantee concurrency for critical functions\n• Prevent one function from consuming all account concurrency","module":"Compute","multi":false,"src":"repo"},{"id":"03-20","q":"A web application needs to maintain session state. The application runs on multiple EC2 instances behind an Application Load Balancer. How should session state be managed?","options":{"A":"Store session data on EC2 instance local storage","B":"Enable sticky sessions on ALB","C":"Store session data in Amazon ElastiCache or DynamoDB","D":"Use NLB instead of ALB"},"answer":["C"],"explanation":"• External session storage (ElastiCache/DynamoDB) is best practice\n• Sessions accessible from any instance\n• Survives instance failures\n• True stateless architecture\nSession Management Options:\n| Option | Pros | Cons |\n|--------|------|------|\n| ElastiCache/DynamoDB | Stateless, scalable, resilient | Additional service |\n| Sticky Sessions | Simple | Uneven load, not resilient |\n| Local Storage | Fast | Lost on instance failure |\nWhy ElastiCache/DynamoDB is Better:\n• ✅ Any instance can serve any request\n• ✅ Auto Scaling works properly\n• ✅ Instance failure doesn't lose sessions\n• ✅ Better load distribution\nSticky Sessions Issues:\n• Uneven instance utilization\n• New instances get no traffic initially\n• Instance failure = lost sessions\n• Use only if refactoring is not possible","module":"Compute","multi":false,"src":"repo"},{"id":"03-21","q":"A company needs to run AWS services in its own data center to meet strict data residency requirements, while maintaining a consistent hybrid cloud experience. Which AWS service should they use?","options":{"A":"AWS Outposts","B":"Amazon EC2 Dedicated Hosts","C":"AWS Snowball Edge","D":"AWS Direct Connect"},"answer":["A"],"explanation":"• AWS Outposts brings native AWS services, infrastructure, and operating models to on-premises data centers\n• Provides a consistent hybrid experience\n• Supports EC2, EBS, RDS, ECS, EKS, S3, and more\n• Dedicated Hosts are for compliance, not hybrid cloud\n• Snowball Edge is for edge computing and data transfer, not full AWS services\n• Direct Connect is for network connectivity, not running AWS services on-premises","module":"Compute","multi":false,"src":"repo"},{"id":"03-22","q":"A research organization needs to run large-scale, high-throughput batch jobs on AWS with automatic job scheduling and resource provisioning. Which service should they use?","options":{"A":"AWS Batch","B":"Amazon EC2 Auto Scaling","C":"AWS Lambda","D":"Amazon EMR"},"answer":["A"],"explanation":"• AWS Batch is a fully managed batch computing service\n• Automatically provisions compute resources and schedules jobs\n• Supports Docker containers and EC2/Spot/Fargate\n• EC2 Auto Scaling is for scaling instances, not job scheduling\n• Lambda is for short-lived, event-driven compute\n• EMR is for big data processing, not general batch jobs","module":"Compute","multi":false,"src":"repo"},{"id":"03-23","q":"A development team wants to share and deploy serverless applications published by AWS and third parties. Which AWS service should they use?","options":{"A":"AWS Serverless Application Repository","B":"AWS Marketplace","C":"AWS Lambda Layers","D":"AWS CloudFormation StackSets"},"answer":["A"],"explanation":"• AWS Serverless Application Repository is a managed repository for serverless apps\n• Allows sharing and deployment of Lambda-based applications\n• Marketplace is for commercial software, not serverless apps\n• Lambda Layers are for code sharing, not full applications\n• CloudFormation StackSets is for multi-account deployments","module":"Compute","multi":false,"src":"repo"},{"id":"03-24","q":"A company wants to run VMware workloads on AWS with seamless integration and management using familiar VMware tools. Which solution should they use?","options":{"A":"VMware Cloud on AWS","B":"AWS Outposts","C":"Amazon EC2 Dedicated Hosts","D":"AWS Snowball Edge"},"answer":["A"],"explanation":"• VMware Cloud on AWS integrates VMware vSphere, NSX, and vSAN with AWS infrastructure\n• Enables seamless migration and hybrid operations\n• Managed by both AWS and VMware\n• Outposts is for running AWS services on-premises\n• Dedicated Hosts are for compliance\n• Snowball Edge is for edge computing","module":"Compute","multi":false,"src":"repo"},{"id":"03-25","q":"A global enterprise needs to deploy AWS compute and storage services at the edge of mobile networks to deliver ultra-low latency applications. Which AWS service should they use?","options":{"A":"AWS Wavelength","B":"AWS Outposts","C":"Amazon CloudFront","D":"AWS Direct Connect"},"answer":["A"],"explanation":"• AWS Wavelength brings AWS services to the edge of 5G networks\n• Enables ultra-low latency applications for mobile and edge devices\n• Outposts is for on-premises data centers\n• CloudFront is a CDN, not edge compute\n• Direct Connect is for network connectivity","module":"Compute","multi":false,"src":"repo"},{"id":"03-26","q":"A company wants to run Amazon ECS and EKS workloads on its own infrastructure outside AWS, managed from the AWS Console. Which services should they use?","options":{"A":"Amazon ECS Anywhere and Amazon EKS Anywhere","B":"AWS Outposts","C":"AWS Fargate","D":"Amazon EC2 Dedicated Hosts"},"answer":["A"],"explanation":"• ECS Anywhere and EKS Anywhere extend container orchestration to on-premises infrastructure\n• Managed from AWS Console\n• Outposts is for running AWS infrastructure on-premises\n• Fargate is for serverless containers in AWS\n• Dedicated Hosts are for compliance","module":"Compute","multi":false,"src":"repo"},{"id":"03-27","q":"A team needs a managed, scalable Apache Cassandra-compatible database for their application. Which AWS service should they use?","options":{"A":"Amazon Keyspaces","B":"Amazon DynamoDB","C":"Amazon RDS for PostgreSQL","D":"Amazon Aurora"},"answer":["A"],"explanation":"• Amazon Keyspaces is a managed Cassandra-compatible database\n• Supports Cassandra Query Language (CQL)\n• DynamoDB is NoSQL but not Cassandra-compatible\n• RDS and Aurora are relational databases","module":"Compute","multi":false,"src":"repo"},{"id":"03-28","q":"A financial institution needs a fully managed, immutable, cryptographically verifiable ledger database. Which AWS service should they use?","options":{"A":"Amazon QLDB","B":"Amazon Aurora","C":"Amazon RDS","D":"Amazon DynamoDB"},"answer":["A"],"explanation":"• Amazon QLDB (Quantum Ledger Database) is a fully managed ledger database\n• Provides immutable, cryptographically verifiable transaction log\n• Aurora, RDS, and DynamoDB are not ledger databases","module":"Compute","multi":false,"src":"repo","note":"Heads-up: Amazon QLDB reached end of support on 31 July 2025. Older question banks still use it as the 'immutable ledger' answer."},{"id":"04-1","q":"A company needs to store frequently accessed data with the lowest latency and highest throughput. Cost is not the primary concern. Which S3 storage class should be used?","options":{"A":"S3 Standard","B":"S3 Intelligent-Tiering","C":"S3 Standard-IA","D":"S3 One Zone-IA"},"answer":["A"],"explanation":"• S3 Standard provides:\n• Millisecond latency\n• High throughput\n• 99.99% availability\n• 11 9's durability\n• Designed for frequently accessed data\nS3 Storage Classes Comparison:\n• Standard: Frequent access, highest cost\n• Intelligent-Tiering: Unknown/changing patterns, automatic tiering\n• Standard-IA: Infrequent access, lower cost, retrieval fees\n• One Zone-IA: Infrequent, single AZ, lowest IA cost\n• Glacier: Archive, minutes to hours retrieval\n• Glacier Deep Archive: Long-term archive, 12+ hours retrieval","module":"Storage","multi":false,"src":"repo"},{"id":"04-2","q":"A company stores infrequently accessed data in S3 Standard-IA. They need to access this data immediately when required. What is the retrieval time?","options":{"A":"12 hours","B":"3-5 hours","C":"1-5 minutes","D":"Milliseconds (immediate)"},"answer":["D"],"explanation":"• S3 Standard-IA provides immediate access (milliseconds)\n• \"IA\" means Infrequent Access, not slow access\n• Lower storage cost than Standard\n• Retrieval fees apply per GB\n• Minimum storage duration: 30 days\n• Minimum object size: 128 KB\nS3 Retrieval Times:\n• Standard/Standard-IA/One Zone-IA: Milliseconds\n• Intelligent-Tiering: Milliseconds\n• Glacier Instant Retrieval: Milliseconds\n• Glacier Flexible Retrieval: \n• Expedited: 1-5 minutes\n• Standard: 3-5 hours\n• Bulk: 5-12 hours\n• Glacier Deep Archive:\n• Standard: 12 hours\n• Bulk: 48 hours","module":"Storage","multi":false,"src":"repo"},{"id":"04-3","q":"A company needs to store compliance data that must be retained for 7 years and accessed once or twice per year. Cost optimization is critical. Which storage solution is MOST cost-effective?","options":{"A":"S3 Standard","B":"S3 Glacier Flexible Retrieval","C":"S3 Glacier Deep Archive","D":"S3 Intelligent-Tiering"},"answer":["C"],"explanation":"• S3 Glacier Deep Archive is cheapest S3 storage class\n• Designed for long-term retention (7-10+ years)\n• Retrieval time: 12-48 hours (acceptable for rare access)\n• Lowest cost per GB\n• Perfect for compliance, regulatory archives\nCost Comparison (approximate):\n• Deep Archive: $0.00099/GB/month (cheapest)\n• Glacier Flexible: $0.0036/GB/month\n• Standard-IA: $0.0125/GB/month\n• Standard: $0.023/GB/month\nWhen to Use:\n• Deep Archive: Rarely accessed, 7+ years retention\n• Glacier Flexible: Occasionally accessed archives\n• Standard-IA: Monthly access\n• Standard: Frequent access","module":"Storage","multi":false,"src":"repo"},{"id":"04-4","q":"A web application serves static content (images, CSS, JS) to global users. The content is stored in S3. What is the BEST way to improve performance and reduce latency?","options":{"A":"Enable S3 Transfer Acceleration","B":"Use CloudFront with S3 as origin","C":"Enable S3 Cross-Region Replication","D":"Use S3 Standard storage class"},"answer":["B"],"explanation":"• CloudFront is AWS's CDN (Content Delivery Network)\n• Caches content at 400+ edge locations globally\n• Reduces latency for users worldwide\n• Reduces load on origin S3 bucket\nCloudFront Benefits:\n• Low latency (content served from nearest edge)\n• High transfer speeds\n• DDoS protection (AWS Shield)\n• SSL/TLS support\n• Reduced S3 data transfer costs\nOther Options:\n• Transfer Acceleration: Speeds up uploads to S3, not downloads\n• Cross-Region Replication: Multi-region redundancy, not CDN\n• Storage class: Doesn't affect delivery performance","module":"Storage","multi":false,"src":"repo"},{"id":"04-5","q":"A company needs block storage for an EC2 instance running a database that requires consistent high IOPS. Which storage option should be used?","options":{"A":"Instance Store","B":"EBS General Purpose SSD (gp3)","C":"EBS Provisioned IOPS SSD (io2)","D":"Amazon EFS"},"answer":["C"],"explanation":"• EBS Provisioned IOPS SSD (io2/io2 Block Express) for high-performance databases\n• Consistent IOPS performance\n• Up to 64,000 IOPS per volume (io2)\n• Up to 256,000 IOPS (io2 Block Express)\n• 99.999% durability\nEBS Volume Types:\n| Type | Use Case | IOPS | Throughput |\n|------|----------|------|------------|\n| gp3 | General purpose | 16,000 | 1,000 MB/s |\n| io2 | High-performance databases | 64,000 | 1,000 MB/s |\n| io2 Block Express | Largest databases | 256,000 | 4,000 MB/s |\n| st1 | Big data, data warehouses | 500 | 500 MB/s |\n| sc1 | Cold storage | 250 | 250 MB/s |\nWhen to Use:\n• io2: Databases needing high, consistent IOPS\n• gp3: Most workloads, cost-effective\n• st1: Throughput-intensive, sequential\n• Instance Store: Temporary, highest performance","module":"Storage","multi":false,"src":"repo"},{"id":"04-6","q":"An application requires shared file storage accessible from multiple EC2 instances across multiple Availability Zones using NFS protocol. Which service should be used?","options":{"A":"Amazon EBS","B":"Amazon S3","C":"Amazon EFS","D":"Instance Store"},"answer":["C"],"explanation":"• Amazon EFS (Elastic File System) provides:\n• Shared NFS file system\n• Multi-AZ access\n• Automatic scaling\n• Linux-compatible (NFS v4)\n• Concurrent access from 1000s of instances\nStorage Service Comparison:\n| Service | Protocol | Multi-Instance | Multi-AZ | Use Case |\n|---------|----------|----------------|----------|----------|\n| EBS | Block | No (single instance) | No | Databases, boot volumes |\n| EFS | NFS | Yes | Yes | Shared file storage |\n| FSx for Windows | SMB | Yes | Yes | Windows file shares |\n| S3 | HTTP/S | Yes | Yes | Object storage |\nEFS Performance Modes:\n• General Purpose: Low latency, most workloads\n• Max I/O: Higher latency, massive parallel access\nEFS Throughput Modes:\n• Bursting: Throughput scales with size\n• Provisioned: Set throughput independent of size","module":"Storage","multi":false,"src":"repo"},{"id":"04-7","q":"A company wants to automatically move S3 objects to cheaper storage classes based on access patterns. They don't want to manage this manually. What should they use?","options":{"A":"S3 Lifecycle Policies","B":"S3 Intelligent-Tiering","C":"Manual scripts","D":"AWS Lambda functions"},"answer":["B"],"explanation":"• S3 Intelligent-Tiering automatically moves objects between tiers\n• Monitors access patterns\n• No retrieval fees (unlike IA classes)\n• Small monthly monitoring fee per object\nIntelligent-Tiering Access Tiers:\n1. Frequent Access: Default, accessed frequently\n2. Infrequent Access: 30 days no access\n3. Archive Instant Access: 90 days no access\n4. Archive Access (optional): 90-270 days no access\n5. Deep Archive Access (optional): 180-730 days no access\nIntelligent-Tiering vs Lifecycle:\n• Intelligent-Tiering: Automatic based on access, no retrieval fees\n• Lifecycle: Rule-based transitions, set schedule\nWhen to Use:\n• Intelligent-Tiering: Unknown or changing access patterns\n• Lifecycle: Known patterns (e.g., move to Glacier after 90 days)","module":"Storage","multi":false,"src":"repo"},{"id":"04-8","q":"A company needs to ensure S3 objects are encrypted at rest. They want AWS to manage the encryption keys. Which encryption method should be used?","options":{"A":"SSE-C (Customer-Provided Keys)","B":"SSE-S3 (S3-Managed Keys)","C":"SSE-KMS (KMS-Managed Keys)","D":"Client-Side Encryption"},"answer":["B"],"explanation":"• SSE-S3 uses S3-managed encryption keys\n• AWS handles all key management\n• AES-256 encryption\n• No additional cost\n• Simplest encryption option\nS3 Encryption Options:\n| Method | Key Management | Cost | Use Case |\n|--------|----------------|------|----------|\n| SSE-S3 | AWS manages | Free | Simple encryption |\n| SSE-KMS | AWS KMS | KMS API costs | Audit trail, key rotation |\n| SSE-C | Customer provides | Free | Customer controls keys |\n| Client-Side | Customer | Free | Encrypt before upload |\nSSE-KMS Benefits (when needed):\n• Audit trail (CloudTrail)\n• Key rotation\n• Granular permissions\n• Envelope encryption\nFor exam: If question says \"AWS manages keys, simplest\", choose SSE-S3","module":"Storage","multi":false,"src":"repo"},{"id":"04-9","q":"A company needs to replicate S3 objects from us-east-1 to eu-west-1 for disaster recovery. What feature should be enabled?","options":{"A":"S3 Versioning","B":"S3 Cross-Region Replication (CRR)","C":"S3 Same-Region Replication (SRR)","D":"S3 Transfer Acceleration"},"answer":["B"],"explanation":"• S3 Cross-Region Replication (CRR) replicates objects across regions\n• Automatic, asynchronous replication\n• Requires versioning enabled on both buckets\n• Use cases: Compliance, disaster recovery, latency reduction\nCRR Requirements:\n1. Versioning enabled on source and destination\n2. Appropriate IAM permissions\n3. Different AWS regions\nCRR vs SRR:\n• CRR: Different regions, disaster recovery, compliance\n• SRR: Same region, log aggregation, replication between accounts\nReplication Options:\n• Replication Time Control (RTC): 99.99% replicated within 15 minutes\n• Delete marker replication: Optional\n• Existing object replication: Manual batch operation","module":"Storage","multi":false,"src":"repo"},{"id":"04-10","q":"An application generates temporary data that needs high-performance storage. The data can be lost if the instance stops. Which storage should be used?","options":{"A":"EBS General Purpose SSD","B":"EBS Provisioned IOPS SSD","C":"Instance Store","D":"Amazon EFS"},"answer":["C"],"explanation":"• Instance Store provides:\n• Ephemeral storage (temporary)\n• Physically attached to host\n• Highest IOPS performance\n• No additional cost\n• Data lost on instance stop/termination\nInstance Store Characteristics:\n• Performance: Millions of IOPS possible\n• Persistence: Data lost on stop/terminate\n• Size: Varies by instance type\n• Use cases: Cache, buffers, temporary data, scratch data\nInstance Store vs EBS:\n• Instance Store: Temporary, highest performance, free\n• EBS: Persistent, network-attached, survives stop/start","module":"Storage","multi":false,"src":"repo"},{"id":"04-11","q":"A company wants to ensure deleted S3 objects can be recovered for 30 days. What should be enabled?","options":{"A":"S3 Lifecycle Policies","B":"S3 Versioning","C":"S3 Object Lock","D":"MFA Delete"},"answer":["B"],"explanation":"• S3 Versioning preserves all versions of objects\n• Deleted objects become delete markers (recoverable)\n• Previous versions retained\n• Protection against accidental deletion\nS3 Versioning Features:\n• Stores all versions (including deleted)\n• Recover from accidental deletes\n• Recover from application failures\n• Can suspend (not disable completely)\n• Each version counted for storage costs\nRelated Features:\n• MFA Delete: Requires MFA to delete versions or suspend versioning\n• Object Lock: WORM (Write Once Read Many), compliance\n• Lifecycle: Transition or delete versions after time period\nBest Practice: Enable versioning + lifecycle to delete old versions","module":"Storage","multi":false,"src":"repo"},{"id":"04-12","q":"A Windows application running on EC2 needs shared file storage accessible via SMB protocol. Which service should be used?","options":{"A":"Amazon EFS","B":"Amazon FSx for Windows File Server","C":"Amazon EBS","D":"Amazon S3"},"answer":["B"],"explanation":"• Amazon FSx for Windows File Server:\n• Native Windows file system\n• SMB protocol support\n• Active Directory integration\n• Windows NTFS features\n• Multi-AZ deployment\nFSx Family:\n• FSx for Windows: Windows workloads, SMB, AD\n• FSx for Lustre: HPC, ML, high-performance\n• FSx for NetApp ONTAP: Enterprise NAS, multi-protocol\n• FSx for OpenZFS: Linux workloads, snapshots\nFile Storage Options:\n• Windows apps: FSx for Windows (SMB)\n• Linux apps: EFS (NFS)\n• HPC/ML: FSx for Lustre\n• Block storage: EBS","module":"Storage","multi":false,"src":"repo"},{"id":"04-13","q":"A company needs to store petabytes of data for machine learning training with the fastest possible throughput. Which storage service is MOST appropriate?","options":{"A":"Amazon S3","B":"Amazon EFS","C":"Amazon FSx for Lustre","D":"Amazon EBS"},"answer":["C"],"explanation":"• FSx for Lustre designed for:\n• High-performance computing (HPC)\n• Machine learning\n• Media processing\n• Sub-millisecond latencies\n• Hundreds of GB/s throughput\n• Millions of IOPS\nFSx for Lustre Features:\n• Integrates with S3 (lazy loading)\n• POSIX-compliant file system\n• Scratch and persistent deployment types\n• Scales to petabytes\nDeployment Types:\n• Scratch: Temporary, highest performance, no replication\n• Persistent: Long-term, replication, automatic failover\nML/HPC Storage:\n• Training: FSx for Lustre (from S3)\n• Inference: EFS or S3\n• Dataset storage: S3\n• Processing: FSx for Lustre","module":"Storage","multi":false,"src":"repo"},{"id":"04-14","q":"A company wants to move infrequently accessed EBS snapshots to cheaper storage automatically. What feature should be used?","options":{"A":"S3 Lifecycle Policies","B":"EBS Snapshot Archive","C":"EBS Cold HDD volumes","D":"Amazon Glacier"},"answer":["B"],"explanation":"• EBS Snapshot Archive tier:\n• 75% cheaper than standard snapshots\n• For snapshots stored 90+ days\n• Restore time: 24-72 hours\n• Minimum 90-day storage\nEBS Snapshot Management:\n• Standard: Fast restore (minutes), higher cost\n• Archive: Cheaper, slower restore (24-72 hrs)\n• Automatic archival with lifecycle policies\nEBS Snapshot Features:\n• Incremental backups (only changed blocks)\n• Stored in S3 (managed by AWS)\n• Cross-region copy available\n• Fast Snapshot Restore (FSR) for instant recovery\nUse Cases:\n• Standard: Frequent restores, DR\n• Archive: Compliance, long-term retention","module":"Storage","multi":false,"src":"repo"},{"id":"04-15","q":"An application writes data to S3 frequently. The company wants to be notified immediately when objects are created. What should be configured?","options":{"A":"S3 Event Notifications","B":"CloudWatch Logs","C":"AWS Config","D":"CloudTrail"},"answer":["A"],"explanation":"• S3 Event Notifications trigger on bucket events\n• Near real-time notifications\n• Destinations: SNS, SQS, Lambda\nS3 Events:\n• Object created (PUT, POST, COPY, CompleteMultipartUpload)\n• Object deleted\n• Object restored from Glacier\n• Replication events\n• Lifecycle transitions\nEvent Notification Setup:\nCommon Patterns:\n• S3 → Lambda: Process uploaded files\n• S3 → SQS: Queue processing\n• S3 → SNS: Multi-subscriber notifications\nAlternative: EventBridge (more advanced filtering)","module":"Storage","multi":false,"src":"repo"},{"id":"04-16","q":"A company needs to ensure S3 objects are never deleted or overwritten for regulatory compliance. Which feature should be used?","options":{"A":"S3 Versioning","B":"S3 Object Lock","C":"MFA Delete","D":"S3 Lifecycle Policies"},"answer":["B"],"explanation":"• S3 Object Lock provides WORM (Write Once Read Many)\n• Prevents deletion/overwrite for specified retention period\n• Compliance and governance modes\nObject Lock Modes:\n• Compliance: Can't be overwritten/deleted by anyone (even root)\n• Governance: Users with special permissions can override\n• Legal Hold: Indefinite protection, manually removed\nObject Lock vs Versioning:\n• Versioning: Protects but versions can be deleted\n• Object Lock: Enforces retention, truly immutable\nRequirements:\n• Versioning must be enabled\n• Set at bucket creation\n• Retention period or legal hold\nUse Cases:\n• Financial records\n• Healthcare data (HIPAA)\n• Legal documents\n• Regulatory compliance","module":"Storage","multi":false,"src":"repo"},{"id":"04-17","q":"An application needs to upload large files (100 GB+) to S3 with optimal performance. What should be used?","options":{"A":"Single PUT operation","B":"S3 Multipart Upload","C":"S3 Transfer Acceleration","D":"AWS DataSync"},"answer":["B"],"explanation":"• S3 Multipart Upload:\n• Upload large objects in parts\n• Parts uploaded in parallel (better throughput)\n• Can pause/resume\n• Recommended for files > 100 MB\n• Required for files > 5 GB\nMultipart Upload Benefits:\n• Improved throughput (parallel uploads)\n• Quick recovery from network issues\n• Pause and resume uploads\n• Upload before knowing final size\nBest Practices:\n• Use for files > 100 MB\n• Required for files > 5 GB\n• Upload parts in parallel\n• Configure lifecycle to abort incomplete uploads\nTransfer Acceleration:\n• Different feature (uses CloudFront edge locations)\n• Speeds up uploads via edge locations\n• Can combine with Multipart Upload","module":"Storage","multi":false,"src":"repo"},{"id":"04-18","q":"A company wants to access S3 from EC2 instances without using internet gateway or NAT. What should be configured?","options":{"A":"VPN Connection","B":"AWS Direct Connect","C":"VPC Endpoint for S3 (Gateway Endpoint)","D":"VPC Peering"},"answer":["C"],"explanation":"• VPC Endpoint for S3 (Gateway Endpoint):\n• Private connection from VPC to S3\n• No internet required\n• No data transfer charges\n• Traffic stays within AWS network\nVPC Endpoint Types:\n| Type | Services | Cost | Implementation |\n|------|----------|------|----------------|\n| Gateway | S3, DynamoDB | Free | Route table entry |\n| Interface | Most AWS services | Hourly + data | ENI in subnet |\nS3 Endpoint Benefits:\n• Enhanced security (no internet exposure)\n• Better performance\n• No NAT Gateway costs\n• Control access via endpoint policies\nConfiguration:\n1. Create Gateway Endpoint for S3\n2. Select VPC and route tables\n3. Configure endpoint policy (optional)\n4. S3 traffic automatically routed","module":"Storage","multi":false,"src":"repo"},{"id":"04-19","q":"A database backup is stored in S3. The company wants to ensure the backup can be restored quickly if needed. What feature should be enabled?","options":{"A":"S3 Transfer Acceleration","B":"S3 Versioning","C":"S3 Cross-Region Replication","D":"Enable S3 Retrieval directly"},"answer":["B"],"explanation":"• S3 Versioning for backup protection:\n• Immediate access to all versions\n• Protect against accidental deletion/overwrite\n• Quick recovery (millisecond retrieval)\n• Keep multiple backup versions\nBackup Best Practices:\n1. Enable versioning\n2. Use lifecycle policies to transition old versions\n3. Enable Cross-Region Replication for DR\n4. Tag backup objects\n5. Test restore procedures\nAdditional Protection:\n• CRR: Geographic redundancy\n• Object Lock: Immutable backups\n• MFA Delete: Prevent accidental deletion\nStorage Class: Use Standard or Standard-IA for quick restore","module":"Storage","multi":false,"src":"repo"},{"id":"04-20","q":"A company has data in S3 Standard storage. Objects accessed within 30 days should remain in Standard, but older objects should move to S3 Glacier. How can this be automated?","options":{"A":"S3 Intelligent-Tiering","B":"S3 Lifecycle Policies","C":"AWS Lambda function","D":"Manual migration"},"answer":["B"],"explanation":"• S3 Lifecycle Policies automate transitions and expiration\n• Rule-based transitions between storage classes\n• Can filter by prefix or tags\n• No code required\nLifecycle Policy Example:\nLifecycle Actions:\n• Transition: Move to different storage class\n• Expiration: Delete objects\n• NoncurrentVersionTransition: Transition previous versions\n• NoncurrentVersionExpiration: Delete previous versions\n• AbortIncompleteMultipartUpload: Clean up incomplete uploads\nTransition Rules:\n• Standard → Standard-IA (30 days min)\n• Standard → Glacier (0 days min)\n• Can't transition backwards (Glacier → Standard)","module":"Storage","multi":false,"src":"repo"},{"id":"05-1","q":"A company needs a relational database with automatic scaling, high availability across multiple AZs, and automatic failover. They want minimal database administration. Which service should be used?","options":{"A":"Amazon RDS MySQL","B":"Amazon Aurora","C":"Amazon DynamoDB","D":"Amazon Redshift"},"answer":["B"],"explanation":"• Amazon Aurora provides:\n• MySQL/PostgreSQL compatibility\n• 5x performance of MySQL, 3x of PostgreSQL\n• Automatic scaling (storage up to 128 TB)\n• Multi-AZ by design (6 copies across 3 AZs)\n• Automatic failover (< 30 seconds)\n• Serverless option available\nAurora vs RDS:\n• Aurora: Better performance, auto-scaling storage, faster replication\n• RDS: Standard MySQL/PostgreSQL, simpler\nAurora Features:\n• Up to 15 read replicas\n• Continuous backup to S3\n• Point-in-time recovery\n• Backtrack (rewind database)","module":"Database","multi":false,"src":"repo"},{"id":"05-2","q":"An application requires sub-millisecond latency for read/write operations with automatic scaling to handle millions of requests per second. Which database should be used?","options":{"A":"Amazon RDS","B":"Amazon DynamoDB","C":"Amazon Aurora","D":"Amazon DocumentDB"},"answer":["B"],"explanation":"• Amazon DynamoDB is fully managed NoSQL database\n• Single-digit millisecond latency\n• Scales to 10+ trillion requests/day\n• Automatic scaling\n• Multi-AZ replication built-in\n• Serverless option (on-demand pricing)\nDynamoDB Features:\n• Key-value and document database\n• DynamoDB Streams (change data capture)\n• Global Tables (multi-region replication)\n• DynamoDB Accelerator (DAX) for microsecond latency\n• Point-in-time recovery\n• On-demand and provisioned capacity modes\nWhen to use DynamoDB:\n• Need extreme scale\n• Variable workloads\n• Need sub-10ms latency\n• Key-value or document data model","module":"Database","multi":false,"src":"repo"},{"id":"05-3","q":"A company wants to cache database query results to reduce read load on their RDS database and improve response times. Which service should be used?","options":{"A":"Amazon CloudFront","B":"Amazon ElastiCache","C":"DynamoDB Accelerator (DAX)","D":"Amazon S3"},"answer":["B"],"explanation":"• Amazon ElastiCache provides in-memory caching\n• Redis or Memcached engines\n• Microsecond latency\n• Reduces database load\n• Session storage\n• Leaderboards, real-time analytics\nElastiCache Engines:\n| Feature | Redis | Memcached |\n|---------|-------|-----------|\n| Data Types | Advanced (strings, sets, sorted sets) | Simple (strings) |\n| Persistence | Yes (snapshots) | No |\n| Replication | Yes (Multi-AZ) | No |\n| Pub/Sub | Yes | No |\n| Sorted Sets | Yes (leaderboards) | No |\n| Multi-threaded | No | Yes |\nCommon Pattern: Application → ElastiCache → RDS (cache-aside)","module":"Database","multi":false,"src":"repo"},{"id":"05-4","q":"A data warehouse requires complex analytical queries across petabytes of data. Which AWS database service is MOST appropriate?","options":{"A":"Amazon RDS","B":"Amazon DynamoDB","C":"Amazon Redshift","D":"Amazon Aurora"},"answer":["C"],"explanation":"• Amazon Redshift is data warehouse service\n• Columnar storage\n• Massively parallel processing (MPP)\n• Petabyte-scale\n• SQL queries (PostgreSQL-compatible)\n• Integration with S3, EMR, Glue\nRedshift Features:\n• Columnar storage (better compression, faster queries)\n• Redshift Spectrum (query S3 data directly)\n• Automatic backups and snapshots\n• Encryption at rest and in transit\n• Concurrency Scaling (handle burst queries)\n• Result caching\nRedshift vs RDS:\n• Redshift: Analytics, OLAP, data warehouse\n• RDS: Transactional, OLTP, operational database\nUse Cases:\n• Business intelligence\n• Historical data analysis\n• Large-scale analytics\n• Reporting","module":"Database","multi":false,"src":"repo"},{"id":"05-5","q":"A MongoDB application needs to be migrated to AWS with minimal changes. Which service should be used?","options":{"A":"Amazon RDS","B":"Amazon DynamoDB","C":"Amazon DocumentDB","D":"Amazon Neptune"},"answer":["C"],"explanation":"• Amazon DocumentDB is MongoDB-compatible document database\n• Fully managed\n• MongoDB 3.6 and 4.0 compatibility\n• Scales to millions of requests/second\n• Multi-AZ replication\n• Automatic backups\nDocumentDB Features:\n• Document data model (JSON)\n• MongoDB drivers and tools compatible\n• Storage auto-scales to 64 TB\n• Up to 15 read replicas\n• Continuous backup to S3\nMigration: Use AWS Database Migration Service (DMS)\nWhen to use:\n• Existing MongoDB workloads\n• Document-oriented data\n• Need managed service","module":"Database","multi":false,"src":"repo"},{"id":"05-6","q":"An application needs to store relationships between data entities (social network connections, fraud detection). Which database is MOST suitable?","options":{"A":"Amazon RDS","B":"Amazon DynamoDB","C":"Amazon Neptune","D":"Amazon DocumentDB"},"answer":["C"],"explanation":"• Amazon Neptune is graph database\n• Store and query highly connected data\n• Supports Gremlin and SPARQL\n• Fast relationship queries\n• Multi-AZ replication\nNeptune Use Cases:\n• Social networks\n• Fraud detection\n• Recommendation engines\n• Knowledge graphs\n• Network topology\n• Supply chain\nGraph vs Relational:\n• Graph: Complex relationships, traversals\n• Relational: Joins become expensive for deep relationships\n• Graph databases optimize for relationship queries","module":"Database","multi":false,"src":"repo"},{"id":"05-7","q":"A company needs to run an RDS database with automatic failover to a standby instance in another AZ. What should be configured?","options":{"A":"RDS Read Replicas","B":"RDS Multi-AZ Deployment","C":"RDS Snapshots","D":"RDS Cross-Region Replication"},"answer":["B"],"explanation":"• RDS Multi-AZ provides high availability\n• Synchronous replication to standby\n• Automatic failover (1-2 minutes)\n• Same region, different AZ\n• No manual intervention\nMulti-AZ vs Read Replicas:\n| Feature | Multi-AZ | Read Replicas |\n|---------|----------|---------------|\n| Purpose | High availability | Read scaling |\n| Replication | Synchronous | Asynchronous |\n| Failover | Automatic | Manual promotion |\n| Access | Standby not accessible | Can read from replicas |\n| Region | Same | Same or cross-region |\nMulti-AZ Failover Triggers:\n• AZ failure\n• Instance failure\n• Storage failure\n• Software patching (planned)","module":"Database","multi":false,"src":"repo"},{"id":"05-8","q":"An application requires DynamoDB but needs to support complex queries with multiple attributes. What feature should be used?","options":{"A":"DynamoDB Streams","B":"DynamoDB Global Secondary Index (GSI)","C":"DynamoDB Auto Scaling","D":"DynamoDB Accelerator (DAX)"},"answer":["B"],"explanation":"• Global Secondary Index (GSI):\n• Query on non-primary key attributes\n• Different partition and sort keys than base table\n• Eventually consistent reads\n• Can be added after table creation\nDynamoDB Index Types:\n| Type | Keys | Projection | Creation |\n|------|------|------------|----------|\n| LSI | Same partition key | Can choose | At table creation only |\n| GSI | Different keys | Can choose | Anytime |\nGSI Use Cases:\n• Query by different attributes\n• Support multiple access patterns\n• Flexible querying","module":"Database","multi":false,"src":"repo"},{"id":"05-9","q":"A company wants to achieve microsecond latency for DynamoDB read operations. Which feature should be enabled?","options":{"A":"DynamoDB Streams","B":"DynamoDB Global Tables","C":"DynamoDB Accelerator (DAX)","D":"DynamoDB Auto Scaling"},"answer":["C"],"explanation":"• DynamoDB Accelerator (DAX):\n• In-memory cache for DynamoDB\n• Microsecond latency (vs millisecond)\n• Fully managed, highly available\n• No application code changes (drop-in replacement)\nDAX Benefits:\n• 10x performance improvement for read-heavy workloads\n• Reduces read load on DynamoDB\n• Eventually consistent reads\n• Write-through cache\nDAX vs ElastiCache:\n• DAX: DynamoDB-specific, easier integration\n• ElastiCache: General purpose, more control\nWhen to use DAX:\n• Read-heavy workloads\n• Need microsecond latency\n• Repeated reads of same items\n• Real-time bidding, gaming","module":"Database","multi":false,"src":"repo"},{"id":"05-10","q":"An RDS database needs to handle increased read traffic. Write traffic is low. What is the MOST cost-effective solution?","options":{"A":"Upgrade to larger instance","B":"Enable RDS Multi-AZ","C":"Create RDS Read Replicas","D":"Use ElastiCache"},"answer":["C"],"explanation":"• RDS Read Replicas:\n• Asynchronous replication\n• Offload read traffic from primary\n• Up to 15 replicas (Aurora)\n• Same region or cross-region\n• Can be promoted to standalone\nRead Replica Use Cases:\n• Read-heavy workloads\n• Reporting/analytics (separate from production)\n• Cross-region disaster recovery (promotion)\n• Read scaling\nBenefits:\n• Cost-effective scaling for reads\n• No impact on primary instance\n• Can use different instance types\nReplication Lag: Monitor with CloudWatch metric","module":"Database","multi":false,"src":"repo"},{"id":"05-11","q":"A global application requires DynamoDB tables to be replicated across multiple AWS regions with low-latency local reads and writes. Which feature should be used?","options":{"A":"DynamoDB Streams","B":"DynamoDB Global Tables","C":"DynamoDB Cross-Region Replication","D":"AWS Database Migration Service"},"answer":["B"],"explanation":"• DynamoDB Global Tables:\n• Multi-region, multi-active replication\n• Bi-directional replication\n• Local read/write in each region\n• Sub-second latency\n• Conflict resolution (last writer wins)\nGlobal Tables Requirements:\n• DynamoDB Streams enabled\n• Same table name across regions\n• Same primary key structure\nUse Cases:\n• Global applications\n• Disaster recovery\n• Multi-region high availability\n• Reduce latency for global users","module":"Database","multi":false,"src":"repo"},{"id":"05-12","q":"A company needs to ensure RDS database backups are retained for 90 days for compliance. What should be configured?","options":{"A":"Automated Backups with 90-day retention","B":"Manual Snapshots","C":"Both automated backups (35 days) and manual snapshots","D":"RDS Cross-Region Replication"},"answer":["C"],"explanation":"• RDS Automated Backups: Max 35 days retention\n• Manual Snapshots: Retained until explicitly deleted\n• For > 35 days: Use manual snapshots\nRDS Backup Types:\n| Type | Retention | Deleted with DB | Use Case |\n|------|-----------|-----------------|----------|\n| Automated | 1-35 days | Yes | Point-in-time recovery |\n| Manual | Until deleted | No | Long-term retention |\nBest Practice for Long Retention:\n1. Enable automated backups (35 days)\n2. Create manual snapshots for long-term\n3. Use lifecycle policies to copy to S3/Glacier\nAutomated Backup Features:\n• Daily full snapshot\n• Transaction logs every 5 minutes\n• Point-in-time recovery within retention period","module":"Database","multi":false,"src":"repo"},{"id":"05-13","q":"An application needs time-series data storage for IoT sensor data with automatic data retention policies. Which database is MOST appropriate?","options":{"A":"Amazon DynamoDB","B":"Amazon RDS","C":"Amazon Timestream","D":"Amazon Redshift"},"answer":["C"],"explanation":"• Amazon Timestream is purpose-built for time-series data\n• IoT, DevOps, analytics\n• Automatic data lifecycle management\n• Built-in time-series analytics\n• 1000x faster, 1/10th cost vs relational\nTimestream Features:\n• Automatic tiering (memory → magnetic)\n• Built-in time-series functions\n• Serverless, auto-scaling\n• SQL queries\nUse Cases:\n• IoT sensor data\n• Application monitoring\n• DevOps metrics\n• Industrial telemetry\nTimestream vs Alternatives:\n• DynamoDB: General NoSQL, manual TTL\n• Redshift: Data warehouse, not optimized for time-series\n• Timestream: Purpose-built, best for time-series","module":"Database","multi":false,"src":"repo"},{"id":"05-14","q":"A company wants to migrate an on-premises Oracle database to AWS with minimal downtime. Which service should be used?","options":{"A":"AWS Database Migration Service (DMS)","B":"AWS DataSync","C":"AWS Snowball","D":"Manual export/import"},"answer":["A"],"explanation":"• AWS DMS (Database Migration Service):\n• Migrate databases with minimal downtime\n• Source database remains operational\n• Supports homogeneous and heterogeneous migrations\n• Continuous data replication\nDMS Migration Types:\n1. Homogeneous: Oracle → Oracle, MySQL → Aurora MySQL\n2. Heterogeneous: Oracle → Aurora PostgreSQL (use SCT)\nDMS Features:\n• Continuous replication\n• Multi-AZ for high availability\n• Automatic failover\n• Supports many database engines\nMigration Steps:\n1. Create replication instance\n2. Configure source and target endpoints\n3. Create migration task\n4. Full load + CDC (Change Data Capture)\n5. Cutover when ready","module":"Database","multi":false,"src":"repo"},{"id":"05-15","q":"An application uses RDS MySQL. The company wants to encrypt an existing unencrypted database. What is the correct approach?","options":{"A":"Enable encryption on the existing database","B":"Create encrypted snapshot, restore to new encrypted instance","C":"Use AWS KMS to encrypt in-place","D":"Export data and re-import to encrypted instance"},"answer":["B"],"explanation":"• Cannot encrypt existing RDS instance directly\n• Must create encrypted copy\nEncryption Process:\n1. Create snapshot of unencrypted DB\n2. Copy snapshot with encryption enabled\n3. Restore encrypted snapshot to new DB instance\n4. Update application endpoint\n5. Delete old instance\nRDS Encryption:\n• Uses AWS KMS for key management\n• Encrypts data at rest (storage, backups, snapshots, read replicas)\n• Cannot disable encryption once enabled\n• Minimal performance impact\nAlternative: Use AWS DMS to migrate with encryption enabled","module":"Database","multi":false,"src":"repo"},{"id":"05-16","q":"A DynamoDB table experiences variable traffic patterns throughout the day. What capacity mode should be used to optimize costs?","options":{"A":"Provisioned Capacity","B":"On-Demand Capacity","C":"Reserved Capacity","D":"Auto Scaling"},"answer":["B"],"explanation":"• On-Demand Capacity:\n• Pay per request\n• No capacity planning\n• Scales automatically\n• Ideal for unpredictable/variable workloads\nCapacity Modes Comparison:\n| Mode | Best For | Pricing | Scaling |\n|------|----------|---------|---------|\n| On-Demand | Variable traffic | Per request | Automatic |\n| Provisioned | Predictable traffic | Per hour (RCU/WCU) | Manual or Auto Scaling |\nWhen to Use:\n• On-Demand: New tables, unpredictable, spiky traffic\n• Provisioned: Predictable, steady traffic, cost optimization\nCost: On-Demand can be more expensive for consistent workloads\nCan switch between modes once per 24 hours","module":"Database","multi":false,"src":"repo"},{"id":"05-17","q":"An application requires ACID transactions across multiple DynamoDB tables. Which feature should be used?","options":{"A":"DynamoDB Streams","B":"DynamoDB Transactions","C":"DynamoDB Batch Operations","D":"DynamoDB Global Tables"},"answer":["B"],"explanation":"• DynamoDB Transactions:\n• ACID properties (Atomicity, Consistency, Isolation, Durability)\n• All-or-nothing operations\n• Up to 100 items or 4 MB per transaction\n• TransactWriteItems and TransactGetItems\nTransaction Use Cases:\n• Financial transactions\n• Order processing\n• Inventory management\n• Need data consistency across items\nTransaction APIs:\n• `TransactWriteItems`: Atomic writes\n• `TransactGetItems`: Snapshot reads\nCost: 2x the cost of standard reads/writes","module":"Database","multi":false,"src":"repo"},{"id":"05-18","q":"A company wants to track changes to DynamoDB items in real-time to update materialized views and trigger workflows. Which feature should be used?","options":{"A":"DynamoDB Auto Scaling","B":"DynamoDB Streams","C":"DynamoDB Backups","D":"CloudWatch Events"},"answer":["B"],"explanation":"• DynamoDB Streams:\n• Ordered record of item-level changes\n• Near real-time (typically < 1 second)\n• 24-hour retention\n• Exactly-once delivery\nStream View Types:\n• KEYS_ONLY: Only key attributes\n• NEW_IMAGE: Entire item after change\n• OLD_IMAGE: Entire item before change\n• NEW_AND_OLD_IMAGES: Both before and after\nUse Cases:\n• Update materialized views\n• Trigger Lambda functions\n• Cross-region replication (Global Tables)\n• Data pipelines\n• Analytics\nCommon Pattern: DynamoDB Streams → Lambda → Process changes","module":"Database","multi":false,"src":"repo"},{"id":"05-19","q":"An Aurora database cluster needs to handle analytics queries without impacting production traffic. What should be configured?","options":{"A":"Aurora Read Replicas","B":"Aurora Serverless","C":"Aurora Global Database","D":"RDS Read Replicas"},"answer":["A"],"explanation":"• Aurora Read Replicas:\n• Up to 15 replicas\n• Low replication lag (< 10ms)\n• Offload read traffic\n• Can have custom endpoints\nAurora Custom Endpoints:\n• Direct specific workloads to specific replicas\n• Example: Analytics queries to larger instances\nReader Endpoint:\n• Load balances across all read replicas\n• Automatic failover if primary fails\nAurora Auto Scaling:\n• Automatically add/remove replicas based on load","module":"Database","multi":false,"src":"repo"},{"id":"05-20","q":"A serverless application needs a database that automatically scales capacity based on workload. Which option is MOST suitable?","options":{"A":"RDS with Auto Scaling","B":"Aurora Serverless","C":"DynamoDB On-Demand","D":"Both B and C"},"answer":["D"],"explanation":"Both are suitable for serverless applications:\nAurora Serverless:\n• Automatically scales compute capacity\n• Pay per second for compute\n• Ideal for intermittent/unpredictable workloads\n• SQL database (PostgreSQL/MySQL)\nDynamoDB On-Demand:\n• Automatically scales throughput\n• Pay per request\n• NoSQL database\n• Sub-10ms latency\nChoose Based On:\n• Need SQL, relational → Aurora Serverless\n• Need NoSQL, extreme scale → DynamoDB On-Demand\n• Intermittent workloads → Both work\n• Dev/test environments → Aurora Serverless\n• Serverless apps → Both work","module":"Database","multi":false,"src":"repo"},{"id":"05-21","q":"A development team needs a fully managed, scalable, and highly available Apache Cassandra-compatible database for their application. Which AWS service should they use?","options":{"A":"Amazon Keyspaces","B":"Amazon DynamoDB","C":"Amazon RDS for PostgreSQL","D":"Amazon Aurora"},"answer":["A"],"explanation":"• Amazon Keyspaces is a managed Cassandra-compatible database\n• Supports Cassandra Query Language (CQL)\n• DynamoDB is NoSQL but not Cassandra-compatible\n• RDS and Aurora are relational databases","module":"Database","multi":false,"src":"repo"},{"id":"05-22","q":"A financial institution needs a fully managed, immutable, cryptographically verifiable ledger database for recording transactions. Which AWS service should they use?","options":{"A":"Amazon QLDB","B":"Amazon Aurora","C":"Amazon RDS","D":"Amazon DynamoDB"},"answer":["A"],"explanation":"• Amazon QLDB (Quantum Ledger Database) is a fully managed ledger database\n• Provides immutable, cryptographically verifiable transaction log\n• Aurora, RDS, and DynamoDB are not ledger databases","module":"Database","multi":false,"src":"repo","note":"Heads-up: Amazon QLDB reached end of support on 31 July 2025. Older question banks still use it as the 'immutable ledger' answer."},{"id":"06-1","q":"A company wants to create an isolated network in AWS where they can launch resources. Which AWS service should they use?","options":{"A":"AWS Direct Connect","B":"Amazon VPC","C":"AWS Transit Gateway","D":"Amazon Route 53"},"answer":["B"],"explanation":"• Amazon VPC (Virtual Private Cloud) provides isolated network environment\n• Logically isolated section of AWS Cloud\n• Complete control over networking (IP ranges, subnets, route tables, gateways)\n• Can create public and private subnets\nVPC Key Components:\n• CIDR Block: IP address range (e.g., 10.0.0.0/16)\n• Subnets: Subdivisions within VPC\n• Route Tables: Control traffic routing\n• Internet Gateway: Access to internet\n• NAT Gateway: Outbound internet for private subnets","module":"Networking","multi":false,"src":"repo"},{"id":"06-2","q":"A private subnet contains EC2 instances that need to download software updates from the internet. The instances should NOT be directly accessible from the internet. What should be configured?","options":{"A":"Internet Gateway","B":"NAT Gateway","C":"Virtual Private Gateway","D":"VPC Peering"},"answer":["B"],"explanation":"• NAT Gateway enables outbound internet access for private subnets\n• Instances remain private (no inbound from internet)\n• Placed in public subnet\n• Route private subnet traffic to NAT Gateway\nNAT Gateway vs NAT Instance:\n| Feature | NAT Gateway | NAT Instance |\n|---------|-------------|--------------|\n| Managed | AWS-managed | Customer-managed |\n| Availability | Highly available (AZ) | Single instance |\n| Bandwidth | Up to 45 Gbps | Instance type dependent |\n| Cost | Hourly + data transfer | Instance cost |\n| Maintenance | AWS handles | Customer handles |\nConfiguration:\n1. Create NAT Gateway in public subnet\n2. Update private subnet route table\n3. Route 0.0.0.0/0 to NAT Gateway","module":"Networking","multi":false,"src":"repo"},{"id":"06-3","q":"A company has a VPC with CIDR 10.0.0.0/16. They want to divide it into subnets. How many IP addresses are available in a /24 subnet?","options":{"A":"128","B":"256","C":"251","D":"254"},"answer":["C"],"explanation":"• /24 subnet has 256 total IP addresses (2^8)\n• AWS reserves 5 IP addresses in each subnet:\n• .0: Network address\n• .1: VPC router\n• .2: DNS server\n• .3: Future use\n• .255: Broadcast\n• Available: 256 - 5 = 251 IP addresses\nCIDR Calculations:\n• /16: 65,536 IPs (65,531 usable)\n• /24: 256 IPs (251 usable)\n• /28: 16 IPs (11 usable)","module":"Networking","multi":false,"src":"repo"},{"id":"06-4","q":"An application running in a VPC needs to connect to AWS services (S3, DynamoDB) without traversing the internet. What should be configured?","options":{"A":"NAT Gateway","B":"Internet Gateway","C":"VPC Endpoint","D":"VPN Connection"},"answer":["C"],"explanation":"• VPC Endpoints provide private connectivity to AWS services\n• Traffic stays within AWS network\n• No internet gateway or NAT required\n• Enhanced security and performance\nVPC Endpoint Types:\n| Type | Services | Implementation | Cost |\n|------|----------|----------------|------|\n| Gateway | S3, DynamoDB | Route table entry | Free |\n| Interface | Most AWS services | ENI in subnet | Hourly + data |\nGateway Endpoint Benefits:\n• No data transfer charges\n• Better performance\n• No internet exposure\n• Policy control","module":"Networking","multi":false,"src":"repo"},{"id":"06-5","q":"A company wants to connect their on-premises data center to AWS with a dedicated, private network connection. Which service should they use?","options":{"A":"AWS VPN","B":"AWS Direct Connect","C":"Internet Gateway","D":"VPC Peering"},"answer":["B"],"explanation":"• AWS Direct Connect provides dedicated physical connection\n• Bypasses public internet\n• More consistent performance\n• Reduced bandwidth costs\nDirect Connect vs VPN:\n| Feature | Direct Connect | Site-to-Site VPN |\n|---------|----------------|------------------|\n| Connection | Dedicated fiber | Internet-based |\n| Bandwidth | 1 Gbps to 100 Gbps | Up to 1.25 Gbps |\n| Latency | Low, consistent | Variable |\n| Cost | Higher (port + data) | Lower |\n| Setup Time | Weeks/months | Minutes |\n| Encryption | Not by default | Yes (IPSec) |\nUse Cases:\n• Large data transfers\n• Consistent performance needed\n• Hybrid cloud architectures\n• Compliance requirements","module":"Networking","multi":false,"src":"repo"},{"id":"06-6","q":"A company needs to route traffic between multiple VPCs in different AWS accounts. What is the MOST scalable solution?","options":{"A":"VPC Peering between all VPCs","B":"AWS Transit Gateway","C":"Multiple VPN connections","D":"Internet Gateway"},"answer":["B"],"explanation":"• AWS Transit Gateway is central hub for VPCs\n• Connects multiple VPCs, on-premises networks\n• Simplifies network topology\n• Scalable (up to 5000 VPCs)\nTransit Gateway vs VPC Peering:\n| Feature | Transit Gateway | VPC Peering |\n|---------|----------------|-------------|\n| Topology | Hub-and-spoke | Mesh (1-to-1) |\n| Scalability | Thousands of VPCs | Limited |\n| Routing | Centralized | Per peering |\n| Cost | Higher | Lower (small scale) |\n| Cross-Region | Yes | Yes |\nPeering Limitations:\n• Non-transitive (must peer each VPC)\n• Complex with many VPCs (N*(N-1)/2 connections)","module":"Networking","multi":false,"src":"repo"},{"id":"06-7","q":"An application needs to resolve domain names. Where should the DNS server be configured in a VPC?","options":{"A":"Custom DNS server on EC2","B":"Use AWS-provided DNS at .2 address","C":"Use Route 53 Resolver","D":"Both B and C"},"answer":["D"],"explanation":"• VPC DNS is available at base IP + 2 (e.g., 10.0.0.2)\n• Route 53 Resolver provides DNS resolution\n• Resolves AWS resources\n• Forwards to on-premises DNS\n• Inbound/outbound endpoints\nDNS Options:\n• AWS-provided DNS: Default, automatic\n• Route 53 Resolver: Advanced, hybrid scenarios\n• Custom DNS: Full control, more management\nenableDnsHostnames: EC2 instances get public DNS names\nenableDnsSupport: Amazon-provided DNS enabled","module":"Networking","multi":false,"src":"repo"},{"id":"06-8","q":"A company wants to protect their web application from DDoS attacks and filter malicious traffic. Which AWS services should be used? (Choose TWO)","options":{"A":"AWS WAF","B":"AWS Shield","C":"Security Groups","D":"AWS GuardDuty","E":"Network ACLs"},"answer":["A","B"],"explanation":"• AWS Shield: DDoS protection\n• Standard: Free, automatic, common attacks\n• Advanced: Paid, advanced attacks, 24/7 support, cost protection\n• AWS WAF: Web Application Firewall\n• Filter HTTP/HTTPS requests\n• SQL injection, XSS protection\n• Custom rules\n• Integration with CloudFront, ALB, API Gateway\nDDoS Protection Layers:\n1. Shield Standard: Network/transport layer (free)\n2. Shield Advanced: Application layer, enhanced\n3. WAF: Application-level filtering\n4. CloudFront: Absorb traffic at edge\nOther Options:\n• Security Groups: Instance-level firewall, not DDoS\n• NACLs: Subnet-level firewall, not DDoS\n• GuardDuty: Threat detection, not prevention","module":"Networking","multi":true,"src":"repo"},{"id":"06-9","q":"An application needs to distribute traffic across EC2 instances in multiple Availability Zones. The instances fail health checks intermittently. What should be configured?","options":{"A":"Increase health check interval","B":"Configure unhealthy threshold","C":"Use health check grace period","D":"Disable health checks"},"answer":["B"],"explanation":"• Unhealthy threshold: Number of consecutive failed checks before marking unheal
