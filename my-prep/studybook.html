igurations\n• Lambda would require custom development and maintenance\n• CloudWatch Events could detect changes but doesn't provide historical tracking","module":"Monitoring","multi":false,"src":"repo"},{"id":"09-8","q":"A solutions architect needs to run a script on all EC2 instances fleet-wide without SSH access. The script should install security updates. Which service provides this capability?","options":{"A":"AWS Systems Manager Run Command","B":"AWS Lambda with EC2 API","C":"Amazon CloudWatch Events","D":"AWS Config Remediation"},"answer":["A"],"explanation":"• Run Command executes commands on managed instances remotely\n• No SSH required, uses IAM permissions\n• Provides rate control and error handling\n• Command history recorded in CloudTrail\n• Lambda could invoke Run Command but isn't the direct solution\n• CloudWatch Events can trigger Run Command but isn't the execution service\n• Config Remediation uses SSM Automation Documents","module":"Monitoring","multi":false,"src":"repo"},{"id":"09-9","q":"An organization wants to detect unusual API activity, such as a sudden spike in EC2 instance creation. Which CloudTrail feature should be enabled?","options":{"A":"CloudTrail Data Events","B":"CloudTrail Management Events","C":"CloudTrail Insights Events","D":"CloudTrail Multi-Region Trails"},"answer":["C"],"explanation":"• CloudTrail Insights uses machine learning to detect unusual activity\n• Identifies anomalies like spikes in resource provisioning or IAM actions\n• Management Events track API calls but don't detect anomalies\n• Data Events track high-volume operations (S3 objects, Lambda invocations)\n• Multi-Region Trails collect logs but don't analyze patterns","module":"Monitoring","multi":false,"src":"repo"},{"id":"09-10","q":"A company needs to store CloudWatch Logs for 10 years to meet compliance requirements. What is the MOST cost-effective approach?","options":{"A":"Keep logs in CloudWatch Logs with 10-year retention","B":"Export logs to S3, then transition to S3 Glacier Deep Archive","C":"Export logs to S3, then use S3 Intelligent-Tiering","D":"Stream logs to Kinesis Data Firehose and store in Redshift"},"answer":["B"],"explanation":"• CloudWatch Logs retention is expensive for long-term storage\n• Export to S3 for cost-effective long-term storage\n• S3 Glacier Deep Archive is cheapest for archival ($0.00099 per GB/month)\n• S3 Intelligent-Tiering is more expensive than Glacier Deep Archive\n• Redshift is for analytics, not cost-effective archival","module":"Monitoring","multi":false,"src":"repo"},{"id":"09-11","q":"A development team needs to query application logs to troubleshoot issues. The logs are stored in CloudWatch Logs. Which feature should they use for ad-hoc log analysis?","options":{"A":"CloudWatch Metrics","B":"CloudWatch Logs Insights","C":"CloudWatch Dashboards","D":"CloudWatch Alarms"},"answer":["B"],"explanation":"• CloudWatch Logs Insights provides interactive log analytics\n• Purpose-built query language for searching and analyzing logs\n• Can find errors, count events, calculate percentiles\n• Metrics are for numerical performance data\n• Dashboards visualize but don't query\n• Alarms trigger on thresholds","module":"Monitoring","multi":false,"src":"repo"},{"id":"09-12","q":"A company wants to automatically remediate non-compliant resources. For example, when an S3 bucket is created without encryption, it should be automatically encrypted. Which solution accomplishes this?","options":{"A":"AWS Config Rules with automatic remediation using SSM Automation Documents","B":"CloudWatch Events with Lambda functions","C":"AWS CloudTrail with SNS notifications","D":"Systems Manager State Manager"},"answer":["A"],"explanation":"• Config Rules evaluate compliance\n• Automatic remediation uses SSM Automation Documents\n• Can trigger remediation when resources become non-compliant\n• CloudWatch Events could work but Config is purpose-built for compliance\n• CloudTrail only tracks changes, doesn't remediate\n• State Manager maintains EC2 configuration, not S3","module":"Monitoring","multi":false,"src":"repo"},{"id":"09-13","q":"A solutions architect needs to store sensitive configuration data like database passwords that can be accessed by EC2 instances and Lambda functions. The solution must support encryption and version history. Which service should be used?","options":{"A":"AWS Secrets Manager","B":"AWS Systems Manager Parameter Store","C":"Amazon S3 with versioning","D":"AWS Config"},"answer":["B"],"explanation":"• Parameter Store securely stores configuration data and secrets\n• Supports encryption with KMS\n• Maintains version history\n• Integrates with EC2, Lambda, CloudFormation\n• Secrets Manager is also valid but more expensive (includes auto-rotation)\n• For exam context, Parameter Store is part of Systems Manager\n• S3 isn't designed for configuration management\n• Config is for compliance tracking","module":"Monitoring","multi":false,"src":"repo"},{"id":"09-14","q":"A company has a multi-region application and needs to create a unified dashboard showing CloudWatch metrics from all regions. Is this possible?","options":{"A":"No, CloudWatch dashboards are region-specific only","B":"Yes, CloudWatch dashboards support cross-region metrics","C":"Yes, but only with CloudWatch Logs, not metrics","D":"Yes, but requires CloudWatch Events to aggregate data"},"answer":["B"],"explanation":"• CloudWatch dashboards support cross-region and cross-account views\n• Can add graphs from multiple regions to single dashboard\n• Global view of distributed applications\n• No additional aggregation service required","module":"Monitoring","multi":false,"src":"repo"},{"id":"09-15","q":"An operations team needs to collect metadata about all EC2 instances including installed applications, OS details, and network configuration. Which Systems Manager feature should they use?","options":{"A":"Systems Manager Session Manager","B":"Systems Manager Inventory","C":"Systems Manager Patch Manager","D":"Systems Manager Run Command"},"answer":["B"],"explanation":"• Systems Manager Inventory collects metadata from managed instances\n• Gathers information about OS, applications, network config\n• Can query and visualize with Inventory dashboard\n• Session Manager is for shell access\n• Patch Manager is for patching\n• Run Command executes commands","module":"Monitoring","multi":false,"src":"repo"},{"id":"09-16","q":"A company needs to ensure CloudTrail logs haven't been tampered with for compliance audits. Which feature should be enabled?","options":{"A":"CloudTrail Multi-Region Trails","B":"CloudTrail Log File Integrity Validation","C":"CloudTrail Insights","D":"CloudTrail Data Events"},"answer":["B"],"explanation":"• Log File Integrity Validation uses digital signatures\n• Ensures logs haven't been modified after delivery\n• Required for compliance and forensic investigations\n• Multi-Region Trails enable logging across regions\n• Insights detect unusual activity\n• Data Events track resource operations","module":"Monitoring","multi":false,"src":"repo"},{"id":"09-17","q":"A solutions architect needs to process CloudWatch Logs in real-time and send filtered data to an analytics application. Which solution should be used?","options":{"A":"Export logs to S3 and use Athena","B":"Use CloudWatch Logs Subscriptions with Kinesis Data Streams","C":"Use CloudWatch Logs Insights with scheduled queries","D":"Export logs to S3 and use Lambda"},"answer":["B"],"explanation":"• CloudWatch Logs Subscriptions enable real-time processing\n• Can send to Kinesis Data Streams for real-time analytics\n• Also supports Kinesis Data Firehose and Lambda\n• S3 export is not real-time (batch process)\n• Logs Insights is for ad-hoc queries, not streaming","module":"Monitoring","multi":false,"src":"repo"},{"id":"09-18","q":"A company wants to track when a specific IAM policy was attached to a role and view the complete configuration history. Which service provides this capability?","options":{"A":"AWS CloudTrail only","B":"AWS Config only","C":"Both CloudTrail and Config","D":"IAM Access Analyzer"},"answer":["C"],"explanation":"• CloudTrail shows WHO attached the policy and WHEN (API call details)\n• Config shows configuration history and timeline of changes\n• Both services complement each other for complete visibility\n• CloudTrail: \"Who did what, when\"\n• Config: \"What does it look like now and over time\"\n• IAM Access Analyzer analyzes resource policies for external access","module":"Monitoring","multi":false,"src":"repo"},{"id":"09-19","q":"An application needs to maintain a desired state on EC2 instances, ensuring specific software is always installed and running. Which Systems Manager feature should be used?","options":{"A":"Systems Manager Run Command","B":"Systems Manager State Manager","C":"Systems Manager Automation","D":"Systems Manager Patch Manager"},"answer":["B"],"explanation":"• State Manager maintains desired state configuration\n• Creates associations between documents and instances\n• Continuously enforces configuration\n• Run Command executes one-time commands\n• Automation runs workflows\n• Patch Manager handles patching","module":"Monitoring","multi":false,"src":"repo"},{"id":"09-20","q":"A company needs to query 5 years of CloudTrail logs to investigate security incidents. What is the MOST efficient solution?","options":{"A":"Download all logs from S3 and use local tools","B":"Use Amazon Athena to query CloudTrail logs in S3","C":"Use CloudTrail Lake to query logs with SQL","D":"Import logs into Elasticsearch"},"answer":["C"],"explanation":"• CloudTrail Lake is purpose-built for querying CloudTrail logs\n• Uses SQL to query events\n• Can retain events for up to 7 years\n• Aggregates logs from multiple accounts/regions\n• Athena could work but CloudTrail Lake is optimized for this use case\n• Option A is inefficient and not scalable\n• Elasticsearch adds unnecessary complexity","module":"Monitoring","multi":false,"src":"repo"},{"id":"10-1","q":"A company wants to migrate a large on-premises application to AWS quickly with minimal changes. The application runs on virtual machines and must be operational within 2 weeks. Which migration strategy should be used?","options":{"A":"Refactor the application to use Lambda and DynamoDB","B":"Rehost (Lift and Shift) using AWS Application Migration Service","C":"Repurchase by moving to a SaaS solution","D":"Replatform by migrating to containers on ECS"},"answer":["B"],"explanation":"• Rehost (Lift and Shift) is the fastest migration strategy\n• AWS Application Migration Service (MGN) automates server migration\n• Moves VMs to EC2 with minimal changes\n• Meets the 2-week deadline requirement\n• Option A (Refactor) takes months of development\n• Option C (Repurchase) requires finding and adopting new software\n• Option D (Replatform) requires containerization effort","module":"Migration","multi":false,"src":"repo"},{"id":"10-2","q":"A solutions architect needs to migrate 50 TB of data from an on-premises NFS server to Amazon S3. The company has a 100 Mbps internet connection. Which service is MOST appropriate?","options":{"A":"AWS DataSync","B":"AWS Snowball","C":"AWS Direct Connect","D":"AWS Transfer Family"},"answer":["B"],"explanation":"• 50 TB over 100 Mbps would take approximately 46 days\n• Snowball is designed for large data transfers with limited bandwidth\n• Can transfer 50-80 TB per device in about a week\n• DataSync works over network but would be too slow\n• Direct Connect is for ongoing connectivity, not one-time migration\n• Transfer Family is for SFTP/FTPS access to S3\nCalculation: 50 TB = 400,000 Gb ÷ 100 Mbps = 4,000,000 seconds ≈ 46 days","module":"Migration","multi":false,"src":"repo"},{"id":"10-3","q":"A company wants to migrate an Oracle database to Amazon Aurora PostgreSQL. The database schemas and stored procedures need to be converted. Which combination of services should be used?","options":{"A":"AWS DMS only","B":"AWS Schema Conversion Tool (SCT) only","C":"AWS SCT to convert schema, then AWS DMS to migrate data","D":"AWS DataSync to transfer the database"},"answer":["C"],"explanation":"• This is a heterogeneous migration (different database engines)\n• SCT converts schemas, stored procedures, and functions\n• DMS migrates the actual data with minimal downtime\n• DMS alone doesn't convert schemas for heterogeneous migrations\n• SCT alone doesn't migrate data\n• DataSync is for file systems, not databases","module":"Migration","multi":false,"src":"repo"},{"id":"10-4","q":"A company needs to continuously replicate data from an on-premises MySQL database to Amazon RDS for MySQL for analytics purposes. The source database must remain operational. Which AWS service should be used?","options":{"A":"AWS DataSync","B":"AWS Database Migration Service (DMS) with CDC","C":"AWS Snowball Edge","D":"Amazon S3 Transfer Acceleration"},"answer":["B"],"explanation":"• DMS supports continuous data replication using Change Data Capture (CDC)\n• Source database remains operational during migration\n• Homogeneous migration (MySQL to MySQL)\n• Keeps source and target in sync\n• DataSync is for file systems, not databases\n• Snowball is for one-time transfers\n• S3 Transfer Acceleration is for S3 uploads","module":"Migration","multi":false,"src":"repo"},{"id":"10-5","q":"A solutions architect needs to transfer data between Amazon EFS in us-east-1 and Amazon S3 in us-west-2 on a daily basis. Which service provides automated, scheduled transfers?","options":{"A":"AWS DataSync","B":"AWS Snow Family","C":"AWS Transfer Family","D":"Amazon S3 Cross-Region Replication"},"answer":["A"],"explanation":"• DataSync supports transfers between AWS storage services\n• Can schedule tasks (hourly, daily, weekly)\n• Supports EFS to S3 transfers\n• Automated and managed service\n• Snow Family is for physical device transfers\n• Transfer Family is for SFTP/FTPS access\n• S3 CRR is for S3-to-S3 only","module":"Migration","multi":false,"src":"repo"},{"id":"10-6","q":"A company is migrating a legacy application to AWS but wants to minimize changes. The application uses a specific OS version and custom drivers that aren't compatible with cloud-native services. Which migration strategy is MOST appropriate?","options":{"A":"Refactor to serverless architecture","B":"Replatform to managed services","C":"Rehost (Lift and Shift) to EC2","D":"Repurchase a SaaS solution"},"answer":["C"],"explanation":"• Rehost (Lift and Shift) moves application as-is\n• EC2 supports custom OS and drivers\n• Minimal changes required\n• Fast migration path\n• Refactor requires re-architecting\n• Replatform may not support custom requirements\n• Repurchase requires finding compatible SaaS","module":"Migration","multi":false,"src":"repo"},{"id":"10-7","q":"An organization wants to track the progress of migrating 200 applications across multiple AWS accounts and regions. Which service provides centralized visibility?","options":{"A":"AWS CloudWatch","B":"AWS Migration Hub","C":"AWS Systems Manager","D":"AWS Config"},"answer":["B"],"explanation":"• Migration Hub provides centralized tracking of migrations\n• Aggregates progress from multiple migration tools\n• Supports multi-account and multi-region tracking\n• Integrates with DMS, Application Migration Service, etc.\n• CloudWatch monitors resources, not migrations\n• Systems Manager manages infrastructure\n• Config tracks configuration compliance","module":"Migration","multi":false,"src":"repo"},{"id":"10-8","q":"A company needs to migrate data from an on-premises HDFS cluster to Amazon S3. The data must be encrypted in transit. Which service should be used?","options":{"A":"AWS Snowball","B":"AWS DataSync","C":"AWS Direct Connect","D":"AWS Storage Gateway"},"answer":["B"],"explanation":"• DataSync supports HDFS as a source\n• Encrypts data in transit with TLS\n• Automated and fast data transfer\n• Can transfer to S3\n• Snowball doesn't support HDFS directly\n• Direct Connect is for network connectivity\n• Storage Gateway is for hybrid storage, not migration","module":"Migration","multi":false,"src":"repo"},{"id":"10-9","q":"A database migration using AWS DMS needs to handle large transactions and minimize the impact on the source database performance. How should the replication instance be sized?","options":{"A":"Use the smallest instance to minimize costs","B":"Use an instance type based on the source database workload and data volume","C":"Always use the largest instance available","D":"Instance size doesn't affect DMS performance"},"answer":["B"],"explanation":"• Replication instance size affects performance\n• Should be based on workload, data volume, and complexity\n• Larger instances handle more throughput and complex transformations\n• Undersizing causes slow migration and potential source impact\n• Oversizing wastes money\n• Proper sizing requires workload analysis","module":"Migration","multi":false,"src":"repo"},{"id":"10-10","q":"A company wants to migrate an on-premises Microsoft SQL Server database to AWS. They want to minimize management overhead and maintain compatibility. Which target should they choose?","options":{"A":"Amazon RDS for SQL Server","B":"Microsoft SQL Server on EC2","C":"Amazon Aurora PostgreSQL","D":"Amazon DynamoDB"},"answer":["A"],"explanation":"• RDS for SQL Server is managed service (minimal overhead)\n• Maintains SQL Server compatibility\n• This is a \"Replatform\" strategy\n• Option B requires managing EC2 and OS (more overhead)\n• Option C requires heterogeneous migration and code changes\n• Option D is NoSQL, requires application re-architecture","module":"Migration","multi":false,"src":"repo"},{"id":"10-11","q":"During a database migration with AWS DMS, which task type should be used to perform an initial data load followed by ongoing replication?","options":{"A":"Full Load only","B":"CDC (Change Data Capture) only","C":"Full Load + CDC","D":"Multiple Full Load tasks"},"answer":["C"],"explanation":"• Full Load + CDC is the most common migration pattern\n• Full Load transfers existing data\n• CDC replicates ongoing changes\n• Minimizes downtime\n• Full Load only doesn't capture changes after initial load\n• CDC only doesn't transfer existing data\n• Multiple Full Loads don't capture changes","module":"Migration","multi":false,"src":"repo"},{"id":"10-12","q":"A company has 500 TB of data to migrate from on-premises to AWS. The internet connection is 1 Gbps, but business requirements prohibit using the full bandwidth. Which solution is MOST cost-effective?","options":{"A":"Use AWS DataSync with bandwidth throttling","B":"Order multiple AWS Snowball devices","C":"Upgrade internet connection to 10 Gbps","D":"Use AWS Direct Connect with 10 Gbps connection"},"answer":["B"],"explanation":"• 500 TB is very large, Snowball is designed for this\n• Even with 1 Gbps, transfer would take months\n• Can't use full bandwidth due to business requirements\n• Snowball is faster and more cost-effective for large migrations\n• DataSync with throttling would be too slow\n• Upgrading connection is expensive\n• Direct Connect requires time to provision","module":"Migration","multi":false,"src":"repo"},{"id":"10-13","q":"An application stores data in an on-premises SMB file share. The company wants to migrate this data to AWS and continue accessing it via SMB protocol. Which solution should be implemented?","options":{"A":"Use DataSync to transfer to S3, then use S3 File Gateway","B":"Use DataSync to transfer to FSx for Windows File Server","C":"Use Snowball to transfer to EFS","D":"Use Storage Gateway Volume Gateway"},"answer":["B"],"explanation":"• DataSync supports SMB as source\n• FSx for Windows File Server provides native SMB protocol\n• Seamless migration path for Windows file shares\n• S3 File Gateway presents S3 as NFS/SMB but uses S3 storage\n• EFS doesn't natively support SMB (uses NFS)\n• Volume Gateway is for block storage","module":"Migration","multi":false,"src":"repo"},{"id":"10-14","q":"A company is using AWS DMS to migrate a database. They need to ensure the data is encrypted both in transit and at rest. How can this be achieved?","options":{"A":"DMS doesn't support encryption","B":"Enable SSL/TLS for connections and use encrypted RDS instances","C":"Use VPN for all connections","D":"Encryption is automatic and cannot be configured"},"answer":["B"],"explanation":"• DMS supports encryption in transit using SSL/TLS\n• Target RDS instances can use encryption at rest\n• Replication instance can also be encrypted\n• Both source and target connections should use SSL\n• VPN adds security but isn't required for encryption\n• Encryption must be explicitly configured","module":"Migration","multi":false,"src":"repo"},{"id":"10-15","q":"A solutions architect needs to schedule a DataSync task to run every day at 2 AM UTC. How can this be configured?","options":{"A":"DataSync doesn't support scheduling","B":"Use the built-in task scheduling in DataSync","C":"Use EventBridge to trigger DataSync tasks","D":"Use Lambda with cron expressions"},"answer":["B"],"explanation":"• DataSync has built-in task scheduling\n• Can schedule hourly, daily, weekly, or custom intervals\n• No additional services required\n• EventBridge could also trigger tasks but isn't necessary\n• Lambda is unnecessary complexity\n• Scheduling is a native DataSync feature","module":"Migration","multi":false,"src":"repo"},{"id":"10-16","q":"A company wants to retire legacy applications that are no longer used as part of their cloud migration. Which migration strategy does this represent?","options":{"A":"Rehost","B":"Replatform","C":"Retire","D":"Retain"},"answer":["C"],"explanation":"• Retire strategy identifies and turns off unused applications\n• Reduces cost and complexity\n• Part of the 6 R's migration framework\n• Rehost moves applications to cloud\n• Replatform optimizes during migration\n• Retain keeps applications on-premises","module":"Migration","multi":false,"src":"repo"},{"id":"10-17","q":"During a database migration, AWS DMS replication instance is in the same VPC as the target RDS database but cannot connect. What is the MOST likely cause?","options":{"A":"The replication instance is too small","B":"The target RDS security group doesn't allow inbound traffic from the replication instance","C":"DMS doesn't support RDS as a target","D":"SSL must be disabled on RDS"},"answer":["B"],"explanation":"• Security groups must allow traffic between DMS and RDS\n• Common misconfiguration during DMS setup\n• Need to add inbound rule to RDS security group\n• Instance size doesn't affect connectivity\n• DMS fully supports RDS as target\n• SSL is optional, not a blocker","module":"Migration","multi":false,"src":"repo"},{"id":"10-18","q":"A company is planning a large-scale migration to AWS and needs to assess their current environment, plan the migration, and track progress. Which AWS service provides this comprehensive approach?","options":{"A":"AWS Migration Hub","B":"AWS Application Discovery Service","C":"Both Migration Hub and Application Discovery Service","D":"AWS CloudEndure"},"answer":["C"],"explanation":"• Application Discovery Service discovers on-premises resources\n• Collects server specifications, performance data, dependencies\n• Migration Hub tracks migration progress\n• Together they provide complete migration solution\n• Application Discovery feeds data into Migration Hub\n• CloudEndure is now AWS Application Migration Service","module":"Migration","multi":false,"src":"repo"},{"id":"10-19","q":"A company wants to use AWS DataSync to transfer data but needs to verify that files are identical at source and destination. Which DataSync feature ensures this?","options":{"A":"DataSync doesn't verify data","B":"Built-in data integrity verification","C":"Manual MD5 checksum comparison","D":"Use CloudWatch to monitor transfers"},"answer":["B"],"explanation":"• DataSync automatically verifies data integrity\n• Checks data at source and destination\n• Ensures data consistency after transfer\n• Built-in feature, no manual intervention needed\n• CloudWatch monitors progress but doesn't verify integrity","module":"Migration","multi":false,"src":"repo"},{"id":"10-20","q":"An organization is migrating applications to AWS and wants to refactor a monolithic application into microservices. Which migration strategy is being used?","options":{"A":"Rehost","B":"Replatform","C":"Refactor/Re-architect","D":"Repurchase"},"answer":["C"],"explanation":"• Refactor/Re-architect reimagines application architecture\n• Breaking monolith into microservices is classic refactoring\n• Uses cloud-native features (ECS, Lambda, etc.)\n• Most complex but provides maximum cloud benefits\n• Rehost moves as-is\n• Replatform makes minimal optimizations\n• Repurchase moves to SaaS","module":"Migration","multi":false,"src":"repo"},{"id":"11-1","q":"A company stores application logs in Amazon S3 in CSV format. A data analyst needs to run ad-hoc SQL queries on this data without setting up infrastructure. Which AWS service should be used?","options":{"A":"Amazon EMR","B":"Amazon Athena","C":"Amazon Redshift","D":"AWS Glue"},"answer":["B"],"explanation":"• Athena is serverless and queries S3 data using SQL\n• No infrastructure to manage\n• Pay per query (per TB scanned)\n• Perfect for ad-hoc querying\n• EMR requires cluster management\n• Redshift requires data warehouse setup\n• Glue is for ETL, not querying","module":"Analytics","multi":false,"src":"repo"},{"id":"11-2","q":"A solutions architect wants to reduce the cost of Athena queries on a large dataset stored in S3. The data is currently in CSV format and queries scan the entire dataset. What should be done to optimize costs?","options":{"A":"Increase the Athena query timeout","B":"Convert data to Parquet format and partition by commonly queried fields","C":"Move data to Amazon Redshift","D":"Enable S3 versioning"},"answer":["B"],"explanation":"• Athena charges per TB scanned ($5/TB)\n• Parquet is columnar format, reduces data scanned by 30-90%\n• Partitioning limits data scanned to relevant partitions\n• Both optimizations significantly reduce costs\n• Increasing timeout doesn't reduce scanned data\n• Redshift adds infrastructure costs\n• S3 versioning doesn't affect query performance","module":"Analytics","multi":false,"src":"repo"},{"id":"11-3","q":"A real-time analytics application needs to ingest clickstream data from a website, process it with custom business logic, and store results in DynamoDB. Which AWS service should be used for data ingestion?","options":{"A":"Amazon Kinesis Data Streams","B":"Amazon Kinesis Data Firehose","C":"Amazon SQS","D":"AWS DataSync"},"answer":["A"],"explanation":"• Kinesis Data Streams is for real-time streaming with custom processing\n• Supports custom consumers (Lambda, EC2, KCL)\n• Real-time processing capability\n• Firehose is for loading data to destinations (S3, Redshift, etc.)\n• SQS is for message queuing, not streaming analytics\n• DataSync is for file transfers","module":"Analytics","multi":false,"src":"repo"},{"id":"11-4","q":"A company wants to load streaming IoT sensor data into Amazon S3 for analysis with minimal operational overhead. The data should be delivered every 5 minutes and compressed. Which service is MOST appropriate?","options":{"A":"Amazon Kinesis Data Streams with Lambda","B":"Amazon Kinesis Data Firehose","C":"Amazon SQS with Lambda","D":"AWS IoT Core with custom application"},"answer":["B"],"explanation":"• Kinesis Data Firehose is fully managed, no infrastructure\n• Automatically loads to S3\n• Built-in compression (GZIP, Snappy)\n• Buffer interval supports 60-900 seconds (5 minutes = 300 seconds)\n• Minimal operational overhead\n• Data Streams requires consumer application\n• SQS adds unnecessary complexity\n• Custom application requires maintenance","module":"Analytics","multi":false,"src":"repo"},{"id":"11-5","q":"An Athena query is scanning 10 TB of data but only needs records from the last month. The S3 bucket structure is organized by year, month, and day. How can query performance and cost be improved?","options":{"A":"Use S3 Select to filter data","B":"Create a partitioned table in Athena and query specific partitions","C":"Enable S3 Intelligent-Tiering","D":"Use Athena workgroups"},"answer":["B"],"explanation":"• Partitioning allows queries to scan only relevant data\n• WHERE clause with partition keys limits scan to specific partitions\n• Dramatically reduces data scanned and costs\n• Example: WHERE year='2024' AND month='01'\n• S3 Select reduces transfer but doesn't work with Athena\n• Intelligent-Tiering is for storage costs\n• Workgroups organize queries but don't optimize scans","module":"Analytics","multi":false,"src":"repo"},{"id":"11-6","q":"A company needs to process streaming data in real-time using SQL queries and send alerts when certain thresholds are exceeded. Which service should be used?","options":{"A":"Amazon Athena","B":"Amazon Kinesis Data Analytics","C":"Amazon Kinesis Data Firehose","D":"AWS Glue"},"answer":["B"],"explanation":"• Kinesis Data Analytics processes streaming data with SQL\n• Real-time analytics on streaming data\n• Can send results to Lambda for alerts\n• Athena queries static data in S3\n• Firehose loads data but doesn't analyze\n• Glue is for ETL jobs","module":"Analytics","multi":false,"src":"repo","note":"Kinesis Data Analytics is now called Amazon Managed Service for Apache Flink."},{"id":"11-7","q":"A data engineering team needs to run Apache Spark jobs to process large datasets. They want a managed service that handles infrastructure provisioning. Which service should they use?","options":{"A":"Amazon Athena","B":"Amazon EMR","C":"AWS Glue","D":"Amazon Kinesis"},"answer":["B"],"explanation":"• EMR (Elastic MapReduce) is managed big data platform\n• Supports Apache Spark, Hadoop, Hive, etc.\n• Handles cluster provisioning and scaling\n• Optimized for large-scale data processing\n• Athena is for SQL queries, not Spark\n• Glue supports Spark but EMR provides more control\n• Kinesis is for streaming, not batch processing","module":"Analytics","multi":false,"src":"repo"},{"id":"11-8","q":"A company has streaming data in Kinesis Data Streams and wants to load it into Amazon Redshift for analytics. What is the MOST operationally efficient solution?","options":{"A":"Use Lambda to read from Kinesis and write to Redshift","B":"Use Kinesis Data Firehose to load data into Redshift","C":"Use EC2 instances with custom scripts","D":"Use EMR to process and load data"},"answer":["B"],"explanation":"• Firehose can read from Data Streams and load to Redshift\n• Fully managed, no code required\n• Automatically scales\n• Loads via S3 (COPY command)\n• Lambda requires custom code and error handling\n• EC2 and EMR add operational overhead","module":"Analytics","multi":false,"src":"repo"},{"id":"11-9","q":"An organization uses AWS Glue Crawlers to discover schemas for data in S3. The crawler should run automatically whenever new data arrives. How can this be configured?","options":{"A":"Manually run the crawler daily","B":"Use EventBridge to trigger the crawler on S3 PutObject events","C":"Use AWS Config to detect changes","D":"Crawlers cannot be triggered automatically"},"answer":["B"],"explanation":"• EventBridge (formerly CloudWatch Events) can trigger on S3 events\n• S3 PutObject events can invoke Glue Crawler\n• Automated schema discovery when new data arrives\n• Manual running isn't automatic\n• Config tracks configuration, doesn't trigger workflows\n• Glue supports multiple trigger types","module":"Analytics","multi":false,"src":"repo"},{"id":"11-10","q":"A Kinesis Data Stream has 4 shards. Producers are writing 5,000 records per second. What is the likely issue and solution?","options":{"A":"Shards are over capacity; add more shards","B":"Retention period is too short; increase it","C":"No issue, this is within limits","D":"Use Kinesis Data Firehose instead"},"answer":["A"],"explanation":"• Each shard supports 1,000 records/sec write capacity\n• 4 shards = 4,000 records/sec capacity\n• 5,000 records/sec exceeds capacity\n• Need at least 5 shards (or use on-demand mode)\n• Will receive ProvisionedThroughputExceededException\n• Retention doesn't affect write capacity\n• Firehose is for different use cases\nCalculation: 4 shards × 1,000 records/sec = 4,000 records/sec < 5,000 needed","module":"Analytics","multi":false,"src":"repo"},{"id":"11-11","q":"A company wants to visualize data from multiple sources including S3, RDS, and Redshift. They need interactive dashboards for business users. Which AWS service should be used?","options":{"A":"Amazon Athena","B":"Amazon QuickSight","C":"Amazon CloudWatch","D":"Amazon Kinesis Data Analytics"},"answer":["B"],"explanation":"• QuickSight is business intelligence and visualization service\n• Connects to multiple data sources (S3, RDS, Redshift, etc.)\n• Creates interactive dashboards\n• SPICE engine for fast analytics\n• Athena queries data but doesn't visualize\n• CloudWatch monitors infrastructure\n• Kinesis analyzes streaming data","module":"Analytics","multi":false,"src":"repo"},{"id":"11-12","q":"A solutions architect needs to ensure data in Kinesis Data Streams is retained for 7 days for reprocessing. What should be configured?","options":{"A":"Set retention period to 168 hours (7 days)","B":"Use Kinesis Data Firehose with 7-day buffer","C":"Enable extended data retention in S3","D":"Kinesis cannot retain data beyond 24 hours"},"answer":["A"],"explanation":"• Kinesis Data Streams supports retention from 24 hours to 365 days\n• Default is 24 hours\n• Extended retention has additional cost\n• 7 days = 168 hours\n• Firehose doesn't have 7-day buffer option\n• S3 is separate storage, not Kinesis retention\n• Extended retention is a supported feature","module":"Analytics","multi":false,"src":"repo"},{"id":"11-13","q":"An ETL pipeline needs to transform data from multiple sources, catalog the metadata, and run the jobs on a schedule. Which AWS service provides this functionality?","options":{"A":"Amazon EMR","B":"AWS Glue","C":"AWS Data Pipeline","D":"Amazon Athena"},"answer":["B"],"explanation":"• AWS Glue is fully managed ETL service\n• Glue Data Catalog stores metadata\n• Glue Crawlers discover schemas\n• Glue Jobs perform transformations\n• Supports scheduling\n• EMR requires more management\n• Data Pipeline is older service\n• Athena queries, doesn't transform","module":"Analytics","multi":false,"src":"repo"},{"id":"11-14","q":"A company collects application logs in CloudWatch Logs and wants to analyze them using SQL queries. What is the MOST cost-effective solution?","options":{"A":"Keep logs in CloudWatch and use Logs Insights","B":"Export logs to S3 and query with Athena","C":"Stream logs to Kinesis and use Data Analytics","D":"Load logs into Redshift"},"answer":["B"],"explanation":"• CloudWatch Logs storage is expensive for long-term retention\n• Export to S3 significantly reduces storage costs\n• Athena queries S3 data with SQL ($5/TB scanned)\n• Most cost-effective for infrequent analysis\n• Logs Insights is good for recent logs\n• Kinesis adds streaming costs\n• Redshift requires cluster costs","module":"Analytics","multi":false,"src":"repo"},{"id":"11-15","q":"A Kinesis Data Firehose delivery stream should transform incoming JSON data using a Lambda function before storing in S3. How is this configured?","options":{"A":"Firehose doesn't support transformations","B":"Enable data transformation and specify the Lambda function ARN","C":"Use Kinesis Data Analytics for transformation","D":"Transform data before sending to Firehose"},"answer":["B"],"explanation":"• Kinesis Data Firehose supports Lambda transformation\n• Configure transformation in delivery stream settings\n• Firehose invokes Lambda for each batch\n• Lambda can modify, filter, or enrich data\n• Built-in feature, no separate service needed\n• Transforming before Firehose is possible but not optimal","module":"Analytics","multi":false,"src":"repo"},{"id":"11-16","q":"An analytics application queries data in S3 using Athena. The queries are running slowly despite optimizations. The data is already in Parquet format and partitioned. What else can improve performance?","options":{"A":"Optimize file sizes to 128 MB - 1 GB per file","B":"Switch to CSV format","C":"Disable partitioning","D":"Use smaller file sizes (1-10 MB)"},"answer":["A"],"explanation":"• Too many small files causes performance issues\n• Optimal file size is 128 MB - 1 GB\n• Athena opens each file, many small files = overhead\n• Combine small files into larger ones\n• CSV is less efficient than Parquet\n• Partitioning improves performance\n• Very small files slow down queries","module":"Analytics","multi":false,"src":"repo"},{"id":"11-17","q":"A company uses Athena with a Glue Data Catalog. They want to ensure different teams can only query their own datasets. How should access be controlled?","options":{"A":"Use S3 bucket policies","B":"Use IAM policies with Glue Catalog permissions","C":"Create separate AWS accounts","D":"Use Athena workgroups only"},"answer":["B"],"explanation":"• IAM policies control access to Glue Catalog databases and tables\n• Fine-grained permissions per team\n• Can combine with S3 bucket policies\n• Separate accounts is overly complex\n• Workgroups organize queries but don't enforce data access\n• Glue Catalog permissions are the primary control","module":"Analytics","multi":false,"src":"repo"},{"id":"11-18","q":"A real-time application needs guaranteed ordering of events for each user. Events should be processed in the order they arrive per user. Which Kinesis feature ensures this?","options":{"A":"Use the same shard for all records","B":"Use the user ID as the partition key","C":"Enable Kinesis enhanced fan-out","D":"Use multiple shards with round-robin distribution"},"answer":["B"],"explanation":"• Partition key determines which shard receives the record\n• Same partition key always goes to the same shard\n• Records in a shard are ordered by sequence number\n• Using user ID ensures all user events go to same shard (ordered)\n• One shard doesn't scale\n• Enhanced fan-out is for parallel consumers\n• Round-robin breaks ordering","module":"Analytics","multi":false,"src":"repo"},{"id":"11-19","q":"A company needs to load VPC Flow Logs into Amazon S3 for analysis with Athena. The solution should be fully managed with minimal setup. What should be configured?","options":{"A":"Use Kinesis Data Streams with Lambda","B":"Use Kinesis Data Firehose as the Flow Logs destination","C":"Use CloudWatch Logs with manual export","D":"Use custom EC2 instances to collect logs"},"answer":["B"],"explanation":"• VPC Flow Logs can deliver directly to Kinesis Data Firehose\n• Firehose automatically loads to S3\n• Fully managed, no code required\n• Can compress and partition data\n• Manual export isn't automated\n• Data Streams requires consumer application\n• EC2 instances add operational overhead","module":"Analytics","multi":false,"src":"repo"},{"id":"11-20","q":"An Athena workgroup is configured with a data usage control of 1 TB per day. A user's query would scan 1.5 TB of data. What happens?","options":{"A":"The query runs and scans 1.5 TB","B":"The query is rejected","C":"The query runs but only scans 1 TB","D":"The user receives a warning but query proceeds"},"answer":["B"],"explanation":"• Workgroup data usage controls enforce limits\n• Queries exceeding the limit are rejected\n• Prevents cost overruns\n• User must optimize query or request limit increase\n• Query doesn't partially execute\n• Hard enforcement, not just a warning","module":"Analytics","multi":false,"src":"repo"},{"id":"11-21","q":"A financial services company needs to securely share curated, third-party financial datasets with its data analysts on AWS. The solution must support subscription-based access and automate dataset updates. Which AWS service should be used?","options":{"A":"AWS Data Exchange","B":"Amazon S3","C":"AWS Glue Data Catalog","D":"Amazon Redshift Data Sharing"},"answer":["A"],"explanation":"• AWS Data Exchange enables secure, subscription-based access to third-party datasets\n• Automates dataset updates and notifications\n• Integrates with S3, Redshift, and Lake Formation\n• S3 is storage, not a data marketplace\n• Glue Data Catalog is for metadata, not data sharing\n• Redshift Data Sharing is for sharing data between Redshift clusters","module":"Analytics","multi":false,"src":"repo"},{"id":"11-22","q":"A healthcare company wants to build a secure data lake on AWS to store and analyze sensitive patient data. They need fine-grained access control, data cataloging, and integration with analytics services. Which service should be used to manage permissions and data cataloging?","options":{"A":"AWS Lake Formation","B":"Amazon S3","C":"AWS Glue","D":"Amazon Athena"},"answer":["A"],"explanation":"• Lake Formation provides fine-grained access control for data lakes\n• Manages permissions at table, column, and row level\n• Integrates with Glue Data Catalog and analytics services (Athena, Redshift, EMR)\n• S3 is storage, not access management\n• Glue is for ETL and cataloging, but Lake Formation extends Glue with security\n• Athena is for querying, not access management","module":"Analytics","multi":false,"src":"repo"},{"id":"11-23","q":"A media company needs to search, visualize, and analyze large volumes of log and event data in near real-time. Which AWS service is best suited for this use case?","options":{"A":"Amazon OpenSearch Service","B":"Amazon Athena","C":"Amazon Redshift","D":"AWS Glue"},"answer":["A"],"explanation":"• OpenSearch Service (formerly Elasticsearch) is designed for log analytics, search, and visualization\n• Provides near real-time indexing and querying\n• Integrates with Kibana for dashboards\n• Athena is for ad-hoc SQL queries, not real-time search\n• Redshift is for data warehousing\n• Glue is for ETL, not search/visualization","module":"Analytics","multi":false,"src":"repo"},{"id":"11-24","q":"A data engineering team needs to ingest streaming data from Apache Kafka into AWS for analytics and storage. Which AWS service provides a fully managed, highly available Kafka environment?","options":{"A":"Amazon MSK","B":"Amazon Kinesis Data Streams","C":"Amazon SQS","D":"AWS Glue Streaming"},"answer":["A"],"explanation":"• Amazon MSK (Managed Streaming for Apache Kafka) provides a fully managed Kafka service\n• Handles provisioning, patching, and scaling\n• Integrates with Kinesis, Lambda, S3, Redshift\n• Kinesis is a separate streaming service, not Kafka-compatible\n• SQS is for message queuing, not streaming\n• Glue Streaming is for ETL, not Kafka management","module":"Analytics","multi":false,"src":"repo"},{"id":"12-1","q":"A company needs to deploy a web application that can handle unpredictable traffic spikes and minimize operational overhead. The application should scale automatically and use a pay-per-use pricing model. Which architecture is MOST appropriate?","options":{"A":"EC2 instances with Auto Scaling behind an ALB","B":"Serverless architecture with S3, CloudFront, API Gateway, Lambda, and DynamoDB","C":"ECS containers on EC2 instances","D":"EC2 instances with manual scaling"},"answer":["B"],"explanation":"• Serverless architecture automatically scales and is pay-per-use\n• S3/CloudFront for static content\n• API Gateway/Lambda for compute (scales automatically)\n• DynamoDB for database (on-demand capacity)\n• Zero operational overhead for infrastructure\n• Option A requires some management and continuous costs\n• Option C requires container orchestration\n• Option D requires manual intervention","module":"Architecture Patterns","multi":false,"src":"repo"},{"id":"12-2","q":"A solutions architect is designing a highly available application that must survive the failure of an entire Availability Zone. The RTO requirement is less than 5 minutes. Which pattern should be implemented?","options":{"A":"Single AZ deployment with automated backups","B":"Multi-AZ deployment with Auto Scaling and Application Load Balancer","C":"Cross-region replication with manual failover","D":"Single region with daily snapshots"},"answer":["B"],"explanation":"• Multi-AZ deployment provides automatic failover\n• ALB distributes traffic across AZs and health checks instances\n• Auto Scaling replaces failed instances automatically\n• Meets < 5 minute RTO requirement\n• Option A doesn't protect against AZ failure\n• Option C has longer RTO (manual failover)\n• Option D doesn't provide HA","module":"Architecture Patterns","multi":false,"src":"repo"},{"id":"12-3","q":"A company wants to implement a disaster recovery solution for their production database. They can tolerate a 1-hour data loss (RPO) and 4-hour recovery time (RTO). Which DR strategy is MOST cost-effective?","options":{"A":"Multi-site active-active","B":"Warm standby","C":"Pilot light","D":"Backup and restore"},"answer":["C"],"explanation":"• Pilot light maintains core services (like database replication)\n• RPO: Minutes (database replication lag)\n• RTO: Hours (time to scale up remaining services)\n• More cost-effective than warm standby\n• Meets the 1-hour RPO and 4-hour RTO requirements\n• Multi-site is expensive and over-engineered\n• Warm standby costs more than necessary\n• Backup and restore may not meet RPO/RTO","module":"Architecture Patterns","multi":false,"src":"repo"},{"id":"12-4","q":"An application experiences high database read load. The data is read frequently but rarely updated. Which caching strategy should be implemented to reduce database load?","options":{"A":"Write-through caching","B":"Cache-aside (Lazy Loading) with ElastiCache","C":"Database connection pooling only","D":"Increase database instance size"},"answer":["B"],"explanation":"• Cache-aside pattern is ideal for read-heavy workloads\n• Application checks cache first, loads from DB if cache miss\n• ElastiCache (Redis/Memcached) reduces database load\n• Cost-effective solution\n• Write-through is better for write-heavy workloads\n• Connection pooling helps but doesn't cache data\n• Scaling database is more expensive","module":"Architecture Patterns","multi":false,"src":"repo"},{"id":"12-5","q":"A company is building a microservices architecture and needs to decouple services to handle traffic spikes without losing messages. Which AWS service pattern should be used?","options":{"A":"Direct API calls between services","B":"SQS queues between services","C":"Shared database between services","D":"File-based communication via S3"},"answer":["B"],"explanation":"• SQS provides loose coupling and buffering between services\n• Messages are persisted, not lost during traffic spikes\n• Services process at their own pace\n• Standard microservices pattern\n• Direct API calls create tight coupling\n• Shared database violates microservices principles\n• S3 file-based communication is inefficient for real-time","module":"Architecture Patterns","multi":false,"src":"repo"},{"id":"12-6","q":"A solutions architect needs to design a system that processes events from multiple sources (S3, DynamoDB, custom applications) and routes them to different targets based on event content. Which service is MOST appropriate?","options":{"A":"Amazon SQS","B":"Amazon SNS","C":"Amazon EventBridge","D":"AWS Step Functions"},"answer":["C"],"explanation":"• EventBridge is an event bus for routing events\n• Supports multiple sources including AWS services and custom apps\n• Content-based filtering and routing\n• Built-in integration with 90+ AWS services\n• SQS is for point-to-point messaging\n• SNS is for pub/sub but limited filtering\n• Step Functions is for workflow orchestration","module":"Architecture Patterns","multi":false,"src":"repo"},{"id":"12-7","q":"A company wants to minimize costs for a batch processing workload that runs nightly and can tolerate interruptions. Which compute option should be used?","options":{"A":"On-Demand EC2 instances","B":"Reserved Instances","C":"Spot Instances","D":"Dedicated Hosts"},"answer":["C"],"explanation":"• Spot Instances can save up to 90% compared to On-Demand\n• Batch processing is fault-tolerant (can handle interruptions)\n• Can checkpoint progress and resume\n• Most cost-effective for this use case\n• On-Demand is more expensive\n• Reserved requires 1-3 year commitment\n• Dedicated Hosts are most expensive","module":"Architecture Patterns","multi":false,"src":"repo"},{"id":"12-8","q":"An application requires sub-millisecond latency for database queries. The data is accessed in a key-value pattern. Which database solution should be used?","options":{"A":"Amazon RDS with read replicas","B":"DynamoDB with DAX (DynamoDB Accelerator)","C":"Amazon Aurora","D":"Amazon Redshift"},"answer":["B"],"explanation":"• DAX provides microsecond latency for DynamoDB\n• In-memory cache specifically for DynamoDB\n• Key-value access pattern is perfect for DynamoDB\n• Meets sub-millisecond requirement\n• RDS/Aurora have millisecond latency\n• Redshift is for analytics, not operational workloads","module":"Architecture Patterns","multi":false,"src":"repo"},{"id":"12-9","q":"A global application needs to serve static content with the lowest possible latency worldwide. Which architecture should be implemented?","options":{"A":"EC2 instances in multiple regions","B":"S3 with CloudFront distribution","C":"S3 with Cross-Region Replication","D":"ALB in multiple regions"},"answer":["B"],"explanation":"• CloudFront is a CDN with 400+ edge locations globally\n• Caches content close to users worldwide\n• S3 origin for static content\n• Lowest latency for global distribution\n• EC2 requires management and doesn't cache at edge\n• CRR helps availability but doesn't reduce latency\n• ALB doesn't provide edge caching","module":"Architecture Patterns","multi":false,"src":"repo"},{"id":"12-10","q":"A three-tier web application has presentation, application, and database tiers. The database contains sensitive customer data. How should the tiers be deployed for security?","options":{"A":"All tiers in public subnets","B":"All tiers in private subnets","C":"Presentation in public, application and database in private subnets","D":"Presentation and application in public, database in private subnet"},"answer":["C"],"explanation":"• Presentation tier (web servers) needs internet access - public subnet\n• Application tier doesn't need direct internet access - private subnet\n• Database tier must be isolated - private subnet\n• Follows defense-in-depth security principle\n• Application tier accesses internet via NAT Gateway\n• Database has no internet access\n• Minimizes attack surface","module":"Architecture Patterns","multi":false,"src":"repo"},{"id":"12-11","q":"A company needs to orchestrate a complex workflow with multiple Lambda functions, error handling, and retry logic. Which service should be used?","options":{"A":"EventBridge","B":"SNS with Lambda subscriptions","C":"AWS Step Functions","D":"SQS with Lambda triggers"},"answer":["C"],"explanation":"• Step Functions orchestrates workflows with state machines\n• Built-in error handling and retry logic\n• Visual workflow designer\n• Integrates with Lambda and other AWS services\n• Best for complex, multi-step workflows\n• EventBridge routes events but doesn't orchestrate\n• SNS/SQS don't provide workflow orchestration","module":"Architecture Patterns","multi":false,"src":"repo"},{"id":"12-12","q":"An application deployed across multiple regions needs a database that supports multi-region writes with automatic conflict resolution. Which database should be used?","options":{"A":"RDS with cross-region read replicas","B":"Aurora Global Database","C":"DynamoDB Global Tables","D":"Redshift with cross-region snapshots"},"answer":["C"],"explanation":"• DynamoDB Global Tables support multi-region active-active writes\n• Automatic conflict resolution (last-writer-wins)\n• Multi-master replication\n• RDS replicas are read-only\n• Aurora Global Database has one primary region for writes\n• Redshift is for analytics, not multi-region writes","module":"Architecture Patterns","multi":false,"src":"repo"},{"id":"12-13","q":"A company wants to implement a pub/sub messaging pattern where multiple consumers receive the same message. Which service should be used?","options":{"A":"Amazon SQS Standard Queue","B":"Amazon SQS FIFO Queue","C":"Amazon SNS","D":"Amazon Kinesis Data Streams"},"answer":["C"],"explanation":"• SNS is publish-subscribe messaging service\n• One message published to topic, multiple subscribers receive it\n• Fan-out pattern\n• Classic pub/sub use case\n• SQS is point-to-point (one consumer per message)\n• Kinesis allows multiple consumers but is for streaming data","module":"Architecture Patterns","multi":false,"src":"repo"},{"id":"12-14","q":"An application needs to process uploaded images: resize, apply filters, and update database. The processing can take several minutes. Which architecture ensures reliable processing?","options":{"A":"API Gateway → Lambda (process synchronously)","B":"API Gateway → Lambda → S3 → Lambda (triggered by S3) → DynamoDB","C":"EC2 instances polling S3","D":"Upload directly to EC2 for processing"},"answer":["B"],"explanation":"• Upload triggers first Lambda to save to S3\n• S3 event triggers second Lambda for processing (asynchronous)\n• Decoupled, reliable processing\n• Lambda can run up to 15 minutes\n• Option A: API Gateway has 29-second timeout\n• Option C: Inefficient polling\n• Option D: No auto-scaling, not serverless","module":"Architecture Patterns","multi":false,"src":"repo"},{"id":"12-15","q":"A financial application requires ACID transactions across multiple tables. The database must scale for read traffic. Which database solution should be used?","options":{"A":"DynamoDB","B":"Amazon Aurora with Read Replicas","C":"Amazon Redshift","D":"ElastiCache"},"answer":["B"],"explanation":"• Aurora supports ACID transactions (relational database)\n• Read Replicas scale read traffic (up to 15 replicas)\n• Better performance than standard RDS\n• DynamoDB doesn't support traditional ACID across multiple items\n• Redshift is for analytics, not transactional workloads\n• ElastiCache is for caching, not primary database","module":"Architecture Patterns","multi":false,"src":"repo"},{"id":"12-16","q":"A company needs to ensure their web application can handle a sudden 10x traffic increase during product launches. Which architectural pattern should be implemented?","options":{"A":"Static capacity with manual scaling","B":"Auto Scaling with target tracking based on CPU utilization","C":"Pre-warming with scheduled scaling","D":"Serverless architecture with Lambda and DynamoDB on-demand"},"answer":["D"],"explanation":"• Serverless scales automatically without pre-warming\n• Lambda scales to thousands of concurrent executions\n• DynamoDB on-demand scales with traffic\n• No capacity planning required\n• Option A doesn't scale\n• Option B has lag time for scaling\n• Option C requires predicting launch time\n• Serverless handles unpredictable spikes best","module":"Architecture Patterns","multi":false,"src":"repo"},{"id":"12-17","q":"An application uses CloudFront, ALB, EC2, and RDS. Users in a specific region experience slow performance. What is the MOST likely cause and solution?","options":{"A":"Increase EC2 instance size","B":"Deploy application stack in the user's region with Route 53 latency-based routing","C":"Enable CloudFront compression","D":"Upgrade to Provisioned IOPS for RDS"},"answer":["B"],"explanation":"• Regional deployment reduces latency for local users\n• Route 53 latency-based routing directs to nearest region\n• CloudFront caches static content but dynamic content goes to origin\n• Multi-region deployment needed for dynamic content\n• Increasing instance size doesn't reduce network latency\n• Compression helps but doesn't solve regional latency\n• IOPS doesn't affect network latency","module":"Architecture Patterns","multi":false,"src":"repo"},{"id":"12-18","q":"A company wants to implement defense-in-depth security for their web application. Which combination of services should be used?","options":{"A":"Security Groups only","B":"WAF + Shield + Security Groups + NACLs + KMS encryption","C":"IAM policies and Security Groups","D":"CloudFront with HTTPS only"},"answer":["B"],"explanation":"• Defense-in-depth requires multiple security layers\n• WAF: Application layer protection (OWASP Top 10)\n• Shield: DDoS protection\n• Security Groups: Instance-level firewall\n• NACLs: Subnet-level firewall\n• KMS: Data encryption\n• Layered approach provides comprehensive security\n• Single layer security is insufficient","module":"Architecture Patterns","multi":false,"src":"repo"},{"id":"12-19","q":"A batch processing application needs to read messages from a queue, process them, and only delete messages after successful processing. Which service and pattern should be used?","options":{"A":"SNS with immediate deletion","B":"SQS with visibility timeout and explicit deletion","C":"Kinesis with checkpointing","D":"EventBridge with Lambda"},"answer":["B"],"explanation":"• SQS supports visibility timeout (hides message during processing)\n• Message only deleted after explicit DeleteMessage call\n• Ensures message not lost if processing fails\n• If processing fails, message becomes visible again\n• SNS doesn't persist messages\n• Kinesis is for streaming, not queue pattern\n• EventBridge doesn't provide message persistence","module":"Architecture Patterns","multi":false,"src":"repo"},{"id":"12-20","q":"A company wants to optimize costs for a development environment that runs Monday-Friday, 9 AM-6 PM. The environment uses EC2, RDS, and NAT Gateway. What should be done?","options":{"A":"Use Reserved Instances","B":"Use Instance Scheduler to start/stop resources outside business hours","C":"Migrate to Serverless","D":"Use Spot Instances"},"answer":["B"],"explanation":"• Instance Scheduler automatically starts/stops resources on schedule\n• Saves costs during nights and weekends (65% of week)\n• Works with EC2 and RDS\n• Reserved Instances require 1-3 year commitment, doesn't stop resources\n• Serverless may not support all workloads\n• Spot Instances can be interrupted during work hours\n• Scheduled stop/start is most cost-effective for dev environments","module":"Architecture Patterns","multi":false,"src":"repo"},{"id":"13-1","q":"A company has a web application running on 20 EC2 instances that operate 24/7 with consistent usage. The instances have been running for 2 years and are expected to run for at least 2 more years. What is the MOST cost-effective pricing model?","options":{"A":"On-Demand Instances","B":"1-year Reserved Instances with No Upfront payment","C":"3-year Reserved Instances with All Upfront payment","D":"Spot Instances"},"answer":["C"],"explanation":"• Steady-state workload running 24/7 is perfect for Reserved Instances\n• 3-year term provides highest discount (up to 72%)\n• All Upfront payment provides maximum savings\n• Expected to run 2+ years, so 3-year commitment is justified\n• On-Demand is most expensive\n• Spot Instances can be interrupted\n• 1-year RI provides lower discount than 3-year","module":"Cost Optimization","multi":false,"src":"repo"},{"id":"13-2","q":"A company runs batch processing jobs that can be interrupted and resumed without data loss. The jobs run for 4-6 hours daily. What is the MOST cost-effective compute option?","options":{"A":"On-Demand Instances","B":"Reserved Instances","C":"Spot Instances","D":"Dedicated Hosts"},"answer":["C"],"explanation":"• Spot Instances provide up to 90% savings vs On-Demand\n• Batch processing is fault-tolerant (can handle interruptions)\n• Jobs can checkpoint and resume\n• Perfect use case for Spot\n• On-Demand is too expensive\n• Reserved requires commitment (not needed for 4-6 hours daily)\n• Dedicated Hosts are most expensive","module":"Cost Optimization","multi":false,"src":"repo"},{"id":"13-3","q":"A solutions architect needs to reduce S3 storage costs for 500 TB of log data. Logs older than 30 days are rarely accessed but must be retained for 7 years for compliance. What should be done?","options":{"A":"Keep all data in S3 Standard","B":"Use S3 lifecycle policies to transition data to S3 Glacier Deep Archive after 30 days","C":"Delete logs after 30 days","D":"Use S3 Intelligent-Tiering for all data"},"answer":["B"],"explanation":"• S3 Glacier Deep Archive is cheapest storage class ($0.00099/GB/month)\n• Lifecycle policies automatically transition objects\n• Meets 7-year retention requirement\n• Transition after 30 days when access becomes rare\n• S3 Standard costs $0.023/GB/month (23x more expensive)\n• Deleting violates compliance\n• Intelligent-Tiering costs more than Glacier Deep Archive\nSavings: 500 TB × ($0.023 - $0.00099) × 12 months = ~$132,000/year","module":"Cost Optimization","multi":false,"src":"repo"},{"id":"13-4","q":"An application uses a mix of EC2 instances (different families and sizes) across multiple regions, along with Fargate and Lambda. The usage is steady and predictable. Which pricing model provides the MOST flexibility and savings?","options":{"A":"EC2 Reserved Instances","B":"Compute Savings Plans","C":"EC2 Instance Savings Plans","D":"On-Demand Instances"},"answer":["B"],"explanation":"• Compute Savings Plans apply to EC2, Fargate, and Lambda\n• Most flexible (any instance family, region, size)\n• Up to 66% discount\n• Automatically applies to eligible usage\n• EC2 RIs only cover EC2, not Fargate/Lambda\n• EC2 Instance Savings Plans limited to specific instance family\n• On-Demand provides no discount","module":"Cost Optimization","multi":false,"src":"repo"},{"id":"13-5","q":"A company wants to identify which EC2 instances are underutilized and could be downsized to reduce costs. Which AWS tool provides this recommendation?","options":{"A":"AWS Budgets","B":"AWS Cost Explorer with Right-Sizing Recommendations","C":"AWS Trusted Advisor","D":"Both B and C"},"answer":["D"],"explanation":"• Cost Explorer provides right-sizing recommendations\n• Trusted Advisor also provides underutilized instance recommendations\n• Both analyze CloudWatch metrics (CPU, memory, network)\n• Both suggest smaller instance types and estimate savings\n• Budgets sets spending limits but doesn't analyze utilization\n• Using both tools provides comprehensive insights","module":"Cost Optimization","multi":false,"src":"repo"},{"id":"13-6","q":"A development team runs EC2 instances Monday-Friday, 9 AM-6 PM. The instances sit idle outside business hours. What is the MOST cost-effective approach?","options":{"A":"Use Reserved Instances","B":"Use Spot Instances","C":"Use Instance Scheduler to automatically stop instances outside business hours","D":"Manually stop instances daily"},"answer":["C"],"explanation":"• Instance Scheduler automates start/stop based on schedules\n• Running only 45 hours/week instead of 168 hours saves ~73%\n• No manual intervention required\n• Reserved Instances charge 24/7 whether running or not\n• Spot Instances could be interrupted during work hours\n• Manual stopping is error-prone and requires effort\nSavings: Running 45/168 hours = 73% time savings","module":"Cost Optimization","multi":false,"src":"repo"},{"id":"13-7","q":"A company has multiple AWS accounts and wants to get volume discounts and consolidated billing. What should they implement?","options":{"A":"AWS Budgets","B":"AWS Cost Explorer","C":"AWS Organizations with consolidated billing","D":"AWS Marketplace"},"answer":["C"],"explanation":"• AWS Organizations enables consolidated billing\n• Combines usage across all accounts for volume discounts\n• Single bill for all accounts\n• Shared Reserved Instances and Savings Plans\n• Cost Explorer and Budgets are reporting tools\n• Marketplace is for purchasing software","module":"Cost Optimization","multi":false,"src":"repo"},{"id":"13-8","q":"An application stores 1 PB of data in S3 with unpredictable access patterns. Some objects are accessed frequently, others rarely. What is the MOST cost-effective storage solution?","options":{"A":"S3 Standard for all objects","B":"S3 Intelligent-Tiering","C":"Manually move objects to different storage classes","D":"S3 Glacier for all objects"},"answer":["B"],"explanation":"• S3 Intelligent-Tiering automatically moves objects between access tiers\n• Optimizes costs without manual intervention\n• Monitoring fee: $0.0025/1000 objects\n• No retrieval fees for Frequent/Infrequent tiers\n• S3 Standard wastes money on infrequently accessed data\n• Manual management is operationally intensive\n• Glacier has retrieval delays for frequent access","module":"Cost Optimization","multi":false,"src":"repo"},{"id":"13-9","q":"A company wants to forecast their AWS costs for the next 6 months based on current usage trends. Which tool should they use?","options":{"A":"AWS Budgets","B":"AWS Cost Explorer with forecasting","C":"AWS Trusted Advisor","D":"AWS Cost and Usage Report"},"answer":["B"],"explanation":"• Cost Explorer provides cost forecasting up to 12 months\n• Based on historical usage patterns\n• Interactive graphs showing predictions\n• 80% confidence interval\n• Budgets sets alerts but doesn't forecast\n• Trusted Advisor provides recommendations\n• Cost and Usage Report is for detailed analysis","module":"Cost Optimization","multi":false,"src":"repo"},{"id":"13-10","q":"A company has 50 m5.large instances running continuously in us-east-1 with consistent usage. They want to purchase Reserved Instances. What type provides the highest discount?","options":{"A":"Standard RI, 1-year, No Upfront","B":"Standard RI, 3-year, All Upfront","C":"Convertible RI, 3-year, All Upfront","D":"Convertible RI, 1-year, Partial Upfront"},"answer":["B"],"explanation":"• Standard RIs provide higher discount than Convertible (up to 72%)\n• 3-year term provides higher discount than 1-year\n• All Upfront payment provides highest discount\n• Consistent usage makes 3-year commitment viable\n• Convertible RIs have lower discount (up to 54%)\n• Partial/No Upfront have lower discounts","module":"Cost Optimization","multi":false,"src":"repo"},{"id":"13-11","q":"An RDS database runs continuously but only needs Multi-AZ during business hours for high availability. How can costs be optimized?","options":{"A":"This is not possible; Multi-AZ cannot be toggled","B":"Disable Multi-AZ outside business hours, re-enable during business hours","C":"Use Aurora Serverless","D":"Use read replicas instead of Multi-AZ"},"answer":["B"],"explanation":"• Multi-AZ can be enabled/disabled (causes brief downtime)\n• For non-production databases, can disable outside business hours\n• Reduces costs by ~50% when disabled\n• Can be scripted/automated with Lambda\n• Aurora Serverless has different use case\n• Read replicas don't provide automatic failover\nNote: This is only suitable for non-production workloads","module":"Cost Optimization","multi":false,"src":"repo"},{"id":"13-12","q":"A company wants to track costs by department (Engineering, Marketing, Finance). How should they implement this?","options":{"A":"Create separate AWS accounts for each department","B":"Use Cost Allocation Tags and activate them in the Billing console","C":"Use different regions for each department","D":"Create separate VPCs for each department"},"answer":["B"],"explanation":"• Cost Allocation Tags enable tracking costs by custom dimensions\n• Tag resources with \"Department\" key and values\n• Activate tags in Billing console to appear in reports\n• View costs grouped by department in Cost Explorer\n• Separate accounts add management overhead\n• Regions don't affect cost tracking\n• VPCs don't enable cost tracking","module":"Cost Optimization","multi":false,"src":"repo"},{"id":"13-13","q":"A Lambda function is configured with 3008 MB memory but only uses 512 MB. The function runs 10 million times per month. What should be done to optimize costs?","options":{"A":"Increase memory to 10 GB","B":"Reduce memory allocation to 512 MB","C":"Switch to EC2","D":"Keep current configuration"},"answer":["B"],"explanation":"• Lambda charges based on GB-seconds (memory × duration)\n• Allocating 3008 MB when only 512 MB is used wastes money\n• Reducing to 512 MB reduces costs ~6x\n• Right-sizing memory is critical for Lambda cost optimization\n• Increasing memory increases costs\n• EC2 adds operational overhead\n• Current configuration is wasteful\nCalculation: 3008 MB vs 512 MB = 5.86x cost reduction","module":"Cost Optimization","multi":false,"src":"repo"},{"id":"13-14","q":"A company has Reserved Instances that are expiring soon. They want to know if they should renew. Which Cost Explorer feature helps with this decision?","options":{"A":"Cost forecasting","B":"Reserved Instance Utilization report","C":"Right-sizing recommendations","D":"Savings Plans recommendations"},"answer":["B"],"explanation":"• RI Utilization report shows how much Reserved capacity is used\n• High utilization (>80%) indicates RI should be renewed\n• Low utilization suggests downsizing or not renewing\n• Also shows RI Coverage (what % of usage is covered)\n• Cost forecasting predicts future costs\n• Right-sizing is for instance size optimization\n• Savings Plans recommendations compare to RIs","module":"Cost Optimization","multi":false,"src":"repo"},{"id":"13-15","q":"Data transfer costs are high for a web application serving static content globally. How can data transfer costs be reduced?","options":{"A":"Use S3 Transfer Acceleration","B":"Use CloudFront as a CDN","C":"Move data to Glacier","D":"Use larger EC2 instances"},"answer":["B"],"explanation":"• CloudFront reduces data transfer from origin\n• Caches content at edge locations globally\n• Data transfer from CloudFront to users is cheaper than from EC2/S3\n• Free data transfer from S3/EC2 to CloudFront\n• S3 Transfer Acceleration accelerates uploads, doesn't reduce costs\n• Glacier is for archival, not active content\n• Instance size doesn't affect transfer costs","module":"Cost Optimization","multi":false,"src":"repo"},{"id":"13-16","q":"A company wants to set a budget of $10,000/month and receive alerts at 80% and 100% of budget. Which service should be used?","options":{"A":"AWS Cost Explorer","B":"AWS Budgets","C":"CloudWatch Alarms","D":"AWS Trusted Advisor"},"answer":["B"],"explanation":"• AWS Budgets creates custom cost and usage budgets\n• Set thresholds (80%, 100%) for alerts\n• Sends SNS notifications when thresholds are exceeded\n• Can set monthly, quarterly, or annual budgets\n• Cost Explorer analyzes costs but doesn't alert\n• CloudWatch monitors resources, not costs\n• Trusted Advisor provides recommendations","module":"Cost Optimization","multi":false,"src":"repo"},{"id":"13-17","q":"A company has a mix of Convertible and Standard Reserved Instances. They want to change instance families due to application changes. Which RIs can be modified?","options":{"A":"Only Standard RIs","B":"Only Convertible RIs","C":"Both can be modified","D":"Neither can be modified"},"answer":["B"],"explanation":"• Convertible RIs can change instance family, OS, and tenancy\n• Provides flexibility for changing requirements\n• Standard RIs cannot change instance family\n• Standard RIs can only change instance size within same family\n• Trade-off: Convertible RIs have lower discount (54% vs 72%)","module":"Cost Optimization","multi":false,"src":"repo"},{"id":"13-18","q":"A database requires 3000 IOPS consistently. Currently using GP3 with 16,000 IOPS provisioned. What should be done to optimize costs?","options":{"A":"Switch to GP2","B":"Reduce provisioned IOPS to 3000 on GP3","C":"Switch to Magnetic storage","D":"Keep current configuration"},"answer":["B"],"explanation":"• GP3 allows independent provisioning of IOPS\n• Reduce from 16,000 to 3,000 IOPS to reduce costs\n• Still provides required performance\n• GP2 IOPS scale with volume size (less flexible)\n• Magnetic storage has unpredictable performance\n• Current configuration over-provisions by 5x","module":"Cost Optimization","multi":false,"src":"repo"},{"id":"13-19","q":"A company wants to identify unused EBS volumes and old snapshots to reduce costs. Which tools can help?","options":{"A":"AWS Trusted Advisor only","B":"AWS Cost Explorer only","C":"Both Trusted Advisor and custom scripts/AWS Config","D":"AWS Budgets"},"answer":["C"],"explanation":"• Trusted Advisor identifies unattached EBS volumes\n• Custom scripts can identify old snapshots\n• AWS Config Rules can detect unattached volumes\n• Combine multiple approaches for comprehensive cleanup\n• Cost Explorer shows costs but doesn't identify unused resources\n• Budgets sets limits but doesn't identify waste","module":"Cost Optimization","multi":false,"src":"repo"},{"id":"13-20","q":"A company runs a web application with unpredictable traffic that can spike 10x instantly. They want to minimize costs while ensuring performance. What architecture should be used?","options":{"A":"Fixed number of EC2 On-Demand instances","B":"EC2 Auto Scaling with target tracking + Spot Instances","C":"Large Reserved Instances","D":"Manual scaling with CloudWatch alarms"},"answer":["B"],"explanation":"• Auto Scaling automatically adjusts capacity based on demand\n• Target tracking scales based on metrics (CPU, requests, etc.)\n• Spot Instances reduce costs (up to 90%) for scale-out capacity\n• Can combine On-Demand (baseline) + Spot (spikes)\n• Fixed capacity wastes money during low traffic\n• Reserved Instances charge for capacity even if unused\n• Manual scaling is slow and error-prone","module":"Cost Optimization","multi":false,"src":"repo"},{"id":"14-1","q":"An Auto Scaling group isn't responding to CloudWatch alarms despite the alarm firing. What's the most likely cause?","options":{"A":"Wrong CloudWatch metric configured","B":"The Auto Scaling group is in cooldown period","C":"Minimum size of ASG is 0","D":"Desired size of ASG is 0"},"answer":["B"],"explanation":"Cooldown periods suppress scaling actions to let metrics stabilize after a scaling event.","module":"Compute","multi":false,"src":"repo"},{"id":"14-2","q":"You need to upgrade one EC2 instance in an ASG without receiving traffic. What should you do?","options":{"A":"Hibernate the instance","B":"Use cooldown timers","C":"Put instance in Standby, upgrade, return to InService","D":"Use lifecycle hooks"},"answer":["C"],"explanation":"Standby detaches from load balancing while retaining in ASG, preventing replacement.","module":"Compute","multi":false,"src":"repo"},{"id":"14-3","q":"How do you achieve WORM (Write Once Read Many) in S3?","options":{"A":"Enable versioning","B":"Enable Object Lock at bucket creation","C":"Use S3 Glacier","D":"Configure bucket policy"},"answer":["B"],"explanation":"Object Lock enforces WORM with retention periods; must be enabled at bucket creation.","module":"Storage","multi":false,"src":"repo"},{"id":"14-4","q":"After deleting an S3 object (no versioning), what do you see immediately in a list-objects call?","options":{"A":"Object still appears","B":"Object is deleted","C":"May appear or not depending on consistency","D":"Object has a delete marker"},"answer":["B"],"explanation":"S3 provides strong consistency; object disappears immediately after successful delete.","module":"Storage","multi":false,"src":"repo"},{"id":"14-5","q":"What VPC feature provides private connectivity to S3 and DynamoDB without cost?","options":{"A":"NAT Gateway","B":"VPC Peering","C":"Gateway Endpoints","D":"Interface Endpoints"},"answer":["C"],"explanation":"Gateway endpoints for S3/DynamoDB are free and route-table based.","module":"Networking","multi":false,"src":"repo"},{"id":"14-6","q":"Internet-facing ALB requests fail despite healthy targets. What's likely wrong?","options":{"A":"ALB subnet route table lacks IGW route","B":"Targets in public subnet","C":"ALB has no Elastic IP","D":"Cross-zone LB disabled"},"answer":["A"],"explanation":"ALB must be in public subnets with 0.0.0.0/0 → IGW route.","module":"Networking","multi":false,"src":"repo"},{"id":"14-7","q":"Your read-heavy app hits 100% CPU on RDS. What helps scale reads? (Choose 3)","options":{"A":"Add Read Replicas","B":"Enable Storage Auto Scaling","C":"Use SQS to throttle","D":"Use ElastiCache","E":"Shard across multiple RDS instances","F":"Enable Multi-AZ"},"answer":["A","D","E"],"explanation":"Read replicas, caching, and sharding all reduce read load on primary.","module":"Database","multi":true,"src":"repo"},{"id":"14-8","q":"Multi-AZ RDS deployment provides:","options":{"A":"Read scaling","B":"Automatic failover for high availability","C":"Cross-region disaster recovery","D":"Cost optimization"},"answer":["B"],"explanation":"Multi-AZ maintains synchronous standby for automatic failover, not for reads.","module":"Database","multi":false,"src":"repo"},{"id":"14-9","q":"Lambda needs to write CloudWatch Logs. Which permissions required? (Choose 3)","options":{"A":"logs:CreateLogGroup","B":"logs:GetLogEvents","C":"logs:CreateLogStream","D":"logs:DescribeLogStreams","E":"logs:PutLogEvents"},"answer":["A","C","E"],"explanation":"Lambda runtime needs all three to create log groups, streams, and write events.","module":"Application Integration","multi":true,"src":"repo"},{"id":"14-10","q":"Which ECS networking mode provides task-level security groups?","options":{"A":"Host","B":"Bridge","C":"awsvpc","D":"Default"},"answer":["C"],"explanation":"awsvpc gives each task its own ENI, enabling task-level security groups.","module":"Application Integration","multi":false,"src":"repo"},{"id":"14-11","q":"How do you restrict S3 bucket access to specific IAM roles only?","options":{"A":"Bucket policy with explicit deny for all except listed roles","B":"Bucket policy with explicit deny for all users except listed","C":"Bucket policy allowing only specific role; users assume role","D":"Bucket policy with NotPrincipal"},"answer":["C"],"explanation":"Grant bucket access to a role; users authenticate then assume that role.","module":"Security","multi":false,"src":"repo"},{"id":"14-12","q":"CloudFront serves private content from S3. How do you grant access to multiple files?","options":{"A":"S3 pre-signed URLs","B":"CloudFront signed URLs","C":"CloudFront signed cookies","D":"CloudFront geo restrictions"},"answer":["C"],"explanation":"Signed cookies grant access to multiple objects without changing URLs.","module":"Security","multi":false,"src":"repo"},{"id":"14-13","q":"Which services identify underutilized EC2 instances? (Choose 2)","options":{"A":"CloudWatch","B":"SNS","C":"Trusted Advisor","D":"CloudTrail","E":"Config"},"answer":["A","C"],"explanation":"CloudWatch metrics and Trusted Advisor checks identify low-utilization instances.","module":"Cost Optimization","multi":true,"src":"repo"},{"id":"14-14","q":"Most cost-effective connectivity for small vendor team to VPC databases?","options":{"A":"AWS Client VPN","B":"Direct Connect","C":"Site-to-Site VPN to VGW","D":"Site-to-Site VPN to Transit Gateway"},"answer":["A"],"explanation":"Client VPN provides user-level auth, pay-as-you-go pricing, minimal setup.","module":"Cost Optimization","multi":false,"src":"repo"},{"id":"14-15","q":"Serverless media processing pipeline with visual workflow and priority queues?","options":{"A":"S3 → Lambda → SQS → DynamoDB","B":"S3 → Lambda → SWF → DynamoDB","C":"S3 → Lambda → process → DynamoDB","D":"S3 → Lambda → Step Functions → DynamoDB"},"answer":["D"],"explanation":"Step Functions orchestrates with visual console, priority via separate entry points.","module":"Architecture Patterns","multi":false,"src":"repo"}];</script>
<script>
(function(){
"use strict";
const PLAN=window.PLAN, TOPICS=window.TOPICS, CARDS=window.CARDS, DEC=window.DECODER, Q=window.QUESTIONS;
const QBY={}; Q.forEach(q=>QBY[q.id]=q);
