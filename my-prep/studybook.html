const MODULES=[...new Set(Q.map(q=>q.module))];
const TOPIC=Object.fromEntries(TOPICS.map(t=>[t.id,t]));
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const md=s=>esc(s).replace(/\*\*(.+?)\*\*/g,"<strong>$1</strong>").replace(/\*(.+?)\*/g,"<em>$1</em>").replace(/`(.+?)`/g,"<code>$1</code>");
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};

// ---------- state ----------
const KEY="saa-studybook-v1";
let S={tasks:{},conf:{},q:{},cards:{},mocks:[]};
try{const raw=localStorage.getItem(KEY); if(raw) S=Object.assign(S,JSON.parse(raw));}catch(e){}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
function toast(t){const el=$("#toast");el.textContent=t;el.hidden=false;clearTimeout(toast._t);toast._t=setTimeout(()=>el.hidden=true,1800)}
function record(id,ok){const r=S.q[id]||{s:0,c:0,w:0};r.s++;ok?r.c++:r.w++;r.last=ok;S.q[id]=r;save();}

// ---------- dates ----------
function todayISO(){const d=new Date();const p=n=>String(n).padStart(2,"0");return d.getFullYear()+"-"+p(d.getMonth()+1)+"-"+p(d.getDate());}
function countdown(){
  const today=new Date(todayISO()+"T00:00:00"), exam=new Date(window.EXAM_DATE+"T00:00:00");
  const days=Math.round((exam-today)/864e5);
  const n=$("#cdN"), l=$("#cdL");
  if(days>1){n.textContent=days;l.innerHTML="days<br>to exam";}
  else if(days===1){n.textContent="1";l.innerHTML="day — exam<br>tomorrow";}
  else if(days===0){n.textContent="0";l.innerHTML="exam<br>today";}
  else {n.textContent="✓";l.innerHTML="exam<br>done";}
}

// ---------- tabs ----------
const VIEWS=[["plan","Plan"],["notes","Notes"],["decoder","Decoder"],["cards","Flashcards"],["practice","Practice"],["mock","Mock exam"],["progress","Progress"]];
let view="plan";
function renderTabs(){
  $("#tabs").innerHTML=VIEWS.map(([k,l])=>`<button role="tab" id="tab-${k}" aria-selected="${k===view}" data-v="${k}">${l}</button>`).join("");
}
$("#tabs").addEventListener("click",e=>{const b=e.target.closest("button[data-v]");if(b)go(b.dataset.v)});
function go(v,opt){ if(mock.running && v!=="mock"){/* allow, timer keeps running */}
  view=v;renderTabs();render(opt);window.scrollTo({top:0});}

// ---------- PLAN ----------
function planView(){
  const t=todayISO();
  const totalTasks=PLAN.reduce((a,d)=>a+d.tasks.length,0);
  const doneTasks=Object.values(S.tasks).filter(Boolean).length;
  let h=`<div class="panel row" style="justify-content:space-between">
    <div><div class="eyebrow">Plan progress</div><div><strong>${doneTasks}</strong> of ${totalTasks} tasks done</div></div>
    <div style="flex:1;min-width:160px;max-width:420px"><div class="bar"><i style="width:${Math.round(doneTasks/totalTasks*100)}%"></i></div></div>

const MOCK_N=65, MOCK_SEC=130*60;
let mockSrc="all";
let mock={running:false,ids:[],ans:{},flags:{},i:0,end:0,result:null,confirm:false,review:"wrong"};
try{const m=JSON.parse(localStorage.getItem(KEY+"-mock")||"null"); if(m&&m.running&&m.end>Date.now()) mock=Object.assign(mock,m);}catch(e){}
function saveMock(){try{localStorage.setItem(KEY+"-mock",JSON.stringify(mock.running?{running:true,ids:mock.ids,ans:mock.ans,flags:mock.flags,i:mock.i,end:mock.end}:null))}catch(e){}}
function startMock(){
  // weight by exam domains roughly: pick unseen first, spread across modules
  const base=Q.filter(q=>inSrc(q,mockSrc));
  const un=shuffle(base.filter(q=>!S.q[q.id])), seen=shuffle(base.filter(q=>S.q[q.id]));
  const pool=un.concat(seen);
  // round-robin by module for spread
  const by={};pool.forEach(q=>(by[q.module]=by[q.module]||[]).push(q));
  const out=[];const mods=shuffle(Object.keys(by));
  while(out.length<MOCK_N&&mods.some(m=>by[m].length)){for(const m of mods){if(by[m].length&&out.length<MOCK_N)out.push(by[m].shift())}}
  mock={running:true,ids:shuffle(out).map(q=>q.id),ans:{},flags:{},i:0,end:Date.now()+MOCK_SEC*1000,result:null,confirm:false,review:"wrong"};
  saveMock();render();
}
function finishMock(){
  let right=0;const per={};
  mock.ids.forEach(id=>{const q=QBY[id],sel=mock.ans[id]||[],ok=isRight(q,sel);if(ok)right++;record(id,ok);
    per[q.module]=per[q.module]||{r:0,n:0};per[q.module].n++;if(ok)per[q.module].r++;});
  const pct=Math.round(right/mock.ids.length*100);
  S.mocks.push({d:new Date().toISOString(),r:right,n:mock.ids.length,p:pct});save();
  mock.running=false;mock.result={right,pct,per,ids:mock.ids.slice(),ans:Object.assign({},mock.ans)};mock.confirm=false;saveMock();render();
}

  <div class="row" style="margin-top:16px">${mock.confirm?`<span>Submit with ${mock.ids.length-answered} unanswered?</span><button class="btn primary" id="mksubmit2">Yes, submit</button><button class="btn" id="mkcancel">Keep going</button>`:`<button class="btn" id="mksubmit">Submit exam</button>`}</div></div>`;

// ---------- PROGRESS ----------
let resetConfirm=false;
function progressView(){
  const ids=Object.keys(S.q).filter(id=>QBY[id]);
  const att=ids.reduce((a,id)=>a+S.q[id].s,0), cor=ids.reduce((a,id)=>a+S.q[id].c,0);
  const per=MODULES.map(m=>{const qs=Q.filter(q=>q.module===m);const seen=qs.filter(q=>S.q[q.id]);
    const c=seen.reduce((a,q)=>a+S.q[q.id].c,0), n=seen.reduce((a,q)=>a+S.q[q.id].s,0);
    return {m,total:qs.length,seen:seen.length,acc:n?Math.round(c/n*100):null}});
  const weak=per.filter(p=>p.acc!==null).sort((a,b)=>a.acc-b.acc).slice(0,3);
  const weakConf=TOPICS.filter(t=>S.conf[t.id]===1);
  const totalTasks=PLAN.reduce((a,d)=>a+d.tasks.length,0), doneTasks=Object.values(S.tasks).filter(Boolean).length;
  const missed=ids.filter(id=>S.q[id].w>0&&!S.q[id].last).length;
  const bySrc=k=>{const xs=ids.filter(id=>QBY[id].src===k);const c=xs.reduce((a,id)=>a+S.q[id].c,0),n=xs.reduce((a,id)=>a+S.q[id].s,0);return {seen:xs.length,total:Q.filter(q=>q.src===k).length,acc:n?Math.round(c/n*100):null}};
  const rb=bySrc("repo"), yb=bySrc("bank");
  return `<div class="statgrid">
    <div class="panel stat"><div class="eyebrow">Questions seen</div><div class="v">${ids.length}<span class="muted" style="font-size:1rem"> / ${Q.length}</span></div></div>
    <div class="panel stat"><div class="eyebrow">Accuracy</div><div class="v">${att?Math.round(cor/att*100)+"%":"—"}</div></div>
    <div class="panel stat"><div class="eyebrow">Still missed</div><div class="v">${missed}</div></div>
    <div class="panel stat"><div class="eyebrow">Best mock</div><div class="v">${S.mocks.length?Math.max(...S.mocks.map(m=>m.p))+"%":"—"}</div></div>
    <div class="panel stat"><div class="eyebrow">Repo bank</div><div class="v">${rb.acc===null?"—":rb.acc+"%"}</div><div class="muted" style="font-size:.84rem">${rb.seen} / ${rb.total} seen</div></div>
    <div class="panel stat"><div class="eyebrow">Plan tasks</div><div class="v">${doneTasks}<span class="muted" style="font-size:1rem"> / ${totalTasks}</span></div></div>
  </div>
  <div class="panel"><div class="row" style="justify-content:space-between;margin-bottom:12px"><h3>Accuracy by module</h3><span class="muted" style="font-size:.84rem">bar = accuracy · right = seen / total</span></div>
  <div style="display:grid;gap:9px">${per.map(p=>`<div class="modrow"><button class="btn small ghost" style="text-align:left;justify-self:start" data-drill="${esc(p.m)}">${esc(p.m)}</button><div class="bar ${p.acc===null?"":p.acc>=75?"ok":p.acc>=60?"warn":"bad"}"><i style="width:${p.acc||0}%"></i></div><span class="num">${p.acc===null?"—":p.acc+"%"} · ${p.seen}/${p.total}</span></div>`).join("")}</div></div>
  <div class="panel"><h3>Focus next</h3><ul style="margin:8px 0 0;padding-left:20px;display:grid;gap:4px">
    ${weak.length?weak.map(w=>`<li><strong>${esc(w.m)}</strong> — ${w.acc}% accuracy. <button class="btn small" data-drillmissed="${esc(w.m)}">Drill missed</button></li>`).join(""):"<li class='muted'>Answer some questions to see your weakest modules.</li>"}
    ${weakConf.map(t=>`<li>You marked <strong>${esc(t.title)}</strong> as weak. <button class="btn small" data-note="${t.id}">Re-read</button></li>`).join("")}
  </ul></div>
  <div class="panel row" style="justify-content:space-between"><div><h3>Progress is saved in this browser</h3><div class="muted" style="font-size:.86rem">It won't sync between your phone and laptop.</div></div>
  ${resetConfirm?`<div class="row"><span>Erase all progress?</span><button class="btn" id="rsyes" style="border-color:var(--bad);color:var(--bad)">Erase</button><button class="btn" id="rsno">Cancel</button></div>`:`<button class="btn ghost" id="rs">Reset progress…</button>`}</div>`;
}

// ---------- render & events ----------
function render(){
  const app=$("#app");
  const map={plan:planView,notes:notesView,decoder:decoderView,cards:cardsView,practice:practiceView,mock:mockView,progress:progressView};
  app.innerHTML=`<div class="view">${map[view]()}</div>`;
  countdown();
}
document.addEventListener("change",e=>{
  const t=e.target;
  if(t.dataset.task){S.tasks[t.dataset.task]=t.checked;save();render();if(t.checked)toast("Task done");}
  if(t.id==="tocsel"){noteId=t.value;render();}
  if(t.id==="dect"){decState.topic=t.value;render();}
  if(t.id==="deck"){buildDeck(t.value);render();}
  if(t.id==="prorder") pr.order=t.value;
  if(t.id==="prcount") pr.count=t.value==="all"?"all":+t.value;
});
document.addEventListener("input",e=>{
  if(e.target.id==="decq"){decState.q=e.target.value;const pos=e.target.selectionStart;render();const i=$("#decq");i.focus();i.setSelectionRange(pos,pos);}
});
document.addEventListener("click",e=>{
  const b=e.target.closest("button,[data-dec],#fcard");if(!b)return;
  const d=b.dataset;
  if(d.note){noteId=d.note;go("notes");return;}
  if(d.topic){noteId=d.topic;render();window.scrollTo({top:0});return;}
  if(d.go){go(d.go);return;}
  if(d.drill){pr.mods=d.drill.split("|");pr.order="unseen";pr.run=null;go("practice");return;}
  if(d.drillmissed){pr.mods=[d.drillmissed];pr.order="missed";pr.count="all";pr.run=null;go("practice");startPractice();return;}
  if(d.deck){buildDeck(d.deck);go("cards");return;}
  if(d.deckset){buildDeck(d.deckset);render();return;}
  if(d.conf){const v=+d.conf;S.conf[noteId]=S.conf[noteId]===v?0:v;save();render();return;}
  if(d.dec!==undefined){decState.shown[d.dec]=!decState.shown[d.dec];render();return;}
  if(b.id==="decr"){decState.reveal=!decState.reveal;decState.shown={};render();return;}
  // flashcards
  if(b.id==="fcard"||b.id==="fcflip"){fc.back=!fc.back;render();return;}
  if(b.id==="fcgot"||b.id==="fcagain"){S.cards[fc.order[fc.i]]=b.id==="fcgot"?"got":"again";save();fc.i++;fc.back=false;render();return;}
  if(b.id==="fcrestart"){buildDeck(fc.deck);render();return;}
  // practice
  if(d.mod){const m=d.mod;pr.mods=pr.mods.includes(m)?pr.mods.filter(x=>x!==m):pr.mods.concat(m);render();return;}
  if(b.id==="prclear"){pr.mods=[];render();return;}
  if(d.src){pr.src=d.src;render();return;}
  if(d.msrc){mockSrc=d.msrc;render();return;}
  if(b.id==="prstart"||b.id==="pragain"){startPractice();return;}
  if(b.id==="prsetup"||b.id==="prquit"){pr.run=null;render();return;}
  if(b.id==="prretry"){const w=pr.run.wrongIds;pr.run={ids:shuffle(w),i:0,sel:[],revealed:false,right:0,wrongIds:[]};render();return;}
  if(d.opt&&view==="practice"&&pr.run&&!pr.run.revealed){const q=QBY[pr.run.ids[pr.run.i]];pr.run.sel=toggleSel(q,pr.run.sel,d.opt);render();return;}
  if(b.id==="prcheck"){const r=pr.run,q=QBY[r.ids[r.i]];r.revealed=true;const ok=isRight(q,r.sel);record(q.id,ok);if(ok)r.right++;else r.wrongIds.push(q.id);render();return;}
  if(b.id==="prnext"){const r=pr.run;r.i++;r.sel=[];r.revealed=false;render();window.scrollTo({top:0});return;}
  // mock
  if(b.id==="mkstart"||b.id==="mknew"){startMock();return;}
  if(d.opt&&view==="mock"&&mock.running){const id=mock.ids[mock.i];mock.ans[id]=toggleSel(QBY[id],mock.ans[id]||[],d.opt);saveMock();render();return;}
  if(b.id==="mkprev"){mock.i--;saveMock();render();return;}
  if(b.id==="mknext"){mock.i++;saveMock();render();return;}
  if(d.jump!==undefined){mock.i=+d.jump;saveMock();render();window.scrollTo({top:0});return;}
  if(b.id==="mkflag"){const id=mock.ids[mock.i];mock.flags[id]=!mock.flags[id];saveMock();render();return;}
  if(b.id==="mksubmit"){mock.confirm=true;render();return;}
  if(b.id==="mkcancel"){mock.confirm=false;render();return;}
  if(b.id==="mksubmit2"){finishMock();window.scrollTo({top:0});return;}
  if(d.rev){mock.review=d.rev;render();return;}
  // reset
  if(b.id==="rs"){resetConfirm=true;render();return;}
  if(b.id==="rsno"){resetConfirm=false;render();return;}
  if(b.id==="rsyes"){S={tasks:{},conf:{},q:{},cards:{},mocks:[]};save();resetConfirm=false;render();toast("Progress erased");return;}
});
function toggleSel(q,sel,L){
  if(!q.multi) return [L];
  return sel.includes(L)?sel.filter(x=>x!==L):sel.concat(L).sort();
}
document.addEventListener("keydown",e=>{
  if(e.target.matches("input,select,textarea,button")) return;
  if(view==="cards"&&fc.i<fc.order.length){
    if(e.key===" "||e.key==="Enter"){e.preventDefault();fc.back=!fc.back;render();}
    else if(fc.back&&(e.key==="1"||e.key==="2")){S.cards[fc.order[fc.i]]=e.key==="2"?"got":"again";save();fc.i++;fc.back=false;render();}
  }
});

const hv=(location.hash||"").slice(1); if(VIEWS.some(v=>v[0]===hv)) view=hv;
if(mock.running) view=hv||"mock";
renderTabs();render();
})();
</script>
