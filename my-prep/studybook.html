thy\n• Prevents temporary issues from removing instances\n• Balance between responsiveness and stability\nHealth Check Parameters:\n• HealthCheckIntervalSeconds: Time between checks (5-300s)\n• HealthyThresholdCount: Consecutive successes to mark healthy\n• UnhealthyThresholdCount: Consecutive failures to mark unhealthy\n• HealthCheckTimeoutSeconds: Time to wait for response\nBest Practices:\n• Set appropriate thresholds for application\n• Monitor health check metrics\n• Use ALB health checks for HTTP endpoints\n• Consider application startup time","module":"Networking","multi":false,"src":"repo"},{"id":"06-10","q":"A company wants to route traffic based on the geographic location of users. Which Route 53 routing policy should be used?","options":{"A":"Simple Routing","B":"Weighted Routing","C":"Geolocation Routing","D":"Latency-based Routing"},"answer":["C"],"explanation":"• Geolocation Routing routes based on user's geographic location\n• Routes by continent, country, or state\n• Use cases: Content localization, compliance, load distribution\nRoute 53 Routing Policies:\n| Policy | Use Case |\n|--------|----------|\n| Simple | Single resource |\n| Weighted | A/B testing, gradual rollout |\n| Latency | Best performance for users |\n| Failover | Active-passive DR |\n| Geolocation | Route by user location |\n| Geoproximity | Route by resource location + bias |\n| Multivalue | Multiple IPs, health checks |\nGeolocation vs Latency:\n• Geolocation: Based on WHERE user is\n• Latency: Based on WHICH region has lowest latency","module":"Networking","multi":false,"src":"repo"},{"id":"06-11","q":"A Security Group allows inbound traffic on port 443 from 0.0.0.0/0. What outbound rule is needed for responses?","options":{"A":"Allow port 443 outbound to 0.0.0.0/0","B":"Allow ephemeral ports outbound","C":"No outbound rule needed","D":"Allow all traffic outbound"},"answer":["C"],"explanation":"• Security Groups are stateful\n• If inbound is allowed, return traffic automatically allowed\n• No need to configure outbound rule for responses\n• Only need outbound rules for instance-initiated traffic\nSecurity Groups vs NACLs:\n| Feature | Security Groups | NACLs |\n|---------|----------------|-------|\n| State | Stateful | Stateless |\n| Level | Instance | Subnet |\n| Rules | Allow only | Allow and Deny |\n| Return Traffic | Automatic | Must configure |\n| Evaluation | All rules | Ordered rules |","module":"Networking","multi":false,"src":"repo"},{"id":"06-12","q":"A company needs to block specific IP addresses from accessing their application. Which is the MOST appropriate solution?","options":{"A":"Security Group Deny rules","B":"Network ACL Deny rules","C":"AWS WAF IP set rules","D":"Route 53 DNS filtering"},"answer":["B"],"explanation":"For network-level blocking:\n• Network ACLs support Deny rules\n• Evaluated before traffic reaches instances\n• Can block IP ranges at subnet level\nFor application-level blocking:\n• AWS WAF with IP set match conditions\n• More flexible filtering\n• Works with CloudFront, ALB, API Gateway\nSecurity Groups limitations:\n• Cannot create Deny rules (only Allow)\n• Cannot block specific IPs\nBest Practice:\n• NACL: Network-level IP blocking\n• WAF: Application-level, geographic blocking, rate limiting","module":"Networking","multi":false,"src":"repo"},{"id":"06-13","q":"A company has resources in two VPCs in the same region and wants them to communicate privately. What should be configured?","options":{"A":"Internet Gateway","B":"VPC Peering","C":"AWS Transit Gateway","D":"VPN Connection"},"answer":["B"],"explanation":"• VPC Peering connects two VPCs privately\n• Same or different regions\n• Same or different accounts\n• Uses AWS network (no internet)\nVPC Peering Requirements:\n• Non-overlapping CIDR blocks\n• Accept peering request\n• Update route tables in both VPCs\n• Update security groups if needed\nVPC Peering Characteristics:\n• Not transitive (VPC A ↔ VPC B, VPC B ↔ VPC C, but NOT A ↔ C)\n• 1-to-1 connection\n• No single point of failure\n• No bandwidth bottleneck\nWhen to use Transit Gateway instead:\n• Many VPCs (>3-4)\n• Complex routing\n• Need transitive routing","module":"Networking","multi":false,"src":"repo"},{"id":"06-14","q":"An application running on EC2 instances needs to maintain client connections to the same instance for session persistence. Which load balancer feature should be enabled?","options":{"A":"Cross-Zone Load Balancing","B":"Connection Draining","C":"Sticky Sessions","D":"Health Checks"},"answer":["C"],"explanation":"• Sticky Sessions (Session Affinity) routes requests from same client to same instance\n• Uses cookies to track sessions\n• Duration-based or application-based cookies\nALB Sticky Session Types:\n• Duration-based: LB-generated cookie (AWSALB)\n• Application-based: Application-generated cookie\nSticky Sessions Limitations:\n• Can cause uneven load distribution\n• Instance failure = lost sessions\nBetter Alternative: \n• Store sessions in ElastiCache or DynamoDB\n• True stateless architecture","module":"Networking","multi":false,"src":"repo"},{"id":"06-15","q":"A company wants to use custom domain name with CloudFront distribution. What must be configured?","options":{"A":"Route 53 CNAME record only","B":"SSL/TLS certificate in ACM and Route 53 alias","C":"CloudFront custom origin","D":"S3 bucket name matching domain"},"answer":["B"],"explanation":"Requirements for custom domain:\n1. SSL/TLS Certificate in ACM (us-east-1 region)\n2. Alternate Domain Names (CNAMEs) in CloudFront\n3. Route 53 Alias Record pointing to CloudFront distribution\nConfiguration Steps:\n1. Request/import certificate in ACM (us-east-1)\n2. Add alternate domain names to CloudFront\n3. Associate ACM certificate with distribution\n4. Create Route 53 alias record\nCertificate Requirements:\n• Must be in us-east-1 for CloudFront\n• Domain name must match\n• Can use wildcard (*.example.com)","module":"Networking","multi":false,"src":"repo"},{"id":"06-16","q":"A company needs a highly available solution for connecting on-premises data center to AWS. What should be implemented?","options":{"A":"Single Direct Connect connection","B":"Redundant Direct Connect connections to different locations","C":"Site-to-Site VPN as backup to Direct Connect","D":"Both B and C (Maximum redundancy)"},"answer":["D"],"explanation":"Maximum High Availability:\n• Multiple Direct Connect connections in different locations\n• Site-to-Site VPN as backup\n• Redundant customer routers\n• Multiple VPN tunnels\nHA Architecture Layers:\n1. Redundant DX connections: Different locations\n2. Redundant customer routers: No single point failure\n3. VPN backup: Failover if DX fails\n4. Multiple VPN tunnels: AWS provides 2 tunnels per connection\nBenefits:\n• 99.99% availability possible\n• Automatic failover\n• Protection against location/connection failures","module":"Networking","multi":false,"src":"repo"},{"id":"06-17","q":"An application needs to resolve private DNS names between on-premises network and AWS VPC. What should be configured?","options":{"A":"VPC Peering","B":"Route 53 Private Hosted Zone","C":"Route 53 Resolver Endpoints","D":"AWS PrivateLink"},"answer":["C"],"explanation":"• Route 53 Resolver Endpoints enable DNS resolution between on-premises and AWS\n• Inbound Endpoints: On-premises queries AWS resources\n• Outbound Endpoints: AWS queries on-premises resources\nEndpoint Types:\n• Inbound: On-premises → AWS VPC\n• Outbound: AWS VPC → On-premises (with forwarding rules)\nConfiguration:\n1. Create inbound/outbound endpoints in VPC\n2. Configure forwarding rules\n3. Update on-premises DNS to forward to inbound endpoint\n4. Create rules to forward to on-premises DNS\nUse Cases:\n• Hybrid cloud DNS resolution\n• Migrate workloads with DNS dependencies\n• Unified naming across environments","module":"Networking","multi":false,"src":"repo"},{"id":"06-18","q":"A company wants to share services (like NLB) from one VPC with other VPCs/accounts without VPC peering. Which service enables this?","options":{"A":"VPC Peering","B":"AWS PrivateLink","C":"Transit Gateway","D":"VPN Connection"},"answer":["B"],"explanation":"• AWS PrivateLink provides private connectivity to services\n• Expose services via VPC Endpoint Services\n• Consumers access via Interface VPC Endpoints\n• No VPC peering, Internet Gateway, NAT required\nPrivateLink Architecture:\n• Provider: Creates Endpoint Service (backed by NLB)\n• Consumer: Creates Interface VPC Endpoint\n• Connection: Private, within AWS network\nBenefits:\n• Simplified network management\n• No CIDR overlap issues\n• Enhanced security (private connectivity)\n• Scalable (thousands of consumers)\nUse Cases:\n• SaaS applications\n• Shared services\n• Third-party services\n• Marketplace applications","module":"Networking","multi":false,"src":"repo"},{"id":"06-19","q":"A company wants to implement a global accelerator for their application with static IP addresses and deterministic routing. Which service should be used?","options":{"A":"Amazon CloudFront","B":"AWS Global Accelerator","C":"Route 53 with Latency Routing","D":"Elastic Load Balancing"},"answer":["B"],"explanation":"• AWS Global Accelerator provides static anycast IPs\n• Routes traffic over AWS global network\n• Deterministic, fast failover\n• Health checks and instant failover\nGlobal Accelerator vs CloudFront:\n| Feature | Global Accelerator | CloudFront |\n|---------|-------------------|------------|\n| Use Case | TCP/UDP apps | HTTP/HTTPS content |\n| Caching | No | Yes |\n| Static IP | Yes (2 anycast) | No |\n| Failover | Instant (< 30s) | DNS-based |\n| Protocol | TCP, UDP | HTTP, HTTPS, WebSocket |\nGlobal Accelerator Benefits:\n• Static IPs (no DNS changes)\n• AWS network routing (better performance)\n• Health-based routing\n• Traffic dials for blue/green deployments\nUse Cases:\n• Gaming (UDP)\n• IoT\n• VoIP\n• Non-HTTP applications","module":"Networking","multi":false,"src":"repo"},{"id":"06-20","q":"A web application receives sudden traffic spikes. The company wants to protect backend servers from being overwhelmed. What should be implemented at the Network ACL level?","options":{"A":"Allow all traffic","B":"Rate limiting","C":"Connection draining","D":"NACLs don't support rate limiting, use WAF"},"answer":["D"],"explanation":"• NACLs provide basic allow/deny rules\n• No rate limiting capabilities\n• AWS WAF provides rate limiting\nRate Limiting Solutions:\n| Service | Level | Capability |\n|---------|-------|------------|\n| AWS WAF | Application (L7) | Rate-based rules |\n| API Gateway | API | Throttling |\n| Shield Advanced | Network | DDoS mitigation |\n| NACL | Network (L4) | No rate limiting |\nWAF Rate-Based Rule:\n• Block IPs exceeding request threshold\n• 5-minute time window\n• Example: Block if > 2000 requests in 5 minutes\nBest Practice for Traffic Spikes:\n1. Auto Scaling for capacity\n2. WAF for rate limiting\n3. CloudFront for caching\n4. ElastiCache for session/data","module":"Networking","multi":false,"src":"repo"},{"id":"06-21","q":"A mobile gaming company needs to deliver ultra-low latency multiplayer experiences to users on 5G networks in major cities. The solution must run AWS compute and storage services at the edge of telecom networks. Which AWS service should they use?","options":{"A":"AWS Wavelength","B":"Amazon CloudFront","C":"AWS Outposts","D":"AWS Direct Connect"},"answer":["A"],"explanation":"• AWS Wavelength brings AWS compute and storage to the edge of 5G networks\n• Minimizes latency by running workloads at telecom provider locations\n• Ideal for mobile apps, gaming, AR/VR, IoT requiring <10ms latency\n• CloudFront is a CDN for static/dynamic content, not edge compute\n• Outposts is for on-premises data centers, not telecom edge\n• Direct Connect is for dedicated network connectivity","module":"Networking","multi":false,"src":"repo"},{"id":"07-1","q":"A company wants to encrypt data at rest in S3 with full control over encryption keys including custom rotation policies and audit trails. Which encryption method should be used?","options":{"A":"SSE-S3 (Server-Side Encryption with S3-Managed Keys)","B":"SSE-KMS with AWS managed keys","C":"SSE-KMS with Customer Managed Keys (CMK)","D":"SSE-C (Customer-Provided Keys)"},"answer":["C"],"explanation":"• SSE-KMS with Customer Managed Keys (CMK) provides complete control\n• Create, manage, rotate encryption keys\n• CloudTrail audit trail for key usage\n• Fine-grained access control via key policies\n• Automatic or manual key rotation\nS3 Encryption Options Comparison:\n| Method | Key Management | Rotation | Audit Trail | Cost |\n|--------|----------------|----------|-------------|------|\n| SSE-S3 | AWS | AWS handles | No | Free |\n| SSE-KMS (AWS managed) | AWS | Annual (automatic) | Yes (CloudTrail) | KMS API charges |\n| SSE-KMS (CMK) | Customer | On-demand/annual | Yes (CloudTrail) | KMS API charges |\n| SSE-C | Customer provides | Customer manages | No | Free |\nCMK Benefits:\n• Custom rotation schedule (enable automatic yearly rotation)\n• Disable/enable keys\n• Define key policies and grants\n• Cross-account access\n• Complete audit trail","module":"Security","multi":false,"src":"repo"},{"id":"07-2","q":"An application needs to securely store database credentials that should be automatically rotated every 30 days. Which AWS service is MOST appropriate?","options":{"A":"AWS Systems Manager Parameter Store","B":"AWS Secrets Manager","C":"AWS KMS","D":"Amazon S3 with encryption"},"answer":["B"],"explanation":"• AWS Secrets Manager designed specifically for secrets with built-in rotation\n• Automatic rotation for RDS, DocumentDB, Redshift, Amazon Redshift\n• Lambda-based custom rotation for other services\n• Versioning and immediate rotation\nSecrets Manager Features:\n• Automatic rotation (configurable schedule)\n• Built-in integration with AWS databases\n• Encryption at rest (KMS)\n• Fine-grained access control (IAM)\n• Audit capability (CloudTrail)\n• Cross-region replication\n• Version management\nSecrets Manager vs Parameter Store:\n| Feature | Secrets Manager | Parameter Store (Standard) | Parameter Store (Advanced) |\n|---------|----------------|----------------------------|----------------------------|\n| Automatic Rotation | Yes | No | No |\n| Built-in RDS Integration | Yes | No | No |\n| Cost | $0.40/secret/month + API calls | Free | $0.05/parameter/month |\n| Secret Size | 64 KB | 4 KB | 8 KB |\n| Encryption | Always (KMS) | Optional (KMS) | Optional (KMS) |\n| Use Case | DB credentials, API keys | Configuration, non-rotating secrets | Configuration, larger values |\nRotation Configuration:","module":"Security","multi":false,"src":"repo"},{"id":"07-3","q":"A company must ensure that all API calls across their AWS organization are logged and stored for 7 years for compliance. Which services should be configured?","options":{"A":"CloudWatch Logs with 7-year retention","B":"CloudTrail with S3 storage and Glacier lifecycle","C":"AWS Config with long-term storage","D":"VPC Flow Logs"},"answer":["B"],"explanation":"• AWS CloudTrail records all API calls (management and data events)\n• Store logs in S3 for long-term retention\n• Use S3 Lifecycle policies to transition to Glacier for cost optimization\nCloudTrail Configuration:\n1. Enable CloudTrail in all regions\n2. Store logs in S3 bucket\n3. Enable log file validation (integrity checking)\n4. Configure S3 Lifecycle policy:\n• Transition to Glacier after 90 days\n• Retain for 7 years\nCloudTrail Features:\n• Management Events: Control plane operations (CreateInstance, DeleteBucket)\n• Data Events: Data plane operations (S3 GetObject, Lambda invocations)\n• Insights Events: Detect unusual activity\n• Multi-region: Capture events from all regions\n• Multi-account: Organization trail\n• Log file integrity: Detect tampering\nBest Practice Configuration:\nS3 Lifecycle for Cost Optimization:","module":"Security","multi":false,"src":"repo"},{"id":"07-4","q":"A company wants to detect and respond to security threats in their AWS environment automatically. Which service provides intelligent threat detection?","options":{"A":"AWS CloudTrail","B":"Amazon GuardDuty","C":"AWS Config","D":"AWS Security Hub"},"answer":["B"],"explanation":"• Amazon GuardDuty provides intelligent, continuous threat detection\n• Uses machine learning and threat intelligence\n• Analyzes multiple data sources automatically\n• No infrastructure to manage\nGuardDuty Data Sources:\n1. AWS CloudTrail Events: Unusual API calls, unauthorized deployments\n2. VPC Flow Logs: Malicious IP addresses, unusual traffic patterns\n3. DNS Logs: Domain generation algorithms, C&C communication\n4. EKS Audit Logs: Kubernetes security events\n5. S3 Data Events: Suspicious access patterns\n6. Lambda Network Activity: Suspicious connections\nGuardDuty Finding Types:\n• Reconnaissance: Port scanning, unusual API activity\n• Instance Compromise: Malware, cryptocurrency mining, backdoor\n• Account Compromise: Credential misuse, unusual behavior\n• Bucket Compromise: Suspicious S3 access\n• Persistence: IAM changes, unauthorized access\nGuardDuty vs Other Security Services:\n| Service | Purpose | Detection Type | Response |\n|---------|---------|----------------|----------|\n| GuardDuty | Threat detection | Automated ML-based | EventBridge rules |\n| Security Hub | Centralized findings | Aggregation | Manual/automated |\n| Inspector | Vulnerability scanning | Agent/agentless scans | Manual remediation |\n| Macie | Data protection | PII/sensitive data | Manual/automated |\n| Config | Compliance | Rule-based | Remediation actions |\nAutomated Response Pattern:\nGuardDuty Finding → EventBridge → Lambda → Isolate Instance/Block IP","module":"Security","multi":false,"src":"repo"},{"id":"07-5","q":"A company needs to ensure all S3 buckets are encrypted and not publicly accessible. Which service can continuously monitor and evaluate compliance?","options":{"A":"AWS CloudTrail","B":"AWS Config","C":"Amazon GuardDuty","D":"AWS Trusted Advisor"},"answer":["B"],"explanation":"• AWS Config continuously monitors and records resource configurations\n• Evaluates compliance against desired configurations\n• Provides configuration history and change tracking\n• Automated or manual remediation\nAWS Config Key Features:\nConfig Rules (Managed and Custom):\n• `s3-bucket-public-read-prohibited`\n• `s3-bucket-public-write-prohibited`\n• `s3-bucket-server-side-encryption-enabled`\n• `encrypted-volumes`\n• `required-tags`\n• `approved-amis-by-id`\nConfig Components:\n1. Configuration Recorder: Captures resource configurations\n2. Config Rules: Define desired configurations\n3. Remediation Actions: Automatic fixes via SSM Automation\n4. Conformance Packs: Packaged compliance rules\n5. Aggregators: Multi-account/region view","module":"Security","multi":false,"src":"repo"},{"id":"07-6","q":"An organization wants to centrally manage security findings from multiple AWS accounts and security services. Which service should be used?","options":{"A":"Amazon GuardDuty","B":"AWS Security Hub","C":"AWS Config","D":"Amazon Inspector"},"answer":["B"],"explanation":"• AWS Security Hub provides centralized security and compliance view\n• Aggregates findings from multiple AWS services and accounts\n• Security standards compliance (CIS, PCI-DSS, AWS Foundational Security Best Practices)\n• Automated compliance checks\nSecurity Hub Integrations:\nAWS Services:\n• Amazon GuardDuty (threat detection)\n• Amazon Inspector (vulnerability assessment)\n• Amazon Macie (data protection)\n• AWS IAM Access Analyzer (IAM policy analysis)\n• AWS Firewall Manager (firewall rule management)\n• AWS Config (compliance rules)\n• Amazon Detective (security investigation)\nThird-Party Integrations:\n• Splunk, Palo Alto Networks, Trend Micro, etc.\nSecurity Hub Features:\n1. Consolidated Dashboard: Single pane of glass\n2. Security Standards: CIS AWS Foundations, PCI-DSS, AWS Best Practices\n3. Automated Checks: Continuous compliance evaluation\n4. Finding Aggregation: From all integrated services\n5. Custom Insights: Create custom views\n6. Automated Remediation: EventBridge + Lambda/SSM\nSecurity Hub Workflow:\nUse Cases:\n• Multi-account security management\n• Compliance reporting\n• Security posture assessment\n• Automated remediation workflows","module":"Security","multi":false,"src":"repo"},{"id":"07-7","q":"A company wants to detect when S3 buckets contain sensitive personally identifiable information (PII). Which service should be used?","options":{"A":"Amazon GuardDuty","B":"Amazon Macie","C":"AWS Config","D":"Amazon Inspector"},"answer":["B"],"explanation":"• Amazon Macie is data security service that discovers and protects sensitive data\n• Uses machine learning to identify PII, financial data, credentials\n• Automated S3 bucket inventory and classification\n• Continuous monitoring and alerts\nMacie Capabilities:\nData Discovery:\n• Credit card numbers\n• Social security numbers\n• Passport numbers\n• Driver's license numbers\n• Bank account numbers\n• Personal health information\n• Authentication credentials\nMacie Features:\n1. Automated Discovery Jobs: Scan S3 buckets\n2. Sensitive Data Types: Pre-built and custom identifiers\n3. Bucket Inventory: Complete S3 bucket assessment\n4. Policy Findings: Public access, encryption, replication issues\n5. Sensitive Data Findings: Location and type of sensitive data\n6. Integration: Security Hub, EventBridge for automation\nMacie Finding Types:\n| Category | Examples |\n|----------|----------|\n| Policy Findings | Public bucket, unencrypted, no versioning |\n| Sensitive Data Findings | PII detected, credentials found |\nAutomated Response Pattern:\nMacie vs Other Services:\n• Macie: Data privacy, PII detection in S3\n• GuardDuty: Threat detection, malicious activity\n• Inspector: Vulnerability scanning (EC2, ECR, Lambda)\n• Config: Configuration compliance","module":"Security","multi":false,"src":"repo"},{"id":"07-8","q":"A company wants to analyze IAM policies to identify resources shared with external entities. Which service provides this capability?","options":{"A":"AWS IAM Policy Simulator","B":"IAM Access Analyzer","C":"AWS Trusted Advisor","D":"AWS Config"},"answer":["B"],"explanation":"• IAM Access Analyzer uses automated reasoning to analyze resource policies\n• Identifies resources shared with external principals\n• Validates IAM policies against best practices\n• Generates findings for review\nIAM Access Analyzer Features:\n1. External Access Analysis:\n• S3 buckets\n• IAM roles\n• KMS keys\n• Lambda functions\n• SQS queues\n• Secrets Manager secrets\n• SNS topics\n2. Policy Validation:\n• Check policy grammar\n• Security warnings\n• Errors and suggestions\n• Best practice recommendations\n3. Policy Generation:\n• Generate policies based on CloudTrail activity\n• Least privilege policies\n• Review and refine\nFinding Types:\nAccess Analyzer vs Other Tools:\n| Tool | Purpose |\n|------|---------|\n| Access Analyzer | External access, policy validation, policy generation |\n| Policy Simulator | Test policy effects |\n| Trusted Advisor | Best practices, cost optimization |\n| Config | Resource configuration compliance |\nUse Cases:\n• Identify unintended external access\n• Validate policies before deployment\n• Generate least-privilege policies\n• Continuous monitoring for access changes","module":"Security","multi":false,"src":"repo"},{"id":"07-9","q":"A web application needs protection against common web exploits like SQL injection and cross-site scripting (XSS). Which AWS service provides this protection?","options":{"A":"AWS Shield","B":"AWS WAF","C":"Security Groups","D":"Network ACLs"},"answer":["B"],"explanation":"• AWS WAF (Web Application Firewall) protects against common web exploits\n• Filters HTTP/HTTPS requests based on rules\n• Integrates with CloudFront, ALB, API Gateway, AppSync\n• Managed rules and custom rules\nAWS WAF Capabilities:\n1. Managed Rule Groups:\n• AWS Managed Rules (Core Rule Set, Known Bad Inputs, SQL Database, etc.)\n• AWS Marketplace Rules (third-party)\n• Rate-based rules (DDoS protection)\n2. Custom Rules:\n• IP address filtering\n• Geographic blocking\n• String/regex matching\n• Size constraints\n• SQL injection protection\n• XSS protection\n3. Request Filtering:\nWAF Components:\n| Component | Description |\n|-----------|-------------|\n| Web ACL | Container for rules |\n| Rules | Match conditions + action |\n| Rule Groups | Collection of reusable rules |\n| IP Sets | List of IP addresses |\n| Regex Pattern Sets | Regex patterns |\nRate-Based Rule (DDoS Protection):\nWAF vs Shield:\n• WAF: Application-level (Layer 7) filtering, custom rules\n• Shield Standard: Network/transport (Layer 3/4) DDoS protection, automatic, free\n• Shield Advanced: Enhanced DDoS protection, cost protection, 24/7 support\nCommon WAF Rules:\n1. Block SQL injection attempts\n2. Block XSS attacks\n3. Rate limiting (prevent abuse)\n4. Geographic restrictions\n5. IP blacklist/whitelist\n6. String/pattern matching","module":"Security","multi":false,"src":"repo"},{"id":"07-10","q":"A company wants to protect their application from DDoS attacks and ensure cost protection during large-scale attacks. Which service provides these features?","options":{"A":"AWS WAF","B":"AWS Shield Standard","C":"AWS Shield Advanced","D":"Security Groups"},"answer":["C"],"explanation":"• AWS Shield Advanced provides enhanced DDoS protection with cost protection\n• 24/7 access to DDoS Response Team (DRT)\n• Advanced attack detection and mitigation\n• Cost protection against scaling charges during attacks\nShield Comparison:\n| Feature | Shield Standard | Shield Advanced |\n|---------|----------------|-----------------|\n| Cost | Free | $3,000/month |\n| Protection Level | Network/Transport (L3/L4) | Network + Application (L3/L4/L7) |\n| DDoS Response Team | No | 24/7 access |\n| Cost Protection | No | Yes (scaling charges) |\n| Advanced Detection | Basic | Enhanced, real-time |\n| Health-based Detection | No | Yes |\n| Application Layer | Via WAF | Included + WAF |\nShield Advanced Features:\n1. Cost Protection:\n• Protects against scaling charges during DDoS attacks\n• Covers: EC2, ELB, CloudFront, Route 53, Global Accelerator\n2. DDoS Response Team (DRT):\n• 24/7 expert support\n• Attack analysis and mitigation\n• Custom mitigation rules\n3. Advanced Metrics:\n• Real-time attack visibility\n• Historical attack data\n• Integration with CloudWatch\n4. Protection Scope:\n• CloudFront distributions\n• Route 53 hosted zones\n• Global Accelerator accelerators\n• Elastic Load Balancers\n• EC2 Elastic IP addresses\n5. Health-Based Detection:\n• Monitors application health\n• Proactive mitigation\n• Route 53 health checks integration\nWhen to Use Shield Advanced:\n• Business-critical applications\n• High-profile websites\n• Cannot tolerate downtime\n• Need cost protection\n• Want expert DRT support\nBest Practice Architecture:","module":"Security","multi":false,"src":"repo"},{"id":"07-11","q":"A company needs to scan EC2 instances and container images for software vulnerabilities. Which service should be used?","options":{"A":"Amazon GuardDuty","B":"Amazon Inspector","C":"AWS Security Hub","D":"Amazon Macie"},"answer":["B"],"explanation":"• Amazon Inspector provides automated vulnerability assessment\n• Scans EC2 instances, container images (ECR), Lambda functions\n• Network reachability analysis\n• Package vulnerability detection (CVEs)\nAmazon Inspector v2 Features:\n1. Continuous Scanning:\n• Automated, continuous assessment\n• No agents needed for ECR\n• SSM agent for EC2 (automatic deployment)\n2. Vulnerability Detection:\n• CVE (Common Vulnerabilities and Exposures)\n• OS packages\n• Application dependencies\n• Network exposure\n3. Resource Types:\n• EC2 Instances: OS and application vulnerabilities\n• ECR Container Images: Image vulnerabilities\n• Lambda Functions: Code and package vulnerabilities\n4. Risk Scoring:\n• Inspector score (0-10)\n• Severity: Critical, High, Medium, Low, Informational\n• Prioritization based on exploitability and CVSS\n5. Integration:\n• Security Hub (centralized findings)\n• EventBridge (automated remediation)\n• AWS Organizations (multi-account)\nInspector Finding Example:\nInspector vs Other Services:\n• Inspector: Vulnerability scanning (EC2, ECR, Lambda)\n• GuardDuty: Threat detection (malicious activity)\n• Macie: Data protection (PII in S3)\n• Config: Configuration compliance\nAutomated Remediation:","module":"Security","multi":false,"src":"repo"},{"id":"07-12","q":"A company wants to enforce that all new EC2 instances must have encrypted EBS volumes. How can this be enforced across the organization?","options":{"A":"AWS Config rule with manual remediation","B":"Service Control Policy (SCP) in AWS Organizations","C":"IAM policy on each user","D":"AWS Lambda function to check instances"},"answer":["B"],"explanation":"• Service Control Policies (SCPs) provide centralized, preventive controls\n• Applied at organization, OU, or account level\n• Cannot be overridden by anyone in member accounts\n• Maximum permission boundaries\nSCP Example - Enforce Encrypted EBS:\nSCPs vs Other Controls:\n| Method | Prevention | Detection | Scope | Override |\n|--------|-----------|-----------|-------|----------|\n| SCP | Yes | No | Organization/OU/Account | Cannot override |\n| IAM Policy | Yes | No | User/Role/Group | Admin can change |\n| Config Rule | No | Yes | Account | Detection only |\n| Lambda | Possible | Yes | Custom | Complex |\nSCP Best Practices:\n1. Preventive Controls:\n• Deny unencrypted resources\n• Deny public S3 buckets\n• Restrict regions\n• Prevent root user actions\n2. Example - Region Restriction:\n3. Example - Deny Public S3:\nSCP Evaluation Logic:\n1. Explicit Deny in SCP → DENY\n2. SCP allows + IAM allows → ALLOW\n3. Default → DENY\nMulti-Layer Security:\n• SCP: Preventive (organization-wide)\n• Config: Detective (compliance monitoring)\n• Automated Remediation: Corrective (fix non-compliant)","module":"Security","multi":false,"src":"repo"},{"id":"07-13","q":"A company needs to ensure S3 objects cannot be deleted for 7 years and even the root account cannot override this. Which feature should be configured?","options":{"A":"S3 Versioning with Lifecycle policies","B":"S3 Object Lock in Compliance Mode","C":"S3 Object Lock in Governance Mode","D":"MFA Delete"},"answer":["B"],"explanation":"• S3 Object Lock in Compliance Mode enforces WORM (Write Once Read Many)\n• Cannot be overridden by anyone, including root account\n• Retention period cannot be shortened\n• Object versions cannot be deleted during retention period\nObject Lock Modes:\n| Feature | Governance Mode | Compliance Mode |\n|---------|----------------|-----------------|\n| Override | Yes (with special permission) | No (even root cannot) |\n| Delete | Can be deleted with permission | Cannot be deleted |\n| Retention Change | Can shorten with permission | Cannot shorten |\n| Use Case | Internal governance | Regulatory compliance |\nObject Lock Components:\n1. Retention Modes:\n• Compliance: Immutable, regulatory compliance\n• Governance: Flexible, internal policies\n2. Retention Period:\n• Fixed period (days/years)\n• Protect-until date\n3. Legal Hold:\n• Indefinite protection\n• On/off toggle\n• Independent of retention period\n• Requires `s3:PutObjectLegalHold` permission\nConfiguration Requirements:\n1. Versioning must be enabled (object lock requires versioning)\n2. Object Lock enabled at bucket creation (cannot enable later)\n3. Default retention settings (optional, can be per-object)\nCompliance Mode Example:\nLegal Hold Example:\nCompliance Use Cases:\n• SEC Rule 17a-4 (financial services)\n• HIPAA (healthcare)\n• FINRA (financial industry)\n• Legal documents\n• Regulatory archives\nObject Lock vs Other Protection:\n• Versioning: Can delete versions\n• MFA Delete: Adds MFA but can still delete\n• Object Lock Governance: Can override with permissions\n• Object Lock Compliance: True immutability","module":"Security","multi":false,"src":"repo"},{"id":"07-14","q":"A company wants to provide temporary, limited-privilege access to third-party vendors to perform specific tasks in their AWS account. What is the BEST approach?","options":{"A":"Create IAM users with passwords","B":"Share root account credentials temporarily","C":"Create cross-account IAM roles with external ID","D":"Create access keys and share them"},"answer":["C"],"explanation":"• Cross-account IAM roles with External ID provide secure temporary access\n• No long-term credentials needed\n• External ID prevents confused deputy problem\n• Fine-grained permissions with session duration limits\nCross-Account Access Architecture:\n1. Trust Policy (in your account):\n2. Permissions Policy:\nExternal ID - Confused Deputy Prevention:\nThe Problem:\n• Vendor uses same role name for all customers\n• Attacker could trick vendor into accessing your resources\nThe Solution:\n• Unique External ID per customer\n• Vendor must provide correct External ID to assume role\n• Prevents unauthorized access\nImplementation Steps:\nYour Account:\n1. Create IAM role for vendor\n2. Set trust policy with vendor's account ID\n3. Add External ID condition (vendor provides this)\n4. Attach permissions policy (least privilege)\n5. Configure session duration (1-12 hours)\nVendor Account:\n1. Configure to assume role\n2. Provide External ID when assuming\n3. Receive temporary credentials\n4. Credentials auto-expire after session duration\nAssumeRole Example (vendor side):\nBenefits:\n• ✅ No long-term credentials\n• ✅ Automatic credential rotation\n• ✅ Auditable (CloudTrail)\n• ✅ Time-limited access\n• ✅ Revocable (delete role)\n• ✅ Prevents confused deputy\nBest Practices:\n1. Always use External ID\n2. Principle of least privilege\n3. Short session durations (1-2 hours)\n4. Monitor with CloudTrail\n5. Review permissions regularly\n6. Use MFA for sensitive roles","module":"Security","multi":false,"src":"repo"},{"id":"07-15","q":"A company needs to rotate SSL/TLS certificates for their application load balancers automatically. Which service should they use?","options":{"A":"AWS Certificate Manager (ACM)","B":"AWS Secrets Manager","C":"AWS KMS","D":"IAM Server Certificates"},"answer":["A"],"explanation":"• AWS Certificate Manager (ACM) provides free SSL/TLS certificates\n• Automatic renewal (no manual intervention)\n• Automatic deployment to integrated services\n• Free for public certificates\nACM Features:\n1. Automatic Renewal:\n• ACM automatically renews certificates before expiration\n• No downtime during renewal\n• Deploys renewed certificate automatically\n2. Supported Services:\n• Elastic Load Balancing (ALB, NLB, CLB)\n• Amazon CloudFront\n• Amazon API Gateway\n• AWS App Runner\n• AWS Elastic Beanstalk\n3. Certificate Types:\n• Public Certificates: Free, validated via DNS or email\n• Private Certificates: Paid, via AWS Private CA\n4. Validation Methods:\n• DNS Validation: Add CNAME record (recommended)\n• Email Validation: Email to domain contacts\nACM Certificate Request:\nDNS Validation (Route 53):\nCloudFront Requirement:\n• Certificate must be in us-east-1 region\n• Must be public certificate\n• Can use wildcard (*.example.com)\nCertificate Monitoring:\n• CloudWatch metrics for expiration\n• EventBridge events for renewal status\n• AWS Health Dashboard notifications\nBest Practices:\n1. Use DNS validation (faster, automatic)\n2. Use ACM for all supported services\n3. Monitor certificate expiration (backup)\n4. Use wildcard for subdomains\n5. Enable automatic renewal","module":"Security","multi":false,"src":"repo"},{"id":"07-16","q":"A company wants to centrally manage firewall rules across multiple AWS accounts and VPCs. Which service should be used?","options":{"A":"Security Groups","B":"Network ACLs","C":"AWS Firewall Manager","D":"AWS WAF"},"answer":["C"],"explanation":"• AWS Firewall Manager centrally configures and manages firewall rules\n• Works across accounts and resources in AWS Organizations\n• Ensures consistent security policies\n• Automatic policy application to new resources\nFirewall Manager Capabilities:\n1. Supported Policies:\n• AWS WAF rules (ALB, CloudFront, API Gateway)\n• AWS Shield Advanced protections\n• VPC Security Groups\n• AWS Network Firewall rules\n• Route 53 Resolver DNS Firewall\n• Third-party firewall appliances\n2. Policy Types:\n| Policy Type | Scope | Use Case |\n|-------------|-------|----------|\n| WAF Policy | CloudFront, ALB, API Gateway | Web application protection |\n| Shield Advanced | CloudFront, ALB, EIP | DDoS protection |\n| Security Group | EC2, ENI | VPC-level firewall |\n| Network Firewall | VPC | Stateful firewall |\n| DNS Firewall | VPC | DNS query filtering |\n3. Policy Application:\n• Automatically applied to all accounts in organization\n• Applied to new resources automatically\n• Centralized compliance monitoring\nFirewall Manager Example Use Case:\nScenario: Enforce WAF rules across all ALBs in organization\nConfiguration:\nBenefits:\n1. Centralized Management: Single console for all accounts\n2. Automatic Compliance: Policies auto-applied\n3. Consistent Security: Same rules everywhere\n4. Reduced Overhead: No manual configuration per account\n5. Visibility: Compliance dashboard\nFirewall Manager vs Manual Management:\n| Aspect | Firewall Manager | Manual |\n|--------|-----------------|--------|\n| Setup | Once (centralized) | Per account/resource |\n| New Resources | Automatic | Manual |\n| Compliance | Monitored | Manual checks |\n| Updates | Centralized | Per account |\n| Accounts | Multi-account | Single account |\nCommon Policies:\n1. Common WAF Rules:\n• SQL injection protection\n• XSS protection\n• Rate limiting (prevent abuse)\n• Geographic restrictions\n• IP blacklist/whitelist\n• String/pattern matching\n2. Security Group Rules:\n• Restrict SSH (port 22) to corporate IPs\n• Deny all unauthorized outbound traffic\n3. DNS Firewall:\n• Block known malicious domains\n• Data exfiltration prevention\nPrerequisites:\n• AWS Organizations enabled\n• Firewall Manager administrator account\n• AWS Config enabled in all accounts\n• AWS Config Service-Linked Role","module":"Security","multi":false,"src":"repo"},{"id":"07-17","q":"A developer accidentally commits AWS credentials to a public GitHub repository. What immediate actions should be taken? (Choose THREE)","options":{"A":"Change the IAM user's password","B":"Deactivate and delete the exposed access keys immediately","C":"Review CloudTrail logs for unauthorized activity","D":"Enable MFA on the account","E":"Create new access keys before deleting old ones","F":"Check AWS Personal Health Dashboard"},"answer":["B","C","E"],"explanation":"Immediate Response Steps:\n1. Deactivate/Delete Exposed Credentials (B):\n• FIRST: Deactivate keys immediately\n• SECOND: Review activity\n• THIRD: Delete keys after creating new ones\n2. Review CloudTrail Logs (C):\n• Check for unauthorized API calls\n• Identify scope of compromise\n• Document affected resources\n3. Create New Credentials Before Deleting (E):\n• Ensure application continuity\n• Update applications with new keys\n• Then delete compromised keys\nComplete Incident Response Checklist:\nImmediate (Minutes):\n• [ ] Deactivate exposed credentials\n• [ ] Alert security team\n• [ ] Check GuardDuty for findings\nShort-term (Hours):\n• [ ] Review CloudTrail logs (7-90 days)\n• [ ] Identify unauthorized actions\n• [ ] Assess damage (new resources, data access)\n• [ ] Create new credentials\n• [ ] Update applications\n• [ ] Delete old credentials\n• [ ] Revoke temporary credentials (if role assumed)\nMedium-term (Days):\n• [ ] Review IAM policies (reduce permissions)\n• [ ] Enable MFA (not immediate priority but important)\n• [ ] Implement AWS Secrets Manager\n• [ ] Set up CloudWatch alarms for unusual activity\n• [ ] Review security groups, NACLs\n• [ ] Check for backdoors (IAM users, roles)\nLong-term (Weeks):\n• [ ] Implement AWS SSO\n• [ ] Enforce MFA organization-wide\n• [ ] Use IAM roles instead of access keys\n• [ ] Implement secrets rotation\n• [ ] Security training\n• [ ] Code repository scanning (git-secrets)\n• [ ] Implement preventive controls\nCloudTrail Investigation Queries:\nGuardDuty Findings to Check:\n• UnauthorizedAccess:IAMUser/InstanceCredentialExfiltration\n• Persistence:IAMUser/UserPermissions\n• PrivilegeEscalation:IAMUser/AdministrativePermissions\n• Impact:IAMUser/MaliciousIPCaller\nWhy Other Options are Wrong:\n• A (Password): Access keys and passwords are separate\n• D (MFA): Important but not immediate priority\n• F (PHD): Doesn't relate to credential exposure\nPrevention Strategies:\n1. Never commit credentials to version control\n2. Use IAM roles for applications\n3. Implement AWS Secrets Manager or Parameter Store\n4. Use git-secrets or git-hound to scan repositories\n5. Enable AWS GuardDuty for detection\n6. Rotate credentials regularly\n7. Use short-lived credentials (STS)\n8. Implement AWS SSO for users","module":"Security","multi":true,"src":"repo"},{"id":"07-18","q":"A company wants to ensure data encryption in transit between their on-premises data center and AWS. Which connectivity option provides encryption by default?","options":{"A":"AWS Direct Connect","B":"AWS Site-to-Site VPN","C":"Internet Gateway","D":"AWS PrivateLink"},"answer":["B"],"explanation":"• AWS Site-to-Site VPN uses IPsec to encrypt data in transit\n• Encryption is built-in and automatic\n• No additional configuration needed for encryption\nConnectivity Options Comparison:\n| Option | Encryption | Speed | Setup | Cost |\n|--------|-----------|-------|-------|------|\n| Site-to-Site VPN | Yes (IPsec) | Up to 1.25 Gbps | Minutes | Low |\n| Direct Connect | No (but can add) | 1-100 Gbps | Weeks | High |\n| DX + VPN | Yes | 1-100 Gbps | Weeks | High |\n| Internet | HTTPS only | Variable | Immediate | Very low |\nSite-to-Site VPN Features:\n1. Encryption:\n• IPsec tunnel\n• AES-256-GCM or AES-128-GCM encryption\n• SHA-2 hashing\n• DH (Diffie-Hellman) groups\n2. Redundancy:\n• AWS provides 2 VPN tunnels per connection\n• Active/passive or active/active\n• Multi-AZ availability\n3. Dynamic Routing:\n• BGP support\n• Automatic failover\n• Route propagation\nVPN Configuration:\nDirect Connect Encryption:\nOption 1: DX + Public VIF + VPN:\n• VPN over Direct Connect\n• Encrypted but complex\nOption 2: DX + VPN (Separate):\n• Direct Connect for primary (unencrypted)\n• VPN for backup (encrypted)\nOption 3: MACsec (Direct Connect):\n• Layer 2 encryption\n• 10 Gbps and 100 Gbps connections only\n• Not available for all locations\nWhen to Choose:\nSite-to-Site VPN:\n• Need immediate encryption\n• Budget-conscious\n• Bandwidth < 1 Gbps adequate\n• Quick setup required\nDirect Connect:\n• Large data transfers\n• Consistent performance needed\n• Can add VPN for encryption\n• Long-term investment\nBest Practice - Hybrid:\n• Primary: Direct Connect (performance)\n• Backup: VPN (encrypted, failover)\n• Provides both performance and encryption","module":"Security","multi":false,"src":"repo"},{"id":"07-19","q":"A company wants to ensure EC2 instances can only launch in approved VPCs and subnets. How can this be enforced at the organization level?","options":{"A":"IAM policy condition checking VPC ID","B":"Service Control Policy (SCP) in AWS Organizations","C":"AWS Config rule","D":"Security Group rules"},"answer":["B"],"explanation":"• Service Control Policy (SCP) provides organization-wide preventive control\n• Can restrict actions based on VPC/subnet\n• Cannot be bypassed by member accounts\n• Enforced before IAM policies\nSCP Example - Restrict to Approved VPCs:\nSCP Example - Restrict to Approved Subnets:\nUseful EC2 Condition Keys:\n| Condition Key | Use Case |\n|---------------|----------|\n| `ec2:Vpc` | Restrict to specific VPCs |\n| `ec2:Subnet` | Restrict to specific subnets |\n| `ec2:InstanceType` | Limit instance types |\n| `ec2:Region` | Region restrictions |\n| `ec2:Tenancy` | Dedicated vs default |\n| `ec2:RootDeviceType` | EBS vs instance store |\nMulti-Layer Enforcement:\nLayer 1 - SCP (Preventive):\nLayer 2 - IAM Policy (Preventive):\nLayer 3 - Config (Detective):\nWhy SCP is Best:\n1. Organization-wide: Applies to all accounts\n2. Preventive: Blocks before creation\n3. Cannot override: Even admins cannot bypass\n4. Centralized: Managed from master account\n5. Inherited: Applied to OUs and child accounts\nComparison:\n• SCP: Preventive, organization-wide, cannot override\n• IAM: Preventive, account-level, admins can change\n• Config: Detective, alerts after creation\n• Security Groups: Network-level, not launch control","module":"Security","multi":false,"src":"repo"},{"id":"07-20","q":"A company needs to monitor and respond to unusual API activity patterns that might indicate compromised credentials. Which service combination is MOST effective?","options":{"A":"CloudTrail + CloudWatch Logs","B":"GuardDuty + EventBridge + Lambda","C":"Config + SNS","D":"Inspector + Security Hub"},"answer":["B"],"explanation":"• GuardDuty uses ML to detect unusual API activity automatically\n• EventBridge routes findings to automated response\n• Lambda executes remediation actions\n• Fully automated threat detection and response\nAutomated Threat Response Architecture:\nGuardDuty Finding Example:\nEventBridge Rule (routes GuardDuty findings):\nLambda Response Function (Python example):\nCommon GuardDuty Finding Types:\n| Finding Type | Description | Response |\n|--------------|-------------|----------|\n| UnauthorizedAccess:IAMUser/MaliciousIPCaller | API calls from malicious IP | Disable credentials |\n| UnauthorizedAccess:IAMUser/InstanceCredentialExfiltration | Credentials used outside AWS | Rotate credentials |\n| PrivilegeEscalation:IAMUser/AdministrativePermissions | User gained admin permissions | Revoke permissions |\n| Persistence:IAMUser/UserPermissions | User created new access keys | Review and delete |\n| Impact:IAMUser/AnomalousBehavior | Unusual API activity | Investigate |\nComplete Response Playbook:\nDetection (GuardDuty):\n• Continuous monitoring\n• ML-based anomaly detection\n• Threat intelligence feeds\nRouting (EventBridge):\n• Filter by severity\n• Route to appropriate response\nResponse (Lambda):\n• Disable credentials\n• Isolate resources\n• Create forensic snapshots\n• Alert security team\n• Create incident ticket\nInvestigation (Manual):\n• Review CloudTrail logs\n• Analyze scope of compromise\n• Identify affected resources\n• Root cause analysis\nRemediation (Manual/Automated):\n• Rotate credentials\n• Update IAM policies\n• Remove backdoors\n• Apply security patches\n• Update security groups\nPrevention (Long-term):\n• Implement MFA\n• Use IAM roles\n• Enforce least privilege\n• Regular access reviews\n• Security training\nWhy This Combination is Best:\n1. GuardDuty: Intelligent detection (no manual rules)\n2. EventBridge: Flexible routing\n3. Lambda: Automated response (immediate action)\n4. Scalable: No infrastructure\n5. Comprehensive: Covers all AWS API activity\nAlternative (Manual):\n• CloudTrail → CloudWatch Logs → Metric Filters → Alarms → SNS\n• Requires manual pattern definition\n• Less intelligent\n• Manual response","module":"Security","multi":false,"src":"repo"},{"id":"07-21","q":"A company needs to provide auditors with access to compliance reports and agreements for various AWS services. Which AWS service should they use?","options":{"A":"AWS Artifact","B":"AWS Audit Manager","C":"AWS Config","D":"AWS Security Hub"},"answer":["A"],"explanation":"• AWS Artifact provides on-demand access to AWS compliance reports and agreements\n• Used for audit, compliance, and regulatory requirements\n• Audit Manager is for automating evidence collection, not report access\n• Config is for resource compliance, not reports\n• Security Hub is for security findings, not compliance documents","module":"Security","multi":false,"src":"repo"},{"id":"07-22","q":"A security team wants to automate evidence collection for compliance frameworks such as PCI DSS and HIPAA. Which AWS service should they use?","options":{"A":"AWS Audit Manager","B":"AWS Artifact","C":"AWS Config","D":"AWS Security Hub"},"answer":["A"],"explanation":"• AWS Audit Manager automates evidence collection for audits\n• Maps AWS resources to control requirements\n• Artifact is for downloading compliance reports\n• Config is for resource compliance, not evidence collection\n• Security Hub is for security findings","module":"Security","multi":false,"src":"repo"},{"id":"07-23","q":"A company needs to manage and use dedicated hardware security modules (HSMs) for cryptographic operations in the AWS Cloud. Which service should they use?","options":{"A":"AWS CloudHSM","B":"AWS KMS","C":"AWS Secrets Manager","D":"Amazon Macie"},"answer":["A"],"explanation":"• AWS CloudHSM provides dedicated HSM appliances in the AWS Cloud\n• Used for single-tenant key management with FIPS 140-3 Level 3 compliance\n• KMS is managed, shared HSMs\n• Secrets Manager is for secrets, not HSM\n• Macie is for PII detection","module":"Security","multi":false,"src":"repo"},{"id":"07-24","q":"A security analyst needs to investigate and visualize relationships between AWS resources and suspicious activity for a security incident. Which AWS service should they use?","options":{"A":"Amazon Detective","B":"AWS Security Hub","C":"Amazon GuardDuty","D":"AWS Config"},"answer":["A"],"explanation":"• Amazon Detective helps analyze, investigate, and visualize security incidents\n• Integrates with GuardDuty, Security Hub, CloudTrail\n• Security Hub aggregates findings, not investigation\n• GuardDuty detects threats, not investigation\n• Config tracks resource changes, not relationships","module":"Security","multi":false,"src":"repo"},{"id":"07-25","q":"A company needs to provide Microsoft Active Directory authentication for AWS applications and resources. Which AWS service should they use?","options":{"A":"AWS Directory Service","B":"AWS IAM","C":"AWS SSO","D":"Amazon Cognito"},"answer":["A"],"explanation":"• AWS Directory Service provides managed Microsoft AD in AWS\n• Supports AD authentication for EC2, RDS, WorkSpaces, and more\n• IAM is for AWS-native identities\n• SSO is for SAML/OIDC-based SSO\n• Cognito is for app user authentication, not AD","module":"Security","multi":false,"src":"repo"},{"id":"08-1","q":"A microservices architecture needs asynchronous communication where multiple services must process the same message independently. Which AWS service is MOST appropriate?","options":{"A":"Amazon SQS Standard Queue","B":"Amazon SNS","C":"Amazon Kinesis Data Streams","D":"AWS Step Functions"},"answer":["B"],"explanation":"• Amazon SNS (Simple Notification Service) provides pub/sub messaging pattern\n• One message published → Multiple subscribers receive copy\n• Push-based delivery (proactive)\n• Perfect for fan-out scenarios\nSNS Architecture:\nSNS Features:\n• Message Filtering: Subscribers receive only relevant messages\n• Multiple Protocols: SQS, Lambda, HTTP/HTTPS, Email, SMS, Mobile Push\n• Message Attributes: Metadata for filtering\n• Fan-out: 1-to-many delivery\n• FIFO Topics: Ordered, exactly-once delivery\nSNS vs SQS:\n| Feature | SNS | SQS |\n|---------|-----|-----|\n| Pattern | Pub/Sub (1-to-many) | Queue (1-to-1) |\n| Delivery | Push | Pull |\n| Subscribers | Multiple (fan-out) | Single consumer per message |\n| Retention | No retention | Up to 14 days |\n| Use Case | Notifications, fan-out | Decoupling, buffering |","module":"Application Integration","multi":false,"src":"repo"},{"id":"08-2","q":"An application needs to decouple components with message buffering. Messages must be processed exactly once in strict order. Which service should be used?","options":{"A":"Amazon SQS Standard Queue","B":"Amazon SQS FIFO Queue","C":"Amazon SNS","D":"Amazon Kinesis Data Streams"},"answer":["B"],"explanation":"• Amazon SQS FIFO Queue provides exactly-once processing with strict ordering\n• Messages processed in the order received\n• Content-based deduplication prevents duplicates\n• Message groups enable parallel processing\nSQS Standard vs FIFO:\n| Feature | Standard | FIFO |\n|---------|----------|------|\n| Ordering | Best-effort | Guaranteed (FIFO) |\n| Delivery | At-least-once | Exactly-once |\n| Throughput | Unlimited | 300 msg/s (3000 batched) |\n| Deduplication | No | Yes (5 min window) |\n| Use Case | High throughput | Order critical |\nFIFO Queue Features:\n1. Message Ordering:\n2. Message Groups:\n• Multiple groups for parallel processing\n• Order maintained within each group\n• Different groups can process simultaneously\n3. Content-Based Deduplication:\n• SHA-256 hash of message body\n• Automatic duplicate detection (5 minutes)\n• Or use MessageDeduplicationId\n4. High Throughput Mode:\n• 3,000 messages per second with batching\n• 9,000 TPS per group (with batching)\nFIFO Queue Naming:\n• Must end with `.fifo` suffix\n• Example: `OrderQueue.fifo`\nUse Cases:\n• Financial transactions: No duplicate charges\n• Order processing: Correct sequence\n• Command execution: Sequential operations\n• Event sourcing: Order matters\nMessage Groups Example:\nBest Practices:\n1. Use message groups for parallelism\n2. Enable content-based deduplication\n3. Set appropriate visibility timeout\n4. Use batch operations (10 messages per batch)\n5. Monitor `ApproximateAgeOfOldestMessage`","module":"Application Integration","multi":false,"src":"repo"},{"id":"08-3","q":"A serverless application needs to process real-time streaming data from thousands of IoT devices. Each device sends data every second. Which service is MOST appropriate?","options":{"A":"Amazon SQS","B":"Amazon SNS","C":"Amazon Kinesis Data Streams","D":"Amazon MQ"},"answer":["C"],"explanation":"• Amazon Kinesis Data Streams designed for real-time streaming data\n• Handles massive data ingestion from thousands of producers\n• Multiple consumers can read same data stream\n• Data retention (24 hours to 365 days)\n• Ordered records per shard\nKinesis Data Streams Architecture:\nKinesis Key Concepts:\n1. Shards:\n• Throughput unit\n• 1 MB/s write, 2 MB/s read per shard\n• 1,000 records/s write per shard\n• Ordered within shard\n2. Records:\n• Partition key (determines shard)\n• Sequence number (order within shard)\n• Data blob (up to 1 MB)\n3. Consumers:\n• Multiple consumers can read same stream\n• Enhanced fan-out (dedicated 2 MB/s per consumer)\n• Shared throughput mode (2 MB/s total)\nKinesis Features:\n| Feature | Description |\n|---------|-------------|\n| Retention | 24 hours default, up to 365 days |\n| Ordering | Per partition key/shard |\n| Replay | Can reprocess data |\n| Scaling | Add/remove shards |\n| Encryption | At rest (KMS), in transit (HTTPS) |\nCapacity Planning:\nKinesis Producer (Python):\nKinesis Consumer (Lambda):\nKinesis Family:\n| Service | Use Case |\n|---------|----------|\n| Data Streams | Custom real-time processing |\n| Data Firehose | Load to S3, Redshift, ES (easier) |\n| Data Analytics | SQL on streaming data |\n| Video Streams | Video ingestion and processing |\nKinesis vs SQS:\n| Feature | Kinesis | SQS |\n|---------|---------|-----|\n| Ordering | Per shard | FIFO queue only |\n| Multiple Consumers | Yes | No (fanout via SNS) |\n| Retention | Up to 365 days | Up to 14 days |\n| Replay | Yes | No |\n| Use Case | Streaming, analytics | Decoupling, buffering |\nWhen to Use Kinesis:\n• Real-time analytics\n• Log and event data collection\n• IoT data ingestion\n• Multiple consumers need same data\n• Need to replay data\n• Streaming ETL","module":"Application Integration","multi":false,"src":"repo"},{"id":"08-4","q":"A company wants to implement a fan-out pattern where an SNS message triggers multiple SQS queues for different services. What is this architecture called?","options":{"A":"SQS Message Chaining","B":"SNS to SQS Fan-out","C":"Kinesis Fan-out","D":"EventBridge Routing"},"answer":["B"],"explanation":"• SNS to SQS Fan-out is common pattern for parallel, asynchronous processing\n• Single message to SNS triggers multiple SQS queues\n• Each service consumes from its own queue\n• Decoupled, resilient architecture\nSNS-SQS Fan-out Architecture:\nBenefits:\n1. Parallel Processing:\n• Services process independently\n• No blocking between services\n2. Reliability:\n• SQS provides message persistence\n• Retries on failure\n• Dead Letter Queue for failed messages\n3. Scalability:\n• Each service scales independently\n• Add new subscribers without changes\n4. Decoupling:\n• Services don't know about each other\n• Add/remove services easily\nConfiguration:\nStep 1: Create SNS Topic:\nStep 2: Create SQS Queues:\nStep 3: Subscribe Queues to Topic:\nStep 4: Update SQS Policy (allow SNS to send):\nReal-World Example - E-commerce Order:\nMessage Filtering (each service gets relevant messages only):\nError Handling - Dead Letter Queue:\nBest Practices:\n1. Use message filtering to reduce unnecessary processing\n2. Configure Dead Letter Queues for failed messages\n3. Set appropriate visibility timeout\n4. Use batching for cost optimization\n5. Monitor queue depth (CloudWatch)\n6. Implement idempotency in consumers\nSNS-SQS vs Kinesis:\n• SNS-SQS: Different processing per service\n• Kinesis: Same data, different consumers","module":"Application Integration","multi":false,"src":"repo"},{"id":"08-5","q":"A serverless workflow needs to coordinate multiple Lambda functions with conditional logic, parallel execution, and error handling. Which service should be used?","options":{"A":"Amazon SQS with multiple queues","B":"Amazon SNS with message filtering","C":"AWS Step Functions","D":"Amazon EventBridge"},"answer":["C"],"explanation":"• AWS Step Functions orchestrates serverless workflows\n• Visual workflow designer\n• Built-in error handling and retries\n• Parallel execution, conditional logic, wait states\n• Integration with 200+ AWS services\nStep Functions State Machine Example:\nStep Functions State Types:\n| State Type | Purpose | Example |\n|------------|---------|---------|\n| Task | Execute work (Lambda, ECS, SNS, etc.) | Call API, process data |\n| Choice | Conditional logic (if/else) | Check inventory status |\n| Parallel | Execute branches simultaneously | Payment + Inventory + Email |\n| Wait | Delay (seconds, timestamp) | Wait for approval |\n| Pass | Pass input to output, transform | Data transformation |\n| Map | Iterate over array | Process batch items |\n| Succeed | Successful termination | Order complete |\n| Fail | Failed termination | Validation failed |\nError Handling:\n1. Retry:\n2. Catch:\nStep Functions Workflow Types:\n| Type | Duration | Execution Rate | Use Case |\n|------|----------|----------------|----------|\n| Standard | Up to 1 year | 2,000/s | Long-running, exactly-once |\n| Express | Up to 5 min | 100,000/s | High-volume, at-least-once |\nIntegration with AWS Services:\n• Lambda: Execute functions\n• ECS/Fargate: Run containers\n• DynamoDB: Read/write data\n• SNS/SQS: Send messages\n• Glue: Run ETL jobs\n• SageMaker: ML training/inference\n• Batch: Run batch jobs\nStep Functions vs Alternatives:\n| Tool | Best For |\n|------|----------|\n| Step Functions | Complex workflows, orchestration |\n| Lambda | Single tasks |\n| SQS | Queue-based processing |\n| EventBridge | Event routing |\nReal-World Use Cases:\n1. ETL Pipelines: Extract → Transform → Load\n2. Order Processing: Validate → Payment → Fulfillment\n3. Video Processing: Upload → Transcode → Thumbnail → Delivery\n4. Machine Learning: Data prep → Training → Deploy → Monitor\n5. Approval Workflows: Submit → Review → Approve/Reject → Execute\nVisual Workflow Benefits:\n• Easy to understand complex logic\n• Debug with execution history\n• See exactly where failures occur\n• Modify without code changes (drag-and-drop)\nBest Practices:\n1. Use Express Workflows for high-volume, short-duration\n2. Implement error handling at each step\n3. Use Parallel states for independent tasks\n4. Monitor with CloudWatch metrics\n5. Use input/output filtering to manage data size\n6. Implement idempotency in Lambda functions","module":"Application Integration","multi":false,"src":"repo"},{"id":"08-6","q":"An application needs to load streaming data into S3, Redshift, and Elasticsearch with minimal code. Which service is MOST appropriate?","options":{"A":"Amazon Kinesis Data Streams with custom consumers","B":"Amazon Kinesis Data Firehose","C":"AWS Lambda triggered by Kinesis","D":"Amazon SQS with Lambda consumers"},"answer":["B"],"explanation":"• Amazon Kinesis Data Firehose is fully managed service for loading streaming data\n• No code required (vs Data Streams which needs custom consumers)\n• Automatic scaling\n• Built-in data transformation (Lambda)\n• Direct delivery to S3, Redshift, Elasticsearch, HTTP endpoints\nKinesis Data Firehose Architecture:\nFirehose Features:\n1. Automatic Scaling:\n• No capacity planning\n• Scales to gigabytes per second\n• Pay for data volume\n2. Buffering:\n• Buffer by size (1-128 MB)\n• Buffer by time (60-900 seconds)\n• Delivers when either threshold met\n3. Data Transformation:\n• Lambda function processes each record\n• Format conversion (JSON to Parquet/ORC)\n• Compression (GZIP, ZIP, Snappy)\n4. Backup:\n• Backup source data to S3\n• Failed records to separate S3 prefix\nFirehose Delivery Configuration:\nData Transformation Example (Lambda):\nDelivery Destinations:\n1. Amazon S3:\n• Object storage\n• Data lake\n• Archive\n• Partitioning by time\n2. Amazon Redshift:\n• Data warehouse\n• Analytics\n• Data via S3 COPY command\n3. Amazon Elasticsearch:\n• Search and analytics\n• Log analysis\n• Real-time dashboards\n4. Splunk:\n• Security monitoring\n• Operational intelligence\n5. HTTP Endpoints:\n• Custom destinations\n• Third-party services\nFirehose vs Data Streams:\n| Feature | Data Firehose | Data Streams |\n|---------|---------------|--------------|\n| Management | Fully managed | Manage shards |\n| Destinations | Built-in (S3, Redshift, ES) | Custom code |\n| Scaling | Automatic | Manual shard management |\n| Retention | No retention | 24h to 365 days |\n| Consumers | One (delivery) | Multiple possible |\n| Use Case | Load to destinations | Custom processing |\nCost Comparison:\nWhen to Use Firehose:\n• Load data to S3, Redshift, ES, Splunk\n• Don't need multiple consumers\n• Want fully managed solution\n• Near real-time (60+ seconds latency)\n• Simple transformations\nWhen to Use Data Streams:\n• Need real-time processing (< 1 second)\n• Multiple consumers\n• Custom processing logic\n• Need to replay data\n• Order matters within shard\nReal-World Examples:\n1. Clickstream Analytics:\n2. Log Aggregation:\n3. Data Lake:\nBest Practices:\n1. Use buffering to optimize cost (batch writes)\n2. Enable S3 backup for source records\n3. Use compression (GZIP) to reduce storage costs\n4. Convert to columnar formats (Parquet/ORC) for analytics\n5. Partition S3 data by time for better query performance\n6. Monitor delivery to CloudWatch","module":"Application Integration","multi":false,"src":"repo"},{"id":"08-7","q":"A company wants to route events from multiple AWS services to different targets based on event content. Which service provides centralized event routing?","options":{"A":"Amazon SNS","B":"Amazon SQS","C":"Amazon EventBridge","D":"AWS Step Functions"},"answer":["C"],"explanation":"• Amazon EventBridge is serverless event bus for application and AWS service events\n• Content-based routing using event patterns\n• 100+ AWS service integrations as event sources\n• 20+ AWS services as targets\nEventBridge Architecture:\nEventBridge Components:\n1. Events:\n2. Event Rules (pattern matching):\n3. Event Buses:\n• Default: AWS service events\n• Custom: Application events\n• Partner: SaaS provider events\n4. Targets:\n• Multiple targets per rule (up to 5)\n• Input transformation\n• Retry policies\nReal-World Examples:","module":"Application Integration","multi":false,"src":"repo"},{"id":"08-8","q":"A legacy application uses Java Message Service (JMS) API. What is the BEST AWS migration path with minimal code changes?","options":{"A":"Migrate to Amazon SQS","B":"Migrate to Amazon SNS","C":"Migrate to Amazon MQ","D":"Rewrite using Kinesis"},"answer":["C"],"explanation":"• Amazon MQ is managed message broker for Apache ActiveMQ and RabbitMQ\n• JMS, AMQP, MQTT, OpenWire, STOMP protocols\n• Minimal code changes for lift-and-shift\n• Compatible with existing messaging APIs\nAmazon MQ vs SQS/SNS:\n| Feature | Amazon MQ | SQS/SNS |\n|---------|-----------|---------|\n| Protocols | JMS, AMQP, MQTT, STOMP | AWS API only |\n| Migration | Minimal code changes | Requires code changes |\n| Use Case | Legacy app migration | Cloud-native apps |\n| Scaling | Limited | Highly scalable |\n| Management | Managed broker | Fully serverless |\n| Cost | Instance-based | Pay per use |\nAmazon MQ Deployment:\nAmazon MQ Features:\n1. Broker Engines:\n• ActiveMQ: JMS, OpenWire, STOMP, MQTT, WSS\n• RabbitMQ: AMQP 0-9-1, MQTT, STOMP\n2. High Availability:\n• Active/Standby deployment (Multi-AZ)\n• Automatic failover\n• Durable message storage\n3. Network Connectivity:\n• VPC deployment\n• Private connectivity\n• Security groups\n4. Authentication:\n• Simple authentication\n• LDAP integration\nMigration Strategy:\nBefore (On-Premises):\nAfter (Amazon MQ) - Minimal changes:\nWhen to Use Amazon MQ:\n• Migrating from on-premises message brokers\n• Existing applications using JMS, AMQP\n• Need protocol compatibility\n• Complex message routing\n• Message selectors and filters\nWhen to Use SQS/SNS:\n• Cloud-native applications\n• Need massive scale\n• Serverless architecture\n• Cost optimization\n• Can rewrite code\nAmazon MQ Configuration:\nCost Comparison:\nAmazon MQ:\n• Instance costs (hourly)\n• Storage costs (EBS/EFS)\n• Data transfer\nSQS/SNS:\n• Per request\n• No instance costs\n• Generally cheaper at scale\nBest Practices:\n1. Use Multi-AZ for production\n2. Configure automatic minor version upgrades\n3. Enable CloudWatch logging\n4. Use VPC endpoints for secure access\n5. Implement message selectors for filtering\n6. Monitor broker metrics","module":"Application Integration","multi":false,"src":"repo"},{"id":"08-9","q":"An application publishes custom metrics to CloudWatch. These metrics should trigger automated responses. What is the BEST approach?","options":{"A":"Poll CloudWatch API periodically","B":"Use CloudWatch Alarms with SNS","C":"Use EventBridge rule for CloudWatch events","D":"Use Lambda to check metrics"},"answer":["B"],"explanation":"• CloudWatch Alarms monitor metrics and trigger actions automatically\n• SNS integration for notifications and automated responses\n• Can trigger Auto Scaling, EC2 actions, SNS, Systems Manager\nCloudWatch Alarms Architecture:\nCloudWatch Alarm States:\n• OK: Metric within threshold\n• ALARM: Metric breached threshold\n• INSUFFICIENT_DATA: Not enough data\nAlarm Configuration:\nCustom Metrics Example:\nAlarm Actions:\n1. SNS Notifications:\n2. Auto Scaling:\n3. EC2 Actions:\n4. Systems Manager Actions:\nAutomated Response Example (Lambda):\nComposite Alarms (multiple conditions):\nAlarm Statistics:\n• Average: Mean value\n• Sum: Total\n• Minimum: Lowest value\n• Maximum: Highest value\n• SampleCount: Number of data points\n• p99: 99th percentile\nBest Practices:\n1. Use meaningful alarm names\n2. Set appropriate evaluation periods (avoid flapping)\n3. Use composite alarms for complex conditions\n4. Test alarms with CloudWatch Alarm Testing\n5. Document alarm thresholds\n6. Review and adjust thresholds regularly\nCloudWatch Alarms vs EventBridge:\n• Alarms: Metric-based thresholds\n• EventBridge: Event-driven (state changes, API calls)","module":"Application Integration","multi":false,"src":"repo"},{"id":"08-10","q":"A company wants to implement API Gateway to trigger different Lambda functions based on the API path. What feature enables this?","options":{"A":"API Gateway Stages","B":"API Gateway Methods","C":"API Gateway Resources with Lambda Integration","D":"API Gateway Authorizers"},"answer":["C"],"explanation":"• API Gateway Resources define API paths\n• Each resource/method can integrate with different Lambda functions\n• Enables REST API routing to microservices\nAPI Gateway Lambda Integration:\nAPI Gateway Structure:\nAPI Gateway Integration Types:\n| Type | Use Case |\n|------|----------|\n| Lambda | Serverless backend |\n| HTTP | HTTP endpoints |\n| AWS Service | Direct AWS service integration |\n| Mock | Testing, return fixed response |\n| VPC Link | Private VPC resources |\nLambda Integration Configuration:\nLambda Proxy Integration (recommended):\nAPI Gateway Features:\n1. Request Validation:\n• Validate request parameters\n• Validate request body against JSON schema\n• Reject invalid requests before invoking Lambda\n2. Request/Response Transformation:\n• Transform request data\n• Map response from Lambda\n• Change content types\n3. Throttling:\n• Rate limiting (requests per second)\n• Burst capacity\n• Per-client throttling (API keys)\n4. Caching:\n• Cache responses at API Gateway\n• Reduce Lambda invocations\n• Configurable TTL\n5. CORS Support:\n• Enable cross-origin requests\n• Configure allowed origins, headers, methods\n6. Authentication/Authorization:\n• AWS IAM\n• Cognito User Pools\n• Lambda Authorizers\n• API Keys\nAPI Gateway Stages:\nStage Variables (environment-specific):\nAPI Gateway Deployment:\nBest Practices:\n1. Use Lambda proxy integration for simplicity\n2. Enable request validation\n3. Use stages for environments (dev/test/prod)\n4. Enable caching for read-heavy APIs\n5. Implement authentication/authorization\n6. Enable CloudWatch logging\n7. Use custom domain names\n8. Implement rate limiting\n9. Version your APIs\n10. Monitor with X-Ray\nAPI Gateway Pricing:\n• REST API: $3.50 per million requests\n• HTTP API: $1.00 per million requests (cheaper)\n• WebSocket API: $1.00 per million messages\n• Data transfer out\nHTTP API vs REST API:\n• HTTP API: Simpler, cheaper, faster\n• REST API: More features (request validation, caching, API keys)","module":"Application Integration","multi":false,"src":"repo"},{"id":"08-41","q":"A SaaS company needs to automate the transfer of customer data from Salesforce to Amazon S3 for analytics. The solution must be fully managed and require minimal code. Which AWS service should be used?","options":{"A":"Amazon AppFlow","B":"AWS Glue","C":"Amazon Kinesis Data Firehose","D":"AWS DataSync"},"answer":["A"],"explanation":"• Amazon AppFlow is a fully managed integration service\n• Automates data transfer between SaaS apps (e.g., Salesforce) and AWS\n• No code required, supports scheduling and transformation\n• Glue is for ETL, not direct SaaS integration\n• Firehose is for streaming, not SaaS connectors\n• DataSync is for file transfers, not SaaS data","module":"Application Integration","multi":false,"src":"repo"},{"id":"08-42","q":"A development team is building a GraphQL API for a mobile app and wants to minimize backend management. Which AWS service should they use?","options":{"A":"AWS AppSync","B":"Amazon API Gateway","C":"AWS Lambda","D":"Amazon Cognito"},"answer":["A"],"explanation":"• AWS AppSync is a managed GraphQL API service\n• Handles real-time data sync, subscriptions, and offline access\n• API Gateway is for REST/HTTP APIs\n• Lambda is compute, not API management\n• Cognito is for authentication, not APIs","module":"Application Integration","multi":false,"src":"repo"},{"id":"08-43","q":"A company needs to deploy containerized workloads to on-premises servers and manage them using AWS services. Which solution should they use?","options":{"A":"Amazon ECS Anywhere","B":"Amazon EKS Anywhere","C":"AWS Outposts","D":"AWS Fargate"},"answer":["A"],"explanation":"• ECS Anywhere extends ECS to on-premises servers\n• Centralized management from AWS Console\n• EKS Anywhere is for Kubernetes, not ECS\n• Outposts is for running AWS infrastructure on-premises\n• Fargate is serverless containers in AWS only","module":"Application Integration","multi":false,"src":"repo"},{"id":"08-44","q":"A mobile development team wants to test their app on a wide range of real devices in the cloud. Which AWS service should they use?","options":{"A":"AWS Device Farm","B":"AWS Amplify","C":"Amazon Pinpoint","D":"Amazon API Gateway"},"answer":["A"],"explanation":"• AWS Device Farm provides cloud-based testing on real mobile devices\n• Supports Android and iOS\n• Automates testing and provides detailed reports\n• Amplify is for app development and hosting\n• Pinpoint is for user engagement, not testing\n• API Gateway is for APIs, not device testing","module":"Application Integration","multi":false,"src":"repo"},{"id":"08-45","q":"A marketing team wants to send targeted push notifications, emails, and SMS messages to users based on their behavior in a mobile app. Which AWS service should be used?","options":{"A":"Amazon Pinpoint","B":"Amazon SNS","C":"AWS Amplify","D":"Amazon SQS"},"answer":["A"],"explanation":"• Amazon Pinpoint is a multi-channel marketing and analytics service\n• Supports push, email, SMS, and in-app messaging\n• Provides segmentation, analytics, and campaign management\n• SNS is for basic notifications, not targeted campaigns\n• Amplify is for app development, not marketing\n• SQS is for queuing, not messaging users","module":"Application Integration","multi":false,"src":"repo"},{"id":"08-46","q":"A company needs to integrate its on-premises Apache Kafka workloads with AWS analytics and storage services. Which AWS service provides a fully managed, highly available Kafka environment?","options":{"A":"Amazon MSK","B":"Amazon Kinesis Data Streams","C":"Amazon SQS","D":"AWS Glue Streaming"},"answer":["A"],"explanation":"• Amazon MSK (Managed Streaming for Apache Kafka) provides a fully managed Kafka service\n• Handles provisioning, patching, and scaling\n• Integrates with Kinesis, Lambda, S3, Redshift\n• Kinesis is a separate streaming service, not Kafka-compatible\n• SQS is for message queuing, not streaming\n• Glue Streaming is for ETL, not Kafka management","module":"Application Integration","multi":false,"src":"repo"},{"id":"09-1","q":"A company wants to monitor the memory utilization of its EC2 instances and trigger an alarm when memory usage exceeds 80%. Which combination of actions should the solutions architect take?","options":{"A":"Enable detailed monitoring on EC2 instances and create a CloudWatch alarm on the default memory metric","B":"Install the CloudWatch Agent on EC2 instances, configure it to send memory metrics, and create a CloudWatch alarm","C":"Use AWS Systems Manager Session Manager to view memory metrics and manually create alerts","D":"Enable CloudTrail logging and use CloudWatch Logs Insights to query memory usage"},"answer":["B"],"explanation":"• EC2 instances do NOT send memory metrics by default\n• The CloudWatch Agent must be installed to collect memory metrics\n• Once the agent sends metrics to CloudWatch, you can create alarms\n• Option A is incorrect because memory is not a default metric\n• Option C doesn't provide automated alerting\n• Option D is for auditing API calls, not performance metrics","module":"Monitoring","multi":false,"src":"repo"},{"id":"09-2","q":"A security team needs to identify which IAM user terminated a critical EC2 instance last week. Which AWS service should they use?","options":{"A":"Amazon CloudWatch Logs","B":"AWS Config","C":"AWS CloudTrail","D":"AWS Systems Manager"},"answer":["C"],"explanation":"• CloudTrail records API calls including WHO made them\n• It tracks management events like TerminateInstances\n• CloudTrail logs include user identity, timestamp, and action\n• Option A (CloudWatch Logs) monitors application logs, not API calls\n• Option B (Config) tracks resource configuration, not who made changes\n• Option D (Systems Manager) is for operational management","module":"Monitoring","multi":false,"src":"repo"},{"id":"09-3","q":"A company needs to ensure all S3 buckets have versioning enabled and receive automatic notifications when this requirement is violated. Which AWS service should be used?","options":{"A":"AWS CloudTrail with CloudWatch Logs","B":"Amazon CloudWatch with custom metrics","C":"AWS Config with AWS Managed Rules","D":"AWS Systems Manager State Manager"},"answer":["C"],"explanation":"• AWS Config evaluates resource configurations against rules\n• Managed rule `s3-bucket-versioning-enabled` checks versioning\n• Config can send SNS notifications when non-compliant\n• CloudTrail tracks who made changes but doesn't evaluate compliance\n• CloudWatch monitors performance metrics, not configuration compliance\n• Systems Manager State Manager is for EC2 instance configuration","module":"Monitoring","multi":false,"src":"repo"},{"id":"09-4","q":"A solutions architect needs to access EC2 instances for troubleshooting without opening port 22 or managing SSH keys. Which AWS service provides this capability?","options":{"A":"AWS CloudShell","B":"AWS Systems Manager Session Manager","C":"Amazon EC2 Instance Connect","D":"AWS Direct Connect"},"answer":["B"],"explanation":"• Session Manager provides secure shell access without SSH keys or open ports\n• Uses IAM permissions for access control\n• Session logs can be sent to S3 or CloudWatch Logs\n• EC2 Instance Connect still requires port 22 to be open\n• CloudShell is for running AWS CLI commands, not accessing instances\n• Direct Connect is for network connectivity","module":"Monitoring","multi":false,"src":"repo"},{"id":"09-5","q":"A company wants to automatically patch all EC2 instances in their fleet during a scheduled maintenance window. Which AWS service should they use?","options":{"A":"AWS CloudFormation with custom scripts","B":"AWS Systems Manager Patch Manager","C":"Amazon EventBridge with Lambda","D":"AWS Config with remediation actions"},"answer":["B"],"explanation":"• Patch Manager automates OS and application patching\n• Maintenance windows define when to patch\n• Patch baselines specify which patches to install\n• CloudFormation is for infrastructure as code, not patching\n• EventBridge could trigger patching but isn't purpose-built\n• Config evaluates compliance but doesn't patch","module":"Monitoring","multi":false,"src":"repo"},{"id":"09-6","q":"An application writes log data to CloudWatch Logs. The operations team needs to be alerted when the word \"ERROR\" appears more than 10 times in 5 minutes. How should this be configured?","options":{"A":"Use CloudWatch Logs Insights to query for errors and manually check","B":"Create a metric filter to count \"ERROR\" occurrences, then create an alarm on that metric","C":"Export logs to S3 and use Athena to query for errors","D":"Use CloudTrail to track error events and create SNS notifications"},"answer":["B"],"explanation":"• Metric filters extract metrics from log data\n• Filter pattern can count occurrences of \"ERROR\"\n• CloudWatch alarm can trigger on the custom metric\n• This provides automated, real-time alerting\n• Option A requires manual intervention\n• Option C adds unnecessary complexity and isn't real-time\n• CloudTrail is for API calls, not application logs","module":"Monitoring","multi":false,"src":"repo"},{"id":"09-7","q":"A company needs to track all configuration changes to security groups across multiple AWS accounts and regions. What is the MOST efficient solution?","options":{"A":"Enable CloudTrail in each account and region","B":"Create Lambda functions to monitor security group changes","C":"Use AWS Config with a Config Aggregator","D":"Use CloudWatch Events in each region"},"answer":["C"],"explanation":"• AWS Config records resource configuration changes\n• Config Aggregator provides centralized view across accounts and regions\n• Tracks configuration history and relationships\n• CloudTrail tracks who made changes but doesn't aggregate conf
