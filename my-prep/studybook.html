<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>SAA-C03 Studybook</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=IBM+Plex+Mono:wght@400;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
/* Layout: blueprint-grid paper, sticky tab rail, one centered 1080px work column; countdown is the single loud element. */
:root{
  --paper:#F3F5F8; --surface:#FFFFFF; --ink:#16202E; --muted:#5A6678; --line:#D8DEE7;
  --accent:#1F5FD1; --accent-ink:#FFFFFF; --accent-soft:#E3ECFB;
  --hi:#F2B33D; --hi-soft:#FDF1D6; --ok:#1C8A57; --ok-soft:#DDF2E7; --bad:#C3413A; --bad-soft:#F9E1DF;
  --grid:rgba(31,95,209,.055);
  --f-display:"Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  --f-body:"IBM Plex Sans", "Segoe UI", system-ui, sans-serif;
  --f-mono:"IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
  --r:10px;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --paper:#0C121B; --surface:#131B27; --ink:#E5EAF1; --muted:#95A2B4; --line:#253143;
  --accent:#7DA8FF; --accent-ink:#0C121B; --accent-soft:#1A2A47;
  --hi:#F2B33D; --hi-soft:#3A2E14; --ok:#4FC48C; --ok-soft:#163227; --bad:#F2766D; --bad-soft:#3B1D1B;
  --grid:rgba(125,168,255,.05); color-scheme:dark } }
:root[data-theme="dark"]{
  --paper:#0C121B; --surface:#131B27; --ink:#E5EAF1; --muted:#95A2B4; --line:#253143;
  --accent:#7DA8FF; --accent-ink:#0C121B; --accent-soft:#1A2A47;
  --hi:#F2B33D; --hi-soft:#3A2E14; --ok:#4FC48C; --ok-soft:#163227; --bad:#F2766D; --bad-soft:#3B1D1B;
  --grid:rgba(125,168,255,.05); color-scheme:dark }

*{box-sizing:border-box}
body{background:var(--paper);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.55;
  background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);
  background-size:24px 24px;}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
.wrap{max-width:1080px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
h1,h2,h3{font-family:var(--f-display);text-wrap:balance;margin:0;line-height:1.15}
h2{font-size:1.55rem;font-weight:800;letter-spacing:-.01em}
h3{font-size:1.08rem;font-weight:600}
code,.mono{font-family:var(--f-mono);font-size:.88em}
code{background:var(--accent-soft);padding:.05em .35em;border-radius:4px}
a{color:var(--accent)}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,select:focus-visible,summary:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.eyebrow{font-family:var(--f-mono);font-size:.72rem;letter-spacing:.09em;text-transform:uppercase;color:var(--muted)}

/* header */
header.top{background:var(--surface);border-bottom:1px solid var(--line)}
.hero{display:flex;gap:24px;align-items:flex-end;justify-content:space-between;flex-wrap:wrap;padding-block:22px 16px}
.hero h1{font-size:clamp(1.6rem,4vw,2.3rem);font-weight:800;letter-spacing:-.02em}
.hero p{margin:4px 0 0;color:var(--muted)}
.count{display:flex;align-items:baseline;gap:10px}
.count .n{font-family:var(--f-display);font-weight:800;font-size:clamp(3rem,9vw,4.6rem);line-height:.9;color:var(--accent);font-variant-numeric:tabular-nums}
.count .l{font-family:var(--f-mono);font-size:.78rem;line-height:1.35;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.domains{display:flex;height:8px;border-radius:4px;overflow:hidden;margin-bottom:14px;gap:2px}
.domains span{display:block;background:var(--accent);opacity:.9}
.domains span:nth-child(2){opacity:.7}.domains span:nth-child(3){opacity:.5}.domains span:nth-child(4){opacity:.32}
.dlegend{display:flex;flex-wrap:wrap;gap:4px 16px;font-size:.78rem;color:var(--muted);padding-bottom:12px}
nav.tabs{position:sticky;top:env(safe-area-inset-top,0px);z-index:9;background:var(--surface);border-bottom:1px solid var(--line)}
nav.tabs .wrap{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none}
nav.tabs button{background:none;border:0;padding:12px 14px;font-weight:500;color:var(--muted);border-bottom:2px solid transparent;white-space:nowrap}
nav.tabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent)}
main{padding-block:24px 64px}
.view{display:grid;gap:18px}

/* generic */
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.btn{border:1px solid var(--line);background:var(--surface);padding:8px 14px;border-radius:8px;font-weight:500}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.ghost{background:transparent}
.btn.small{padding:4px 10px;font-size:.85rem}
.btn:disabled{opacity:.45;cursor:not-allowed}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:4px 11px;font-size:.84rem}
.chip[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.muted{color:var(--muted)}
.tag{font-family:var(--f-mono);font-size:.72rem;padding:2px 7px;border-radius:5px;background:var(--accent-soft);color:var(--ink);white-space:nowrap}
.bar{height:8px;background:var(--line);border-radius:4px;overflow:hidden}
.bar > i{display:block;height:100%;background:var(--accent)}
.bar.ok > i{background:var(--ok)} .bar.bad > i{background:var(--bad)} .bar.warn > i{background:var(--hi)}

/* plan */
.days{display:grid;gap:14px}
.day{display:grid;grid-template-columns:110px 1fr;gap:18px;position:relative}
.day .date{font-family:var(--f-mono);font-size:.8rem;color:var(--muted);padding-top:4px}
.day .date b{display:block;font-family:var(--f-display);font-size:1.5rem;color:var(--ink);font-weight:800}
.day.today .panel{border-color:var(--hi);box-shadow:0 0 0 3px var(--hi-soft)}
.day.past .panel{opacity:.78}
.stamp{font-family:var(--f-mono);font-size:.7rem;font-weight:600;background:var(--hi);color:#2A1E00;padding:2px 8px;border-radius:4px;letter-spacing:.06em}
.dayhead{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;align-items:flex-start}
.meta{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0 12px}
.tasks{list-style:none;padding:0;margin:0 0 12px;display:grid;gap:6px}
.tasks label{display:flex;gap:10px;align-items:flex-start;cursor:pointer}
.tasks input{margin-top:4px;accent-color:var(--accent);width:16px;height:16px;flex:none}
.tasks label.done span{text-decoration:line-through;color:var(--muted)}
.sub{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px;font-size:.88rem}
.sub ul{margin:4px 0 0;padding-left:18px}
.examday{border:2px dashed var(--accent)}

/* notes */
.notes{display:grid;grid-template-columns:240px 1fr;gap:18px;align-items:start}
.toc{position:sticky;top:calc(env(safe-area-inset-top,0px) + 60px);display:grid;gap:2px}
.toc button{text-align:left;background:none;border:0;padding:7px 10px;border-radius:7px;display:flex;justify-content:space-between;gap:8px;font-size:.9rem}
.toc button[aria-current="true"]{background:var(--accent-soft);font-weight:600}
.dot{width:9px;height:9px;border-radius:50%;background:var(--line);flex:none;margin-top:6px}
.dot.c1{background:var(--bad)}.dot.c2{background:var(--hi)}.dot.c3{background:var(--ok)}
.tocsel{display:none}
.note{min-width:0}
.note h2{margin-bottom:6px}
.note section{margin-top:18px}
.note ul{margin:8px 0 0;padding-left:20px;display:grid;gap:6px}
.note li{max-width:75ch}
.tbl{overflow-x:auto;margin-top:18px;border:1px solid var(--line);border-radius:8px}
table{border-collapse:collapse;width:100%;font-size:.88rem}
caption{text-align:left;font-weight:600;padding:10px 12px;font-family:var(--f-display);border-bottom:1px solid var(--line)}
th,td{text-align:left;padding:8px 12px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-family:var(--f-mono);font-size:.74rem;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);font-weight:600;background:var(--paper)}
tr:last-child td{border-bottom:0}
.conf{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.conf button{border:1px solid var(--line);background:var(--surface);border-radius:7px;padding:4px 10px;font-size:.84rem}
.conf button[aria-pressed="true"].c1{background:var(--bad-soft);border-color:var(--bad)}
.conf button[aria-pressed="true"].c2{background:var(--hi-soft);border-color:var(--hi)}
.conf button[aria-pressed="true"].c3{background:var(--ok-soft);border-color:var(--ok)}

/* decoder */
.dec{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:8px}
.dec button{display:grid;gap:3px;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:10px 12px}
.dec .k{font-size:.9rem}
.dec .a{font-family:var(--f-mono);font-size:.84rem;color:var(--accent);font-weight:600}
.dec .a.hide{color:transparent;background:repeating-linear-gradient(-45deg,var(--line) 0 6px,transparent 6px 12px);border-radius:4px}
input[type=search],select{font:inherit;color:inherit;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:8px 12px}
input[type=search]{flex:1;min-width:180px}

/* flashcards */
.card{min-height:220px;display:grid;place-items:center;text-align:center;padding:28px;cursor:pointer;border-radius:14px;background:var(--surface);border:1px solid var(--line);position:relative}
.card .face{font-family:var(--f-display);font-size:clamp(1.15rem,3vw,1.5rem);font-weight:600;max-width:40ch}
.card.back{background:var(--accent-soft);border-color:var(--accent)}
.card .side{position:absolute;top:10px;left:14px}
.card .hint{position:absolute;bottom:10px;right:14px}

/* quiz */
.q{display:grid;gap:14px}
.qstem{font-size:1.02rem;max-width:80ch;white-space:pre-line}
.opts{display:grid;gap:8px}
.opt{display:flex;gap:12px;align-items:flex-start;text-align:left;width:100%;background:var(--surface);border:1px solid var(--line);border-radius:9px;padding:10px 12px}
.opt .L{font-family:var(--f-mono);font-weight:600;width:24px;height:24px;flex:none;display:grid;place-items:center;border-radius:6px;background:var(--paper);border:1px solid var(--line);font-size:.82rem}
.opt[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft)}
.opt[aria-pressed="true"] .L{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.opt.right{border-color:var(--ok);background:var(--ok-soft)}
.opt.wrong{border-color:var(--bad);background:var(--bad-soft)}
.expl{border-left:3px solid var(--accent);padding:4px 0 4px 14px}
.expl ul{margin:6px 0 0;padding-left:18px;display:grid;gap:4px}
.verdict{font-family:var(--f-display);font-weight:800;font-size:1.1rem}
.verdict.ok{color:var(--ok)} .verdict.bad{color:var(--bad)}
.notebox{background:var(--hi-soft);border:1px solid var(--hi);border-radius:8px;padding:8px 12px;font-size:.88rem}
.examtop{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.timer{font-family:var(--f-mono);font-size:1.3rem;font-weight:600;font-variant-numeric:tabular-nums}
.timer.low{color:var(--bad)}
.navgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(36px,1fr));gap:5px}
.navgrid button{height:34px;border:1px solid var(--line);background:var(--surface);border-radius:6px;font-family:var(--f-mono);font-size:.78rem}
.navgrid button.ans{background:var(--accent-soft);border-color:var(--accent)}
.navgrid button.flag{box-shadow:inset 0 -3px 0 var(--hi)}
.navgrid button.cur{outline:2px solid var(--ink)}
.navgrid button.right{background:var(--ok-soft);border-color:var(--ok)}
.navgrid button.wrong{background:var(--bad-soft);border-color:var(--bad)}
.big{font-family:var(--f-display);font-weight:800;font-size:3.2rem;line-height:1;font-variant-numeric:tabular-nums}
.statgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px}
.stat .v{font-family:var(--f-display);font-weight:800;font-size:1.8rem;font-variant-numeric:tabular-nums}
.modrow{display:grid;grid-template-columns:minmax(120px,190px) 1fr 92px;gap:12px;align-items:center;font-size:.88rem}
.modrow .num{font-family:var(--f-mono);text-align:right;font-variant-numeric:tabular-nums}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(16px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--paper);padding:8px 16px;border-radius:8px;font-size:.9rem;z-index:20}
details summary{cursor:pointer;font-weight:500}
.review{display:grid;gap:10px}
.review details{background:var(--surface);border:1px solid var(--line);border-radius:9px;padding:10px 14px}
.review details[open]{display:grid;gap:10px}

@media (max-width:760px){
  .day{grid-template-columns:1fr;gap:6px}
  .day .date b{display:inline;margin-right:8px;font-size:1.2rem}
  .notes{grid-template-columns:1fr}
  .toc{display:none}
  .tocsel{display:block;width:100%}
  .modrow{grid-template-columns:1fr 72px}
  .modrow .bar{grid-column:1 / -1;order:3}
}
@media (prefers-reduced-motion:no-preference){
  .card{transition:background .18s,border-color .18s}
  .opt,.btn,.chip{transition:border-color .12s,background .12s}
}
</style>

<script>// SAA-C03 Studybook content. Original notes; question bank comes from the MIT-licensed repo.
window.TOPICS = [
{ id: "exam", title: "Exam format & strategy", domain: "All", module: null, sections: [
  { h: "Format", b: [
    "65 questions: 50 scored + 15 unscored (you cannot tell which). 130 minutes, ~2 min per question.",
    "Scaled score 100–1000. Pass = **720**. Compensatory scoring: no per-domain minimum.",
    "Multiple choice (1 of 4) and multiple response (2+ of 5+). No penalty for guessing — never leave a blank.",
    "Domains: Secure 30% · Resilient 26% · High-performing 24% · Cost-optimized 20%." ] },
  { h: "How to read a question", b: [
    "Read the **last sentence first**: it holds the deciding constraint.",
    "Circle the qualifier: *least operational overhead* → managed / serverless. *Most cost-effective* → cheapest that still works. *Minimal changes* → don't re-architect. *Highest availability* → Multi-AZ / multi-Region.",
    "Eliminate two answers fast (they usually break a requirement), then compare the last two on the qualifier.",
    "Answers that require custom scripts, cron on EC2 or manual steps are usually wrong when a managed feature exists.",
    "Flag and move on after ~2.5 min. Do a second pass on flagged questions." ] },
  { h: "Target on practice", b: [
    "Aim for **≥ 75–80%** on the mock exams here before the real exam.",
    "Every wrong answer: write one line explaining *why the right answer beats the one you chose*." ] }
] },
{ id: "iam", title: "IAM & Organizations", domain: "Secure", module: "IAM", sections: [
  { h: "Policy evaluation", b: [
    "Order: **explicit Deny > explicit Allow > implicit Deny**.",
    "Same account: identity policy OR resource policy allowing is enough.",
    "Cross-account: **both sides** must allow (identity policy in the caller account + resource policy or role trust in the target).",
    "Effective permissions = intersection of SCPs, permission boundary, session policy, and identity/resource policies." ] },
  { h: "Organizations & guardrails", b: [
    "**SCPs** set the *maximum* permissions for member accounts, including their root user. They never grant anything.",
    "SCPs do **not** apply to the management account or to service-linked roles.",
    "Use condition `aws:PrincipalOrgID` in resource policies to allow only your organization.",
    "**Control Tower**: landing zone for multi-account setup; preventive guardrails (SCPs) + detective guardrails (Config rules).",
    "Consolidated billing → combined volume discounts and shared RI / Savings Plan benefits.",
    "**Permission boundaries**: cap what a user/role can ever do — used when delegating IAM admin to developers." ] },
  { h: "Roles & federation", b: [
    "Applications on EC2 use an **instance profile role** — never store access keys on an instance.",
    "Cross-account access: role in target account with a trust policy; caller uses `sts:AssumeRole`. Third parties: add an **External ID** (confused-deputy protection).",
    "**IAM Identity Center** (successor to AWS SSO): workforce single sign-on across many accounts, works with external IdPs/AD.",
    "SAML 2.0 federation for corporate IdPs; web identity / OIDC for apps.",
    "**Cognito User Pools** = sign-up/sign-in, returns JWTs (works with ALB and API Gateway). **Identity Pools** = exchange identity for temporary AWS credentials.",
    "Root user: MFA, no access keys, only for root-only tasks.",
    "**IAM Access Analyzer**: finds resources shared outside your account/org; validates policies.",
    "Groups can't be nested and can't be a principal in a resource policy." ] }
], tables: [
  { caption: "Which control?", head: ["Need", "Use"], rows: [
    ["Stop every account in an OU from using a Region", "SCP with `aws:RequestedRegion` deny"],
    ["Let devs create roles but never above X", "Permission boundary"],
    ["Mobile app users upload to their own S3 prefix", "Cognito Identity Pool + IAM policy variables"],
    ["Employees sign in once to 40 accounts", "IAM Identity Center"],
    ["Vendor account needs access to yours", "Cross-account role + External ID"]
  ] }
] },
{ id: "vpc", title: "VPC & hybrid networking", domain: "Secure / Resilient", module: "Networking", sections: [
  { h: "Basics", b: [
    "VPC CIDR /16 to /28. A subnet lives in **one AZ**. AWS reserves **5 IPs** per subnet (first 4 + last).",
    "Public subnet = route `0.0.0.0/0 → Internet Gateway` + instances with public IPs.",
    "**NAT Gateway**: outbound-only internet for private subnets. Lives in a public subnet, is AZ-scoped → one per AZ for HA. Managed, no security group.",
    "IPv6 outbound-only → **egress-only internet gateway**.",
    "Bastion host or, better, **SSM Session Manager** (no inbound port 22, logged).",
    "**VPC Flow Logs**: IP traffic metadata (not packet contents) → CloudWatch Logs, S3, Firehose. Packet contents → Traffic Mirroring." ] },
  { h: "Private access to AWS services", b: [
    "**Gateway endpoint**: S3 and DynamoDB only, route-table entry, **free**. The classic 'cut NAT Gateway cost for S3' answer.",
    "**Interface endpoint** (PrivateLink): ENI with a private IP, most services, hourly + per-GB cost, uses security groups, reachable from on-prem over VPN/DX.",
    "Lock a bucket to one endpoint with bucket policy condition `aws:SourceVpce`." ] },
  { h: "Connecting VPCs", b: [
    "**VPC Peering**: 1-to-1, **not transitive**, no overlapping CIDRs, works cross-account and cross-Region.",
    "**Transit Gateway**: hub-and-spoke, transitive, thousands of VPCs + VPN + Direct Connect; inter-Region peering; route tables for segmentation.",
    "**PrivateLink**: expose one service (behind an NLB) to many consumer VPCs; overlapping CIDRs are fine; no full network access.",
    "**AWS RAM**: share subnets / TGW across accounts." ] },
  { h: "Hybrid", b: [
    "**Site-to-Site VPN**: IPsec over the internet, set up in minutes, ~1.25 Gbps per tunnel, two tunnels. Ends on a VGW or TGW; customer gateway on-prem.",
    "**Direct Connect**: private dedicated link, consistent latency, takes **weeks** to provision, **not encrypted** by default (add MACsec or VPN over DX).",

    "DX resilience: two connections at two DX locations (max resiliency) or DX + VPN as cheaper backup.",
    "**Client VPN**: individual users. **VPN CloudHub**: branch offices talk to each other through a VGW.",
    "**Route 53 Resolver** inbound/outbound endpoints: hybrid DNS between VPC and on-prem." ] },
  { h: "Filtering", b: [
    "**AWS Network Firewall**: stateful VPC-level inspection, IDS/IPS, domain allow/deny lists.",
    "**Gateway Load Balancer**: insert third-party virtual appliances (firewalls) transparently, GENEVE port 6081." ] }
], tables: [
  { caption: "Security group vs NACL", head: ["", "Security group", "Network ACL"], rows: [
    ["Level", "ENI / instance", "Subnet"],
    ["State", "Stateful (return traffic auto-allowed)", "Stateless (allow ephemeral 1024–65535 back)"],
    ["Rules", "Allow only", "Allow and Deny, evaluated by number, lowest first"],
    ["Block one bad IP", "Can't", "Yes — Deny rule"],
    ["Reference other groups", "Yes", "No (CIDRs only)"]
  ] },
  { caption: "Connect many networks", head: ["Need", "Answer"], rows: [
    ["2–3 VPCs, simple", "VPC Peering"],
    ["Dozens of VPCs + on-prem, transitive", "Transit Gateway"],
    ["Share one app with 100 customer VPCs, overlapping CIDRs", "PrivateLink (NLB + endpoint service)"],
    ["Encrypted on-prem link today", "Site-to-Site VPN"],
    ["Consistent high bandwidth, private", "Direct Connect (+ VPN for encryption/backup)"]
  ] }
] },
{ id: "edge", title: "DNS & edge (Route 53, CloudFront, Global Accelerator)", domain: "Performant / Resilient", module: "Networking", sections: [
  { h: "Route 53 routing policies", b: [
    "**Simple**: one record, no health checks.",
    "**Weighted**: split traffic by %, canary / blue-green.",
    "**Latency**: send to the Region with the lowest latency for the user.",
    "**Failover**: active-passive with health checks.",
    "**Geolocation**: by user's country/continent — compliance, localized content. Needs a default record.",
    "**Geoproximity**: by distance with a bias to shift traffic (Traffic Flow).",
    "**Multivalue answer**: up to 8 healthy records; client-side spreading, not a load balancer.",
    "**IP-based**: route by client CIDR." ] },
  { h: "Records", b: [
    "**Alias**: points to AWS resources (ELB, CloudFront, S3 website, API GW), free queries, **works at zone apex**. CNAME cannot be used at the apex.",
    "Health checks can monitor endpoints, other health checks, or CloudWatch alarms (for private resources).",
    "Private hosted zone: DNS inside VPCs." ] },
  { h: "CloudFront", b: [
    "CDN with edge caching for static and dynamic content; reduces origin load.",
    "Restrict S3 origin with **Origin Access Control (OAC)** (replaces legacy OAI).",
    "**Signed URL** = one file; **signed cookies** = many files (premium area).",
    "Geo restriction (allow/deny countries). Field-level encryption for sensitive form fields.",
    "Custom TLS certificate must be in ACM **us-east-1**.",
    "Origin groups → origin failover. **CloudFront Functions** (lightweight header/URL rewrites) vs **Lambda@Edge** (heavier logic, network calls).",
    "Attach **WAF** and gets Shield Standard automatically." ] },
  { h: "Global Accelerator", b: [
    "Two static **anycast IPs**, traffic rides the AWS backbone to the nearest healthy Regional endpoint (ALB, NLB, EC2, EIP).",
    "TCP/UDP, **non-HTTP** use cases (gaming, VoIP, IoT), fast Regional failover, IP allow-listing. No caching.",
    "**S3 Transfer Acceleration** = faster long-distance **uploads** to S3 via edge locations." ] }
], tables: [
  { caption: "CloudFront vs Global Accelerator", head: ["", "CloudFront", "Global Accelerator"], rows: [
    ["Layer", "HTTP/HTTPS", "TCP/UDP"],
    ["Caching", "Yes", "No"],
    ["IPs", "Changing edge IPs", "2 static anycast IPs"],
    ["Typical clue", "static content, images, video, lower origin load", "gaming/UDP, static IP, fast multi-Region failover"]
  ] }
] },
{ id: "s3", title: "Amazon S3", domain: "Resilient / Cost / Secure", module: "Storage", sections: [
  { h: "Facts", b: [
    "11 nines durability. Max object **5 TB**; single PUT max 5 GB; **multipart** recommended > 100 MB, required > 5 GB.",
    "Performance per prefix: **3,500** PUT/COPY/POST/DELETE and **5,500** GET/HEAD per second. Spread keys over prefixes to scale.",
    "Strong read-after-write consistency.",
    "Events → SNS, SQS, Lambda, or EventBridge (EventBridge for many targets/filtering)." ] },
  { h: "Protection", b: [
    "**Versioning** protects against overwrite/delete. **MFA Delete** needs root + MFA.",
    "**Object Lock** (needs versioning) = WORM. *Governance* mode: special permission can bypass. *Compliance* mode: **nobody, not even root**, can delete until retention ends. Legal hold = no expiry date.",
    "**Replication** (CRR / SRR): versioning on both buckets; only **new** objects (use **S3 Batch Replication** for existing); not chained.",
    "**Block Public Access** on by default; ACLs disabled by default (Object Ownership: bucket owner enforced)." ] },
  { h: "Encryption", b: [
    "**SSE-S3** is the default for new objects. **SSE-KMS**: key control + CloudTrail audit of key use (watch KMS request quotas). **DSSE-KMS**: two layers. **SSE-C**: you send the key each request, HTTPS required. Client-side: encrypt before upload.",
    "Enforce HTTPS: bucket policy Deny when `aws:SecureTransport` is false.",
    "S3 Bucket Keys reduce KMS request cost." ] },
  { h: "Access", b: [
    "**Presigned URL**: temporary access with the signer's permissions (download or upload) — for private objects shared with users who have no AWS creds.",
    "**Access Points**: per-application policies on a shared bucket. **Object Lambda**: transform objects on GET (e.g. redact PII).",
    "Static website hosting is HTTP only → put **CloudFront** in front for HTTPS.",
    "**Requester Pays**: requester pays transfer cost.",
    "S3 Select / Athena to query in place; **Storage Lens** and **Inventory** for visibility; **Batch Operations** for bulk changes." ] }
], tables: [
  { caption: "Storage classes (min duration · retrieval)", head: ["Class", "Use when", "Min days", "Retrieval"], rows: [
    ["Standard", "Frequent access", "—", "ms"],
    ["Intelligent-Tiering", "Unknown/changing patterns; no retrieval fees, small monitoring fee", "—", "ms (archive tiers optional)"],
    ["Standard-IA", "Infrequent, needs ms, multi-AZ", "30", "ms + per-GB fee"],
    ["One Zone-IA", "Infrequent, re-creatable data", "30", "ms + fee"],
    ["Glacier Instant Retrieval", "Accessed ~once a quarter, needs ms", "90", "ms"],
    ["Glacier Flexible Retrieval", "Archive, minutes–hours ok", "90", "Expedited 1–5 min · Standard 3–5 h · Bulk 5–12 h"],
    ["Glacier Deep Archive", "Cheapest, 7–10 yr compliance", "180", "Standard 12 h · Bulk 48 h"],
    ["Express One Zone", "Single-digit ms, very high request rate, one AZ", "—", "ms (directory buckets)"]
  ] }
] },
{ id: "blockfile", title: "Block, file, hybrid storage & transfer", domain: "Performant / Resilient", module: "Storage", sections: [
  { h: "EBS", b: [
    "Network block volume, **locked to one AZ**. Move across AZ/Region via **snapshot** (incremental, stored in S3).",
    "**gp3**: 3,000 IOPS / 125 MB/s baseline, tune IOPS and throughput independently of size; cheaper than gp2 → default answer.",
    "**gp2**: IOPS tied to size (3 IOPS/GB, burst).",
    "**io2 Block Express / io1**: provisioned IOPS for databases, sub-ms; **Multi-Attach** (same AZ, cluster-aware FS).",
    "**st1**: throughput HDD (big data, logs). **sc1**: cold HDD, cheapest. HDD can't be boot volumes.",
    "Encrypt an existing unencrypted volume: snapshot → copy snapshot **with encryption** → create volume.",
    "**Data Lifecycle Manager** automates snapshots; **Fast Snapshot Restore** removes first-read latency; Recycle Bin protects against accidental deletion." ] },
  { h: "Instance store", b: [ "Physically attached, highest IOPS, **lost on stop/terminate**. Caches, buffers, scratch, replicated data." ] },
  { h: "File systems", b: [
    "**EFS**: NFS for **Linux**, multi-AZ, grows automatically, thousands of concurrent clients across AZs. Lifecycle to IA/Archive classes. Throughput modes: elastic, provisioned, bursting.",
    "**FSx for Windows File Server**: SMB, Active Directory, Windows ACLs, DFS.",
    "**FSx for Lustre**: HPC / ML, hundreds of GB/s, links to an S3 bucket. Scratch (temp, cheap) vs persistent.",
    "**FSx for NetApp ONTAP**: NFS + SMB + iSCSI, Linux/Windows/macOS, snapshots, dedupe — migrate NetApp.",
    "**FSx for OpenZFS**: NFS, migrate ZFS workloads." ] },
  { h: "Hybrid & transfer", b: [
    "**Storage Gateway**: *S3 File Gateway* (NFS/SMB → S3 objects, local cache) · *FSx File Gateway* (low-latency local access to FSx for Windows) · *Volume Gateway* (iSCSI; cached = primary in S3, stored = primary on-prem, async backup) · *Tape Gateway* (virtual tapes → S3/Glacier for backup software).",
    "**DataSync**: online, scheduled, incremental copy NFS/SMB/HDFS/object → S3/EFS/FSx; agent on-prem; preserves metadata.",
    "**Snowball Edge**: offline transfer of TBs–PBs when the network would take weeks; Compute Optimized for edge processing. (Snowcone and Snowmobile are retired but can still show up in older questions.)",
    "**Transfer Family**: managed SFTP/FTPS/FTP into S3 or EFS — keep partners' existing SFTP workflow.",
    "**AWS Backup**: central policies across EBS, RDS, DynamoDB, EFS, FSx…; cross-Region/account copies; **Vault Lock** for WORM backups." ] }
], tables: [
  { caption: "Pick the file service", head: ["Clue", "Answer"], rows: [
    ["Shared POSIX storage for Linux EC2 across AZs", "EFS"],
    ["Windows, SMB, Active Directory", "FSx for Windows File Server"],
    ["HPC, ML training, sub-ms, S3 data", "FSx for Lustre"],
    ["NFS + SMB + iSCSI multiprotocol", "FSx for NetApp ONTAP"],
    ["On-prem apps keep NFS/SMB but data lands in S3", "S3 File Gateway"],
    ["Replace tape library", "Tape Gateway"]
  ] }
] },
{ id: "compute", title: "Compute: EC2, Lambda, containers", domain: "Performant / Cost", module: "Compute", sections: [
  { h: "Purchase options", b: [
    "**On-Demand**: no commitment, short/unpredictable.",
    "**Savings Plans**: commit $/hour for 1 or 3 years. *Compute SP* covers any family, Region, OS, Fargate and Lambda. *EC2 Instance SP* = one family in one Region, bigger discount.",
    "**Reserved Instances**: Standard (biggest discount, fixed) vs Convertible (can change family).",
    "**Spot**: up to ~90% off, 2-minute interruption notice → stateless, fault-tolerant, batch, CI, big data. Spot Fleet / ASG mixed instances.",
    "**Dedicated Host**: BYOL per socket/core, host-level visibility. **Dedicated Instance**: single-tenant hardware, no host control.",
    "**On-Demand Capacity Reservation**: guarantees capacity in an AZ, no discount on its own (pair with a Savings Plan)." ] },
  { h: "EC2 features", b: [
    "Placement groups: **Cluster** (one AZ, low latency, HPC) · **Spread** (separate hardware, max 7 instances per AZ per group) · **Partition** (racks for HDFS/Kafka/Cassandra, up to 7 partitions per AZ).",
    "**Hibernate** saves RAM to an encrypted EBS root volume → fast resume.",
    "**EFA** for tightly coupled HPC/MPI; ENA for enhanced networking.",
    "Instance metadata at 169.254.169.254 (use IMDSv2). User data runs at first boot.",
    "AMIs are Regional; copy to other Regions for DR.",
    "Families: M/T general (T = burstable) · C compute · R/X memory · I/D storage · P/G/Inf/Trn accelerated. **Graviton** = better price-performance." ] },
  { h: "Lambda", b: [
    "Max **15 min** runtime, up to **10,240 MB** memory (CPU scales with memory), /tmp up to 10 GB, container images up to 10 GB.",
    "Default **1,000** concurrent executions per Region (soft). **Reserved** concurrency caps/guarantees; **Provisioned** concurrency removes cold starts. SnapStart for Java.",
    "In a VPC, Lambda needs a NAT Gateway (or endpoints) to reach the internet/AWS services.",
    "Many DB connections from Lambda → **RDS Proxy**.",
    "Jobs > 15 min → ECS/Fargate, Batch or Step Functions." ] },
  { h: "Containers & PaaS", b: [
    "**ECS** on EC2 (you manage instances) or **Fargate** (serverless, no servers to manage → 'least operational overhead').",
    "**EKS** = Kubernetes (choose when the question says Kubernetes or wants portability with existing K8s).",
    "IAM **task roles** give per-task permissions. Images in **ECR**.",
    "**App Runner**: simplest way to run a containerized web app from source/image.",
    "**Elastic Beanstalk**: upload code, it provisions EC2/ASG/ELB — quick for traditional web apps.",
    "**AWS Batch**: managed batch job scheduling on EC2/Spot/Fargate.",
    "**Outposts** = AWS on-prem · **Local Zones** = low latency near metro · **Wavelength** = 5G edge." ] }
] },
{ id: "elb", title: "Load balancing & Auto Scaling", domain: "Resilient / Performant", module: "Compute", sections: [
  { h: "ELB types", b: [
    "**ALB** (L7): HTTP/HTTPS/gRPC/WebSocket, path/host/header/query routing, Lambda + IP + instance targets, Cognito/OIDC auth, redirects. Client IP in `X-Forwarded-For`.",
    "**NLB** (L4): TCP/UDP/TLS, millions of req/s, ultra-low latency, **static IP / Elastic IP per AZ**, preserves source IP, fronts PrivateLink services.",
    "**GWLB** (L3): third-party appliances (firewall, IDS) with GENEVE.",
    "Cross-zone load balancing: on by default for ALB, off by default for NLB/GWLB.",
    "Sticky sessions (cookies), deregistration delay (connection draining), SNI for multiple TLS certs, ACM certs on listeners." ] },
  { h: "Auto Scaling", b: [
    "Launch **template** (launch configurations are legacy). Min / desired / max across multiple AZs.",
    "Policies: **target tracking** (keep CPU at 50%) · step · simple · **scheduled** (known peaks, e.g. 9 am Mondays) · **predictive** (ML on history).",
    "Scale on queue depth: custom metric **backlog per instance** = SQS visible messages ÷ instances.",
    "Health checks: EC2 status by default; enable **ELB health checks** so the ASG replaces instances failing the app check.",
    "Lifecycle hooks (run scripts before in-service/terminate), warm pools (pre-initialized), instance refresh (rolling AMI update).",
    "Default termination: balance AZs first, then oldest launch template/config." ] }
], tables: [
  { caption: "ALB vs NLB vs GWLB", head: ["Clue", "Answer"], rows: [
    ["Route /api and /images to different services", "ALB"],
    ["Static IP for firewall allow-list, TCP/UDP, extreme performance", "NLB"],
    ["Inspect all traffic with a 3rd-party firewall fleet", "GWLB"],
    ["Expose service via PrivateLink", "NLB"]
  ] }
] },
{ id: "db", title: "Databases", domain: "Performant / Resilient", module: "Database", sections: [
  { h: "RDS", b: [
    "**Multi-AZ (instance)**: synchronous standby in another AZ, automatic failover via DNS (~1–2 min). Standby is **not readable** → it's for availability, not scaling.",
    "**Multi-AZ DB cluster**: 1 writer + 2 **readable** standbys (MySQL/PostgreSQL), faster failover.",
    "**Read replicas**: asynchronous, scale reads (up to 15 for MySQL/MariaDB/PostgreSQL), can be cross-Region and **promoted** for DR. App must point reads at them.",
    "Backups: automated 1–35 days with point-in-time restore; manual snapshots kept until deleted.",
    "Encrypt only at creation. Encrypt existing DB: snapshot → copy encrypted → restore.",
    "**RDS Proxy**: connection pooling (Lambda), reduces failover time, enforces IAM auth.",
    "Storage autoscaling. **RDS Custom** when you need OS/DB admin access (Oracle, SQL Server)." ] },
  { h: "Aurora", b: [
    "MySQL/PostgreSQL compatible; storage = **6 copies across 3 AZs**, auto-grows; up to 15 low-lag replicas; **reader endpoint** load-balances reads; failover usually < 30 s.",
    "**Aurora Serverless v2**: capacity scales in fine steps — variable or unpredictable workloads.",
    "**Global Database**: storage-level replication to secondary Regions, typically < 1 s lag; promote in about a minute → low RPO/RTO cross-Region DR and local reads.",
    "Cloning (fast test copies), Backtrack (MySQL, rewind without restore), I/O-Optimized pricing for I/O-heavy workloads." ] },
  { h: "DynamoDB", b: [
    "Serverless key-value/document, single-digit ms at any scale. Item max **400 KB**.",
    "Capacity: **on-demand** (unpredictable) or **provisioned** + auto scaling (steady, cheaper).",
    "**GSI** any time, different partition key; **LSI** only at table creation, same partition key.",
    "**DAX**: in-memory cache → **microsecond** reads, no app logic change beyond the DAX client.",
    "**Streams** (24 h) → Lambda triggers. **Global Tables**: multi-Region, active-active.",
    "TTL expires items free. PITR up to 35 days. Transactions supported." ] },
  { h: "Caching & specialty", b: [
    "**ElastiCache Redis/Valkey**: replication, Multi-AZ, persistence, sorted sets (leaderboards), pub/sub. **Memcached**: simple, multithreaded, no persistence.",
    "Use for session state and DB query caching (needs app code changes). Lazy loading vs write-through.",
    "**MemoryDB**: durable in-memory primary database (Redis-compatible).",
    "**Redshift**: columnar OLAP warehouse; **Spectrum** queries S3; Serverless option. Not for OLTP.",
    "**DocumentDB** = MongoDB · **Neptune** = graph (social, fraud, recommendations) · **Keyspaces** = Cassandra · **Timestream** = time series (IoT) · **OpenSearch** = full-text search/log analytics.",
    "**QLDB** (ledger) reached end of support in July 2025 but may still appear in question banks as the 'immutable verifiable ledger' answer." ] }
], tables: [
  { caption: "Multi-AZ vs read replica", head: ["", "Multi-AZ (instance)", "Read replica"], rows: [
    ["Replication", "Synchronous", "Asynchronous"],
    ["Purpose", "High availability", "Read scaling (and DR if cross-Region)"],
    ["Readable?", "No", "Yes"],
    ["Failover", "Automatic", "Manual promotion"]
  ] },
  { caption: "Which database?", head: ["Clue", "Answer"], rows: [
    ["Relational, minimal admin, MySQL", "RDS MySQL / Aurora MySQL"],
    ["Relational, cross-Region DR, RPO ~1 s", "Aurora Global Database"],
    ["Key-value, millions of req/s, serverless", "DynamoDB"],
    ["Microsecond reads on DynamoDB", "DAX"],
    ["Complex analytics / BI on TBs", "Redshift"],
    ["Graph relationships", "Neptune"]
  ] }
] },
{ id: "analytics", title: "Analytics & streaming", domain: "Performant / Cost", module: "Analytics", sections: [
  { h: "Query & ETL", b: [
    "**Athena**: serverless SQL directly on S3, pay per TB scanned. Cut cost with **Parquet/ORC**, partitioning, compression.",
    "**Glue**: serverless ETL + **Data Catalog** (crawlers infer schema); convert CSV → Parquet; job bookmarks avoid reprocessing.",
    "**EMR**: managed Spark/Hadoop/Hive clusters for big data; Spot for task nodes.",
    "**Lake Formation**: build and govern a data lake on S3 with fine-grained (column/row) permissions.",
    "**QuickSight**: serverless BI dashboards. **OpenSearch**: search & log analytics with dashboards." ] },
  { h: "Streaming", b: [
    "**Kinesis Data Streams**: real-time, ordered per shard, **replay**, retention 24 h up to 365 days, multiple custom consumers. Shard = 1 MB/s or 1,000 records/s in, 2 MB/s out. On-demand mode available.",
    "**Amazon Data Firehose** (formerly Kinesis Data Firehose): fully managed **delivery** to S3, Redshift, OpenSearch, Splunk, HTTP; buffers (near real-time), optional Lambda transform; no replay, no consumer code.",
    "**Managed Service for Apache Flink** (formerly Kinesis Data Analytics): real-time analytics/SQL on streams.",
    "**MSK**: managed Kafka — when the question says Kafka.",
    "Kinesis Video Streams: video ingestion for ML/playback." ] }
], tables: [
  { caption: "Streams vs Firehose vs SQS", head: ["Need", "Answer"], rows: [
    ["Real-time, multiple consumers, replay", "Kinesis Data Streams"],
    ["Load streaming data into S3/Redshift with no code", "Data Firehose"],
    ["Decouple workers, each message processed once", "SQS"],
    ["Existing Kafka apps", "MSK"]
  ] }
] },
{ id: "integration", title: "Application integration & serverless", domain: "Resilient", module: "Application Integration", sections: [
  { h: "SQS", b: [
    "**Standard**: nearly unlimited throughput, at-least-once, best-effort order. **FIFO**: strict order per message group, exactly-once processing, 300 msg/s (3,000 with batching; higher in high-throughput mode), name ends `.fifo`.",
    "Visibility timeout default 30 s (max 12 h) — raise it if processing is longer than that, or messages get processed twice.",
    "Retention 4 days default, up to 14. Classic exam size limit 256 KB → bigger payloads in S3 with a pointer.",
    "**Long polling** (`WaitTimeSeconds` up to 20) cuts empty responses and cost.",
    "**DLQ** after maxReceiveCount failures. Delay queues up to 15 min.",
    "Decoupling + buffer in front of a DB or slow workers → the default 'absorb spikes' answer." ] },
  { h: "SNS & EventBridge", b: [
    "**SNS**: pub/sub push to SQS, Lambda, HTTP, email, SMS. **Fan-out** = SNS topic → many SQS queues. Message filtering policies. FIFO topics for ordered fan-out.",
    "**EventBridge**: event bus with content-based rules; AWS service events, **SaaS partner** events, cross-account buses, archive & replay, **Scheduler** (cron) and **Pipes**." ] },
  { h: "Orchestration & APIs", b: [
    "**Step Functions**: visual state machines, retries/catch, parallel, wait, human approval. Standard (up to 1 year) vs Express (≤ 5 min, high volume).",
    "**API Gateway**: REST / HTTP / WebSocket APIs; throttling, usage plans & API keys, caching, Cognito or Lambda authorizers; edge-optimized, Regional or private endpoints.",
    "**Amazon MQ**: managed ActiveMQ/RabbitMQ — migrate apps using JMS/AMQP/MQTT/STOMP **without rewriting**.",
    "**AppSync**: managed GraphQL with real-time subscriptions." ] }
], tables: [
  { caption: "Messaging pick", head: ["Clue", "Answer"], rows: [
    ["One message → many independent consumers", "SNS → SQS fan-out"],
    ["Strict order, no duplicates", "SQS FIFO"],
    ["React to AWS/SaaS events with rules", "EventBridge"],
    ["Multi-step workflow with branching and retries", "Step Functions"],
    ["On-prem app uses AMQP/JMS, lift to AWS", "Amazon MQ"]
  ] }
] },
{ id: "secsvc", title: "Security services & encryption", domain: "Secure", module: "Security", sections: [
  { h: "Keys & secrets", b: [
    "**KMS**: managed keys; customer managed keys give you key policy control + rotation; envelope encryption (direct Encrypt is limited to 4 KB); every use logged in CloudTrail; **multi-Region keys**.",
    "**CloudHSM**: single-tenant HSM, FIPS 140 Level 3, **you** own and manage keys, AWS can't access them.",
    "**Secrets Manager**: store DB creds/API keys with **automatic rotation** (native for RDS/Aurora/Redshift), cross-Region replication. Costs per secret.",
    "**SSM Parameter Store**: config and SecureString values, free standard tier, **no built-in rotation**.",
    "**ACM**: free public TLS certs with auto-renewal for ELB, CloudFront, API Gateway." ] },
  { h: "Protect & detect", b: [
    "**WAF** (L7): SQL injection, XSS, **rate-based** rules, geo match, IP sets. Attach to CloudFront, ALB, API Gateway, AppSync, Cognito.",
    "**Shield Standard**: free L3/L4 DDoS protection. **Shield Advanced**: paid, 24/7 Shield Response Team, DDoS cost protection.",
    "**Firewall Manager**: central WAF/Shield/SG/Network Firewall policies across an Organization.",
    "**GuardDuty**: ML threat detection from CloudTrail, VPC Flow Logs, DNS logs (+ S3, EKS, RDS, Lambda, malware scans). No agents.",
    "**Inspector**: vulnerability scanning of EC2, ECR images, Lambda.",
    "**Macie**: discovers **PII/sensitive data in S3**.",
    "**Security Hub**: aggregates findings + best-practice checks. **Detective**: investigate root cause.",
    "**Config**: resource config history + compliance rules, auto-remediation via SSM Automation.",
    "**Artifact**: download AWS compliance reports (SOC, PCI, ISO).",
    "**Directory Service**: Managed Microsoft AD (real AD in AWS) · AD Connector (proxy to on-prem AD) · Simple AD." ] }
], tables: [
  { caption: "Security service decoder", head: ["Clue", "Answer"], rows: [
    ["Find PII in S3", "Macie"],
    ["Detect compromised instance / crypto-mining / unusual API calls", "GuardDuty"],
    ["CVE scan of EC2 and container images", "Inspector"],
    ["Block SQL injection / rate-limit an IP", "WAF"],
    ["Rotate DB password automatically", "Secrets Manager"],
    ["Keys in dedicated HSM you control", "CloudHSM"],
    ["Is every bucket encrypted? auto-fix", "Config rule + remediation"]
  ] }
] },
{ id: "monitor", title: "Monitoring & management", domain: "Resilient / Secure", module: "Monitoring", sections: [
  { h: "CloudWatch", b: [
    "EC2 metrics every 5 min (detailed = 1 min). **Memory and disk usage need the CloudWatch agent.**",
    "Alarms → SNS, Auto Scaling, EC2 actions (stop, terminate, reboot, **recover**).",
    "Logs: metric filters, Logs Insights queries, subscription filters → Lambda/Kinesis/OpenSearch; export to S3.",
    "Dashboards (cross-account), Synthetics canaries, Container Insights." ] },
  { h: "CloudTrail vs Config vs X-Ray", b: [
    "**CloudTrail** = *who did what API call when*. Management events on by default (90-day Event history). Create a trail → S3 for long-term; **organization trail** for all accounts; data events (S3 object-level, Lambda invoke) are extra; log file integrity validation.",
    "**Config** = *what did this resource look like / is it compliant*.",
    "**X-Ray** = distributed tracing, find latency bottlenecks across microservices." ] },
  { h: "Operations", b: [
    "**Systems Manager**: Session Manager, Patch Manager, Run Command, Automation, Parameter Store, Inventory.",
    "**CloudFormation**: infrastructure as code; **StackSets** deploy across accounts and Regions.",
    "**Trusted Advisor**: cost, security, fault tolerance, limits checks. **Compute Optimizer**: rightsizing.",
    "**AWS Health Dashboard**: AWS events affecting your resources (EventBridge integration)." ] }
] },
{ id: "dr", title: "Resilience & disaster recovery", domain: "Resilient", module: "Architecture Patterns", sections: [
  { h: "Terms", b: [
    "**RPO** = how much data you can lose (time since last good copy). **RTO** = how long until you're back.",
    "Resilience inside a Region = **Multi-AZ** (ELB + ASG across AZs, RDS Multi-AZ, EFS, S3). Across Regions = DR strategy.",
    "Stateless app tier: sessions in ElastiCache/DynamoDB, files in S3/EFS, async work via SQS.",
    "**Elastic Disaster Recovery (DRS)**: continuous block-level replication of servers, RPO seconds, RTO minutes, cheap staging." ] },
  { h: "Well-Architected pillars", b: [
    "Operational Excellence · Security · Reliability · Performance Efficiency · Cost Optimization · Sustainability." ] }
], tables: [
  { caption: "DR strategies (cheapest → fastest)", head: ["Strategy", "What runs in DR Region", "RTO/RPO", "Cost"], rows: [
    ["Backup & restore", "Only backups (snapshots, AWS Backup copies)", "Hours", "$"],
    ["Pilot light", "Core data replicated live; app servers off/minimal", "10s of minutes", "$$"],
    ["Warm standby", "Full stack running at reduced size", "Minutes", "$$$"],
    ["Multi-site active/active", "Full stack serving traffic", "Near zero", "$$$$"]

<script>window.QUESTIONS=[{"id":"01-1","q":"A company is deploying a new application on AWS and needs to ensure the highest level of availability and fault tolerance. The application must continue to operate even if an entire data center fails. Which AWS infrastructure component should be used?","options":{"A":"Deploy across multiple Edge Locations","B":"Deploy across multiple Availability Zones within a single Region","C":"Deploy across multiple Regions","D":"Deploy using AWS Local Zones"},"answer":["B"],"explanation":"• Availability Zones (AZs) are separate data centers within a Region\n• Deploying across multiple AZs protects against data center failure\n• This is the standard approach for high availability within a Region\n• Option C (multiple Regions) is for disaster recovery, not just data center failure\n• Edge Locations are for content delivery, not application hosting\n• Local Zones are for ultra-low latency but don't provide the same fault tolerance","module":"AWS Fundamentals","multi":false,"src":"repo"},{"id":"01-2","q":"A solutions architect needs to design a solution that minimizes latency for users accessing static content globally. Which combination of AWS services should be used?","options":{"A":"Amazon S3 with Cross-Region Replication","B":"Amazon CloudFront with S3 as the origin","C":"Amazon S3 with Transfer Acceleration","D":"Multiple EC2 instances in different Regions"},"answer":["B"],"explanation":"• CloudFront is AWS's Content Delivery Network (CDN) with 400+ edge locations globally\n• It caches content close to users, minimizing latency\n• S3 serves as the origin for static content\n• Option A provides redundancy but doesn't optimize latency\n• Option C accelerates uploads, not downloads\n• Option D is cost-ineffective and complex to manage","module":"AWS Fundamentals","multi":false,"src":"repo"},{"id":"01-3","q":"According to the AWS Shared Responsibility Model, which of the following is AWS's responsibility?","options":{"A":"Encryption of data at rest in S3","B":"Patch management of guest operating systems on EC2","C":"Physical security of data centers","D":"Configuration of security groups"},"answer":["C"],"explanation":"• AWS is responsible for \"Security OF the Cloud\" - physical infrastructure\n• This includes data centers, hardware, and facilities\n• Customers are responsible for \"Security IN the Cloud\"\n• Options A, B, and D are all customer responsibilities\n• Customers choose whether to encrypt, patch OS, and configure security","module":"AWS Fundamentals","multi":false,"src":"repo"},{"id":"01-4","q":"A startup company wants to deploy an application without managing servers, operating systems, or runtime environments. Which AWS service category best fits this requirement?","options":{"A":"Infrastructure as a Service (IaaS)","B":"Platform as a Service (PaaS)","C":"Software as a Service (SaaS)","D":"Function as a Service (FaaS)"},"answer":["B"],"explanation":"• PaaS services (like Elastic Beanstalk) abstract infrastructure management\n• Users deploy code without managing servers or OS\n• IaaS (like EC2) requires managing virtual machines\n• SaaS is fully managed applications (like Amazon Chime)\n• FaaS (like Lambda) is event-driven, not for full applications typically\n• PaaS is the best fit for deploying applications without infrastructure management","module":"AWS Fundamentals","multi":false,"src":"repo"},{"id":"01-5","q":"A company has regulatory requirements to ensure that data stored in AWS does not leave a specific geographic location. How can this be achieved?","options":{"A":"Enable AWS GuardDuty","B":"Choose the appropriate AWS Region and do not enable cross-region features","C":"Use AWS Organizations with Service Control Policies","D":"Enable AWS CloudTrail"},"answer":["B"],"explanation":"• Data in an AWS Region stays in that Region unless you explicitly configure otherwise\n• No cross-region replication, backups, or data transfer ensures data residency\n• GuardDuty is for threat detection, not data residency\n• SCPs can enforce policies but the key is choosing the right Region\n• CloudTrail is for logging, not data residency\n• Primary control: select Region and don't configure cross-region services","module":"AWS Fundamentals","multi":false,"src":"repo"},{"id":"01-6","q":"Which pillar of the AWS Well-Architected Framework focuses on the ability to recover from failures and dynamically acquire computing resources to meet demand?","options":{"A":"Operational Excellence","B":"Security","C":"Reliability","D":"Performance Efficiency"},"answer":["C"],"explanation":"• Reliability pillar focuses on recovery from failures and maintaining workload functionality\n• Key aspects: fault tolerance, disaster recovery, self-healing\n• Operational Excellence focuses on operations and monitoring\n• Security focuses on protecting information and systems\n• Performance Efficiency focuses on using resources efficiently","module":"AWS Fundamentals","multi":false,"src":"repo"},{"id":"01-7","q":"A company wants to estimate the cost of running their planned AWS infrastructure before deployment. Which AWS tool should they use?","options":{"A":"AWS Cost Explorer","B":"AWS Budgets","C":"AWS Pricing Calculator","D":"AWS Cost and Usage Report"},"answer":["C"],"explanation":"• AWS Pricing Calculator estimates costs for planned architectures\n• Cost Explorer analyzes existing/historical costs\n• AWS Budgets sets budget alerts\n• Cost and Usage Report provides detailed billing data\n• For estimation BEFORE deployment, Pricing Calculator is correct","module":"AWS Fundamentals","multi":false,"src":"repo"},{"id":"01-8","q":"An application requires 15 milliseconds or less of latency for users in a specific metropolitan area. Which AWS infrastructure component should be used?","options":{"A":"AWS Region","B":"Availability Zone","C":"AWS Local Zone","D":"AWS Wavelength Zone"},"answer":["C"],"explanation":"• AWS Local Zones bring compute, storage, and database closer to end-users\n• Designed for single-digit millisecond latency requirements\n• Placed in metropolitan areas for ultra-low latency applications\n• Wavelength Zones are for 5G edge computing\n• Regular Regions/AZs may not meet ultra-low latency requirements","module":"AWS Fundamentals","multi":false,"src":"repo"},{"id":"01-9","q":"Which AWS service provides a unified interface to manage multiple AWS accounts within an organization?","options":{"A":"AWS IAM","B":"AWS Organizations","C":"AWS Control Tower","D":"AWS Systems Manager"},"answer":["B"],"explanation":"• AWS Organizations centrally manages multiple AWS accounts\n• Provides consolidated billing, account creation, and policy management\n• IAM manages permissions within an account\n• Control Tower sets up multi-account environments (uses Organizations underneath)\n• Systems Manager manages AWS resources, not accounts\n• Direct answer for multi-account management: Organizations","module":"AWS Fundamentals","multi":false,"src":"repo"},{"id":"01-10","q":"According to the AWS Well-Architected Framework, which design principle is recommended for the Security pillar?","options":{"A":"Implement a strong identity foundation","B":"Go global in minutes","C":"Stop spending money on data center operations","D":"Implement feedback loops"},"answer":["A"],"explanation":"• \"Implement a strong identity foundation\" is a Security pillar principle\n• Includes: least privilege, separation of duties, centralized identity management\n• Option B relates to global deployment (general AWS benefit)\n• Option C is a cloud advantage, not security principle\n• Option D relates to Operational Excellence pillar","module":"AWS Fundamentals","multi":false,"src":"repo"},{"id":"01-11","q":"A company wants to use AWS CLI to manage resources but wants to avoid embedding long-term credentials in their scripts. What is the BEST practice?","options":{"A":"Use root account credentials","B":"Create an IAM user and store credentials in the script","C":"Use IAM roles with temporary security credentials","D":"Use access keys without secret keys"},"answer":["C"],"explanation":"• IAM roles provide temporary security credentials via AWS STS\n• Credentials rotate automatically, enhancing security\n• Never use root account credentials for daily tasks\n• Never hardcode credentials in scripts\n• Access keys always require secret keys\n• Best practice: IAM roles with temporary credentials","module":"AWS Fundamentals","multi":false,"src":"repo"},{"id":"01-12","q":"Which of the following is a benefit of using AWS Regions? (Choose TWO)","options":{"A":"Reduced latency for users in specific geographic areas","B":"Automatic data replication across all Regions","C":"Compliance with data sovereignty requirements","D":"Lower costs compared to using a single Region","E":"Automatic failover between Regions"},"answer":["A","C"],"explanation":"• A is correct: Deploying in Regions closer to users reduces latency\n• C is correct: Regions enable meeting data residency/sovereignty requirements\n• B is incorrect: Replication is NOT automatic, must be configured\n• D is incorrect: Multiple Regions typically increase costs\n• E is incorrect: Failover is NOT automatic, requires architecture design","module":"AWS Fundamentals","multi":true,"src":"repo"},{"id":"01-13","q":"A solutions architect needs to design a system that follows the \"Design for Failure\" principle of the Well-Architected Framework. Which approach should be taken?","options":{"A":"Use only the largest EC2 instance types to prevent failures","B":"Design the application to handle component failures gracefully","C":"Deploy all resources in a single Availability Zone for simplicity","D":"Rely on AWS Support to handle all failures"},"answer":["B"],"explanation":"• \"Design for Failure\" means assuming components will fail and planning accordingly\n• Applications should handle failures gracefully with retry logic, health checks, etc.\n• Larger instances don't prevent failures\n• Single AZ deployment increases failure risk\n• You must design for failure, not rely solely on support\n• Proper approach: graceful degradation, automatic recovery","module":"AWS Fundamentals","multi":false,"src":"repo"},{"id":"01-14","q":"Which statement about AWS Edge Locations is correct?","options":{"A":"Edge Locations are only used for CloudFront content delivery","B":"There are fewer Edge Locations than Regions","C":"Edge Locations can be used for both content delivery and edge computing","D":"Edge Locations are the same as Availability Zones"},"answer":["C"],"explanation":"• Edge Locations support CloudFront (CDN), Lambda@Edge, and other edge services\n• There are 400+ edge locations vs 30+ Regions\n• Edge Locations ≠ Availability Zones (different purposes)\n• Used for content delivery AND edge computing (Lambda@Edge, CloudFront Functions)","module":"AWS Fundamentals","multi":false,"src":"repo"},{"id":"01-15","q":"A company wants to receive alerts when their monthly AWS costs exceed a threshold. Which service should they use?","options":{"A":"AWS Cost Explorer","B":"AWS Budgets","C":"AWS Pricing Calculator","D":"AWS Trusted Advisor"},"answer":["B"],"explanation":"• AWS Budgets allows setting custom cost/usage budgets with alerts\n• Can send notifications via SNS when thresholds are exceeded\n• Cost Explorer visualizes historical costs but doesn't send alerts\n• Pricing Calculator estimates future costs\n• Trusted Advisor provides best practice recommendations\n• For threshold alerts: AWS Budgets","module":"AWS Fundamentals","multi":false,"src":"repo"},{"id":"01-16","q":"According to the AWS Shared Responsibility Model, who is responsible for patching the underlying hypervisor for EC2 instances?","options":{"A":"Customer","B":"AWS","C":"Both AWS and Customer","D":"Third-party vendors"},"answer":["B"],"explanation":"• AWS manages the hypervisor layer (security OF the cloud)\n• Customers manage guest OS patches (security IN the cloud)\n• Hypervisor is infrastructure, AWS's responsibility\n• Customer patches OS, applications, data encryption","module":"AWS Fundamentals","multi":false,"src":"repo"},{"id":"01-17","q":"A company wants to deploy applications closer to 5G mobile users for ultra-low latency. Which AWS service should be used?","options":{"A":"AWS Local Zones","B":"AWS Wavelength","C":"AWS Outposts","D":"AWS Direct Connect"},"answer":["B"],"explanation":"• AWS Wavelength embeds compute at 5G network edge\n• Provides single-digit millisecond latency to mobile devices\n• Local Zones are for metro areas but not 5G-specific\n• Outposts is for on-premises AWS infrastructure\n• Direct Connect is for dedicated network connection\n• For 5G mobile: Wavelength","module":"AWS Fundamentals","multi":false,"src":"repo"},{"id":"01-18","q":"Which pillar of the AWS Well-Architected Framework includes the principle \"Stop guessing your capacity needs\"?","options":{"A":"Cost Optimization","B":"Performance Efficiency","C":"Reliability","D":"Operational Excellence"},"answer":["B"],"explanation":"• Performance Efficiency pillar includes capacity planning principles\n• \"Stop guessing capacity\" - use Auto Scaling and elastic services\n• Enables right-sizing and dynamic capacity adjustment\n• Cost Optimization focuses on eliminating waste\n• Reliability focuses on recovery and testing\n• Operational Excellence focuses on running/monitoring","module":"AWS Fundamentals","multi":false,"src":"repo"},{"id":"01-19","q":"A company has multiple development teams that need separate AWS accounts for isolation. They want consolidated billing. What should they implement?","options":{"A":"AWS Control Tower","B":"AWS Organizations with consolidated billing","C":"Multiple IAM users in one account","D":"AWS Resource Groups"},"answer":["B"],"explanation":"• AWS Organizations provides consolidated billing across multiple accounts\n• Each team gets isolated account with separate resources\n• Single bill for entire organization\n• Control Tower helps set up Organizations but Organizations is the direct answer\n• IAM users don't provide account-level isolation\n• Resource Groups organize resources, not billing","module":"AWS Fundamentals","multi":false,"src":"repo"},{"id":"01-20","q":"What is the primary purpose of Availability Zones within an AWS Region?","options":{"A":"To provide different pricing tiers","B":"To enable fault tolerance and high availability","C":"To support different AWS services","D":"To reduce data transfer costs"},"answer":["B"],"explanation":"• Availability Zones are isolated locations within a Region\n• Primary purpose: fault tolerance and high availability\n• Each AZ has independent power, cooling, networking\n• Deploying across AZs protects against single point of failure\n• Not for pricing, service availability, or cost reduction\n• Core purpose: resilience and availability","module":"AWS Fundamentals","multi":false,"src":"repo"},{"id":"01-21","q":"A company has 50 AWS accounts and wants to centrally manage billing and apply organization-wide security policies. Which AWS service should they use?","options":{"A":"AWS IAM","B":"AWS Organizations","C":"AWS Control Tower","D":"AWS Systems Manager"},"answer":["B"],"explanation":"• AWS Organizations is the service for managing multiple AWS accounts\n• Provides consolidated billing across all accounts\n• Enables Service Control Policies (SCPs) for organization-wide policies\n• Can create Organizational Units (OUs) for logical grouping\n• Control Tower (C) is built on Organizations but is for automated setup\n• IAM (A) is for user/role management within a single account\n• Systems Manager (D) is for operations, not multi-account management","module":"AWS Fundamentals","multi":false,"src":"repo"},{"id":"01-22","q":"A security team wants to prevent all member accounts in their AWS Organization from creating resources in any region except us-east-1 and eu-west-1. How should this be implemented?","options":{"A":"Create IAM policies in each account restricting regions","B":"Use AWS Config rules to detect non-compliant resources","C":"Create a Service Control Policy (SCP) denying actions in other regions","D":"Use AWS Firewall Manager to block region access"},"answer":["C"],"explanation":"• Service Control Policies (SCPs) provide centralized, preventive controls\n• SCPs can restrict which AWS regions can be used\n• Applied at the Organization, OU, or account level\n• Cannot be overridden by users in member accounts\n• IAM policies (A) can be changed by account administrators\n• Config rules (B) are detective, not preventive\n• Firewall Manager (D) is for security group/WAF rules, not region restrictions\nSCP Example:","module":"AWS Fundamentals","multi":false,"src":"repo"},{"id":"01-23","q":"Which of the following statements about Service Control Policies (SCPs) is TRUE?","options":{"A":"SCPs grant permissions to users and roles","B":"SCPs affect the management account in an AWS Organization","C":"SCPs define maximum permissions for member accounts","D":"SCPs can only be applied to individual accounts, not OUs"},"answer":["C"],"explanation":"• SCPs define maximum permissions - they act as guardrails\n• SCPs do NOT grant permissions (A is wrong)\n• They only restrict what is possible\n• SCPs do NOT affect the management account (B is wrong)\n• SCPs can be applied to Organization root, OUs, or accounts (D is wrong)\n• Effective permissions = IAM policy AND SCP\nKey SCP Rules:\n• ❌ Don't grant permissions\n• ❌ Don't affect management account\n• ✅ Set maximum permission boundaries\n• ✅ Can be applied to OUs\n• ✅ Inherited down the hierarchy","module":"AWS Fundamentals","multi":false,"src":"repo"},{"id":"01-24","q":"A company wants to quickly set up a secure, multi-account AWS environment following best practices with automated account provisioning and pre-configured governance guardrails. Which service should they use?","options":{"A":"AWS Organizations","B":"AWS Control Tower","C":"AWS CloudFormation StackSets","D":"AWS Service Catalog"},"answer":["B"],"explanation":"• AWS Control Tower provides automated multi-account setup\n• Includes Landing Zone (well-architected baseline)\n• Pre-configured guardrails (preventive and detective)\n• Account Factory for automated provisioning\n• Built on top of AWS Organizations\n• AWS Organizations (A) requires manual setup\n• CloudFormation StackSets (C) deploys templates, not governance\n• Service Catalog (D) is for self-service IT resources\nControl Tower Features:\n• ✅ Automated setup (minutes vs days)\n• ✅ Pre-built guardrails\n• ✅ Account Factory\n• ✅ Compliance dashboard\n• ✅ Integrated with Organizations, IAM Identity Center, CloudTrail\nWhen to Use:\n• Quick setup with best practices\n• Less AWS expertise required\n• Want pre-built governance\nWhen to Use Organizations Directly:\n• Need maximum flexibility\n• Have custom requirements\n• Experienced AWS team","module":"AWS Fundamentals","multi":false,"src":"repo"},{"id":"01-25","q":"A company has a centralized networking account and wants to share VPC subnets with multiple application accounts without duplicating VPC infrastructure. Which AWS service enables this?","options":{"A":"VPC Peering","B":"AWS Transit Gateway","C":"AWS Resource Access Manager (RAM)","D":"AWS PrivateLink"},"answer":["C"],"explanation":"• AWS Resource Access Manager (RAM) allows sharing resources across accounts\n• Can share VPC subnets between accounts\n• Resources remain in owner account, but accessible to shared accounts\n• No need to duplicate VPCs\n• VPC Peering (A) connects VPCs but doesn't share subnets\n• Transit Gateway (B) connects networks but doesn't share subnets\n• PrivateLink (D) is for service-to-VPC connectivity\nBenefits of Subnet Sharing with RAM:\n• ✅ Centralized network management\n• ✅ Reduced VPC sprawl\n• ✅ Efficient IP address usage\n• ✅ Simplified network architecture\n• ✅ Lower operational overhead\nOther Shareable Resources via RAM:\n• VPC Subnets (most common)\n• Transit Gateway attachments\n• Route 53 Resolver rules\n• License Manager configurations\n• Aurora DB clusters\n• Prefix lists","module":"AWS Fundamentals","multi":false,"src":"repo"},{"id":"01-26","q":"A company uses AWS Organizations with consolidated billing. They notice they're receiving volume discounts on S3 storage even though no single account uses enough storage to qualify. Why?","options":{"A":"AWS provides automatic discounts for Organizations","B":"Consolidated billing combines usage across all accounts for volume pricing","C":"The management account gets all the discounts","D":"SCPs enable cost savings automatically"},"answer":["B"],"explanation":"• Consolidated billing combines usage across all accounts\n• AWS treats the entire organization as a single billing entity\n• Volume discounts apply to combined usage\n• Example: 3 accounts with 500GB each = 1500GB total → higher tier pricing\n• Not automatic discounts (A), just usage aggregation\n• All accounts benefit, not just management account (C)\n• SCPs are for permissions, not costs (D)\nConsolidated Billing Benefits:\n• ✅ Volume discounts across accounts\n• ✅ Single payment method\n• ✅ Easier cost tracking\n• ✅ Cost allocation tags across org\n• ✅ Reserved Instance sharing","module":"AWS Fundamentals","multi":false,"src":"repo"},{"id":"01-27","q":"Which AWS Organizations feature allows you to create policies that prevent accounts from leaving the organization?","options":{"A":"IAM Policy","B":"Service Control Policy (SCP)","C":"Resource Control Policy","D":"Organizational Lock"},"answer":["B"],"explanation":"• Service Control Policies (SCPs) can prevent accounts from leaving\n• SCP can deny the `organizations:LeaveOrganization` action\n• Applied at Organization or OU level\n• Cannot be overridden by member accounts","module":"AWS Fundamentals","multi":false,"src":"repo"},{"id":"02-1","q":"An application running on Amazon EC2 instances needs to access objects in an Amazon S3 bucket. What is the MOST secure way to grant this access?","options":{"A":"Create an IAM user with programmatic access and store the access keys on the EC2 instance","B":"Create an IAM role with S3 permissions and attach it to the EC2 instance","C":"Make the S3 bucket public and allow anonymous access","D":"Use the root account credentials on the EC2 instance"},"answer":["B"],"explanation":"• IAM roles provide temporary security credentials that rotate automatically\n• No need to manage or embed long-term credentials\n• Most secure and AWS-recommended approach\n• Option A: Access keys are long-term credentials, security risk if exposed\n• Option C: Violates security best practices\n• Option D: Never use root credentials for applications\n• Best Practice: Always use IAM roles for EC2 instances","module":"IAM","multi":false,"src":"repo"},{"id":"02-2","q":"A company needs to grant temporary access to external auditors to review CloudTrail logs in S3. The access should expire after 7 days. What is the BEST solution?","options":{"A":"Create IAM users for auditors and delete them after 7 days","B":"Create IAM roles and provide auditors with temporary security credentials using AWS STS","C":"Share the root account credentials for 7 days","D":"Create an S3 pre-signed URL valid for 7 days"},"answer":["B"],"explanation":"• AWS STS (Security Token Service) generates temporary credentials\n• IAM roles can be assumed by external users via federation\n• Credentials automatically expire based on session duration\n• Option A: Requires manual deletion, operational overhead\n• Option C: Never share root credentials\n• Option D: Pre-signed URLs work but IAM roles are more comprehensive\n• Best for temporary access: STS with IAM roles","module":"IAM","multi":false,"src":"repo"},{"id":"02-3","q":"A solutions architect is writing an IAM policy to deny access to all S3 buckets except one specific bucket named \"production-data\". Which policy element should be used?\n\n```json\n{\n  \"Version\": \"2012-10-17\",\n  \"Statement\": [\n    {\n      \"Effect\": \"Allow\",\n      \"Action\": \"s3:*\",\n      \"Resource\": [\n        \"arn:aws:s3:::production-data\",\n        \"arn:aws:s3:::production-data/*\"\n      ]\n    },\n    {\n      \"Effect\": \"Deny\",\n      \"Action\": \"s3:*\",\n      \"Resource\": \"*\",\n      \"Condition\": {\n        \"StringNotEquals\": {\n          \"s3:ResourceAccount\": \"${aws:PrincipalAccount}\"\n        }\n      }\n    }\n  ]\n}\n```\n\nWhat is the correct approach?","options":{"A":"Use Allow effect for the specific bucket only","B":"Use Deny effect for all buckets except the one","C":"Use both Allow for specific bucket and implicit Deny for others","D":"Use resource-based policy on S3 bucket"},"answer":["C"],"explanation":"• IAM uses default Deny for all actions not explicitly allowed\n• Allow access to \"production-data\" bucket explicitly\n• All other buckets are implicitly denied\n• No need for explicit Deny statement for other buckets\n• IAM Evaluation Logic: Explicit Deny > Allow > Implicit Deny\n• Simpler policy: Just Allow the specific bucket\nCorrect Policy:","module":"IAM","multi":false,"src":"repo"},{"id":"02-4","q":"A company has a requirement that all IAM users must use Multi-Factor Authentication (MFA) before they can delete any S3 objects. How can this be enforced?","options":{"A":"Enable MFA Delete on the S3 bucket","B":"Create an IAM policy with a condition requiring MFA","C":"Use AWS Organizations Service Control Policies","D":"Configure S3 bucket policy to require MFA"},"answer":["B"],"explanation":"• IAM policy condition `aws:MultiFactorAuthPresent` enforces MFA\n• Can be applied to specific actions like `s3:DeleteObject`","module":"IAM","multi":false,"src":"repo"},{"id":"02-5","q":"A development team needs read-only access to all EC2 instances, but write access should only be granted during business hours (9 AM - 5 PM). How can this be implemented?","options":{"A":"Use time-based IAM policy conditions","B":"Manually attach/detach policies during business hours","C":"Use AWS Lambda to modify IAM policies based on time","D":"Create two separate IAM groups and move users between them"},"answer":["A"],"explanation":"• IAM supports time-based conditions using `aws:CurrentTime`\n• Can specify date/time ranges for policy evaluation","module":"IAM","multi":false,"src":"repo"},{"id":"02-6","q":"A company wants to allow users to change their own passwords but nothing else. Which AWS managed policy should be attached?","options":{"A":"IAMFullAccess","B":"IAMUserChangePassword","C":"IAMReadOnlyAccess","D":"PowerUserAccess"},"answer":["B"],"explanation":"• `IAMUserChangePassword` is an AWS managed policy for self-service password changes\n• Follows principle of least privilege\n• Allows users to manage only their own passwords\n• Option A: Too permissive, full IAM access\n• Option C: Read-only, can't change passwords\n• Option D: Almost full access except IAM\nAlternative: Create custom policy:","module":"IAM","multi":false,"src":"repo"},{"id":"02-7","q":"An organization has multiple AWS accounts. They want to centrally manage permissions across all accounts. What is the BEST solution?","options":{"A":"Create identical IAM policies in each account","B":"Use AWS Organizations with Service Control Policies (SCPs)","C":"Use IAM roles in each account","D":"Share IAM users across accounts"},"answer":["B"],"explanation":"• Service Control Policies (SCPs) set permission boundaries for entire AWS accounts\n• Applied at organization, OU, or account level\n• Centrally managed from master/management account\n• Maximum permissions available, individual IAM policies still needed\n• Option A: Not centralized, difficult to maintain\n• Option C: Roles help with cross-account access but don't centrally manage permissions\n• Option D: IAM users cannot be shared across accounts\nSCP Example (Deny all regions except us-east-1):","module":"IAM","multi":false,"src":"repo"},{"id":"02-8","q":"A company uses SAML 2.0 to allow employees to access AWS using their corporate Active Directory credentials. What type of access is this?","options":{"A":"IAM user access","B":"Root account access","C":"Federated access","D":"Programmatic access"},"answer":["C"],"explanation":"• Federation allows users to access AWS using existing corporate credentials\n• SAML 2.0 is a standard for identity federation\n• Users authenticate with corporate IdP (like Active Directory)\n• IdP provides temporary AWS credentials via IAM role assumption\n• No need to create IAM users for each employee\n• Types of Federation: SAML 2.0, OpenID Connect, Custom Identity Broker\nFederation Flow:\n1. User authenticates with corporate IdP\n2. IdP generates SAML assertion\n3. User presents assertion to AWS STS\n4. STS returns temporary credentials\n5. User accesses AWS with temp credentials","module":"IAM","multi":false,"src":"repo"},{"id":"02-9","q":"Which statement about IAM policies is correct?","options":{"A":"Identity-based policies are attached to resources","B":"Resource-based policies are attached to IAM identities","C":"Identity-based policies define permissions for users, groups, and roles","D":"Resource-based policies cannot specify principals from other accounts"},"answer":["C"],"explanation":"• Identity-based policies: Attached to users, groups, roles (who can do what)\n• Resource-based policies: Attached to resources like S3, SQS (who can access this resource)\n• Option A: Incorrect, identity-based policies attach to identities\n• Option B: Incorrect, resource-based policies attach to resources\n• Option D: Incorrect, resource-based policies CAN specify cross-account principals","module":"IAM","multi":false,"src":"repo"},{"id":"02-10","q":"A Lambda function needs to access DynamoDB tables. What is the correct way to grant permissions?","options":{"A":"Create an IAM user for the Lambda function","B":"Create an IAM execution role for the Lambda function","C":"Add permissions directly to the Lambda function","D":"Use resource-based policy on DynamoDB"},"answer":["B"],"explanation":"• Lambda execution role defines what the function can access\n• Role is assumed by Lambda service when function executes\n• Attach policies to role (e.g., AmazonDynamoDBFullAccess or custom policy)\n• Option A: Lambda functions cannot use IAM users\n• Option C: No such mechanism, must use IAM roles\n• Option D: DynamoDB doesn't have resource-based policies like S3\nLambda Execution Role Policy Example:","module":"IAM","multi":false,"src":"repo"},{"id":"02-11","q":"What does the following IAM policy condition do?\n\n```json\n\"Condition\": {\n  \"IpAddress\": {\n    \"aws:SourceIp\": \"203.0.113.0/24\"\n  }\n}\n```","options":{"A":"Allows access only from the specified IP range","B":"Denies access from the specified IP range","C":"Logs access from the specified IP range","D":"Routes traffic through the specified IP range"},"answer":["A"],"explanation":"• Condition restricts policy effectiveness to requests from specified IP range\n• When used with \"Effect\": \"Allow\", grants access only from those IPs\n• When used with \"Effect\": \"Deny\", denies access from those IPs\n• Does not log or route traffic\n• Use Case: Restrict access to corporate network IPs\nComplete Policy Example:","module":"IAM","multi":false,"src":"repo"},{"id":"02-12","q":"A company wants to ensure that IAM users cannot create EC2 instances larger than t3.medium. How can this be enforced?","options":{"A":"Use IAM policy with condition checking instance type","B":"Use AWS Config rules","C":"Use AWS Budgets","D":"Use EC2 instance limits"},"answer":["A"],"explanation":"• IAM policy conditions can restrict EC2 instance types\n• Condition key: `ec2:InstanceType`\nPolicy Example:\n• Option B: Config rules detect compliance, don't prevent actions\n• Option C: Budgets monitor costs, don't restrict actions\n• Option D: Service limits are for account-wide quotas, not policy-based restrictions","module":"IAM","multi":false,"src":"repo"},{"id":"02-13","q":"What is the maximum n
